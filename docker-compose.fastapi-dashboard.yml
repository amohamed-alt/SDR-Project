name: sdr-fastapi-dashboard

services:
  dashboard-fastapi-gateway:
    image: alpine:3.21
    restart: "no"
    mem_limit: "16m"
    cpus: 0.05
    pids_limit: 16
    labels:
      - "traefik.enable=false"
    command:
      - /bin/sh
      - -c
      - |
        echo "Legacy public FastAPI dashboard gateway retired"
        exit 0
