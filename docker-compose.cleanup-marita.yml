name: sdr-marita-task-cleanup

services:
  cleanup:
    image: alpine:3.21
    restart: "no"
    environment:
      SIGNALHIRE_API_KEY: ${SIGNALHIRE_API_KEY:-}
    command:
      - /bin/sh
      - -c
      - |
        set -eu

        test -n "$$SIGNALHIRE_API_KEY" || {
          echo "FATAL: SIGNALHIRE_API_KEY is required for the protected cleanup endpoint." >&2
          exit 78
        }

        READY=false
        for ATTEMPT in $$(seq 1 60); do
          if wget -qO /tmp/health.json --timeout=8 http://sdr-dashboard:3000/api/health 2>/dev/null; then
            READY=true
            break
          fi
          echo "Internal dashboard not ready yet (attempt $$ATTEMPT/60)."
          sleep 10
        done

        if [ "$$READY" != "true" ]; then
          echo "FATAL: internal SDR dashboard never became reachable." >&2
          exit 1
        fi

        echo "Internal SDR dashboard is reachable. Running approved Marita / Extensive Lighter cleanup."

        if ! wget -qO /tmp/cleanup.json \
          --timeout=1800 \
          --header='Content-Type: application/json' \
          --header="x-acquisition-worker-key: $$SIGNALHIRE_API_KEY" \
          --post-data='{"execute":true}' \
          http://sdr-dashboard:3000/api/hubspot/cleanup-marita-extensive-lighter; then
          echo "FATAL: cleanup endpoint request failed." >&2
          cat /tmp/cleanup.json 2>/dev/null || true
          exit 1
        fi

        cat /tmp/cleanup.json

        if grep -Eq '"status"[[:space:]]*:[[:space:]]*"(completed|already_completed)"' /tmp/cleanup.json; then
          echo "Marita Extensive Lighter cleanup completed successfully."
          exit 0
        fi

        echo "FATAL: cleanup endpoint returned an unexpected status." >&2
        exit 1
    networks:
      - sdr_internal

networks:
  sdr_internal:
    external: true
    name: sdr-project_default
