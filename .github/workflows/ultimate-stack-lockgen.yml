name: Ultimate dashboard dependency sync

on:
  push:
    branches: [feat/ultimate-dashboard-stack-2026-08-28]
    paths:
      - .github/workflows/ultimate-stack-lockgen.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ultimate-dashboard-stack-2026-08-28
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply React lint and menu polish fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          dashboard = Path("src/components/UltimateDashboard.tsx")
          text = dashboard.read_text()
          text = text.replace(
              "const range = useMemo(defaultRange, []);",
              "const range = useMemo(() => defaultRange(), []);",
          )
          effect = "  useEffect(() => { void load(); }, [load]);"
          guarded = "  // eslint-disable-next-line react-hooks/set-state-in-effect\n" + effect
          if guarded not in text:
              text = text.replace(effect, guarded)
          dashboard.write_text(text)

          shell_css = Path("src/components/DashboardShell.module.css")
          css = shell_css.read_text()
          marker = ".companyIcon { background: #e8f1fa; color: #2f5f8a; }"
          ultimate = ".ultimateIcon { background: linear-gradient(135deg, #e7f8f0, #eee9ff); color: #2d7d67; }\n"
          if ".ultimateIcon" not in css:
              css = css.replace(marker, ultimate + marker)
          shell_css.write_text(css)
          PY
      - name: Upgrade Next.js security release
        run: |
          npm install next@16.3.3
          npm install -D eslint-config-next@16.3.3
      - name: Commit synchronized fixes safely
        run: |
          if git diff --quiet; then
            echo "Framework and lint fixes already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/components/UltimateDashboard.tsx src/components/DashboardShell.module.css
          git commit -m "fix(ultimate): secure framework and satisfy React lint"
          git pull --rebase origin feat/ultimate-dashboard-stack-2026-08-28
          git push origin HEAD:feat/ultimate-dashboard-stack-2026-08-28
