name: Ultimate dashboard validation

on:
  push:
    branches: [feat/ultimate-dashboard-stack-2026-08-28]
    paths:
      - .github/workflows/ultimate-stack-validate.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DEMO_MODE: "true"
      DISABLE_AUTH: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ultimate-dashboard-stack-2026-08-28
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke
