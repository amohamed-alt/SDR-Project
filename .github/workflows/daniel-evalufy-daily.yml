name: Daniel Queue Manual Audit

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview the transfer plan without changing HubSpot
        required: false
        default: 'true'

permissions:
  contents: read

concurrency:
  group: daniel-queue-manual-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://sdr.dashboardtalentera.tech
      OWNER_TOKEN: ${{ secrets.ACQUISITION_OWNER_TOKEN || secrets.DASHBOARD_PASSWORD }}
      DRY_RUN: ${{ inputs.dry_run || 'true' }}
    steps:
      - name: Validate admin token
        run: |
          set -euo pipefail
          test -n "$OWNER_TOKEN" || { echo "::error::Admin automation token is required"; exit 1; }

      - name: Run Daniel transfer plan audit
        run: |
          set -euo pipefail
          payload=$(jq -n --arg dry "$DRY_RUN" '{dryRun: ($dry == "true")}')
          code=$(curl -sS --connect-timeout 10 --max-time 300 \
            -o /tmp/result.json -w '%{http_code}' \
            -X POST "$BASE_URL/api/daniel-transfer-plan" \
            -H 'Content-Type: application/json' \
            -H "x-acquisition-owner-token: $OWNER_TOKEN" \
            -d "$payload")
          cat /tmp/result.json | jq .
          if [ "$DRY_RUN" = "true" ]; then
            [ "$code" = 200 ] || [ "$code" = 409 ] || exit 1
          else
            [ "$code" = 200 ] || exit 1
          fi
