name: Patch SDR Admin Gate

on:
  push:
    branches: [feat/sdr-admin-password-gate]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/sdr-admin-password-gate
      - name: Apply admin password UX and server gate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # Target Pool: remove visible/session owner key and rely on the server admin cookie.
          path = "src/components/TargetAccountPool.tsx"
          replace(path, "  KeyRound,\n", "")
          replace(path,
          '''const OWNER_STORAGE_KEY = "sdr-acquisition-owner-token";\n\nfunction savedOwnerToken() {\n  if (typeof window === "undefined") return "";\n  return window.sessionStorage.getItem(OWNER_STORAGE_KEY) || "";\n}\n\n''', "")
          replace(path,
          '''  const [notice, setNotice] = useState("");\n  const [ownerToken, setOwnerToken] = useState(savedOwnerToken);\n  const [ownerDraft, setOwnerDraft] = useState(savedOwnerToken);\n''',
          '''  const [notice, setNotice] = useState("");\n  const [adminUnlocked, setAdminUnlocked] = useState(false);\n''')
          replace(path,
          '''  useEffect(() => {\n    const timer = window.setTimeout(() => void load(), 0);\n    return () => window.clearTimeout(timer);\n  }, [load]);\n''',
          '''  useEffect(() => {\n    const timer = window.setTimeout(() => void load(), 0);\n    return () => window.clearTimeout(timer);\n  }, [load]);\n\n  useEffect(() => {\n    let active = true;\n    fetch("/api/sdr-admin", { cache: "no-store" })\n      .then((response) => response.json())\n      .then((data: { unlocked?: boolean }) => { if (active) setAdminUnlocked(Boolean(data.unlocked)); })\n      .catch(() => { if (active) setAdminUnlocked(false); });\n    const sync = () => {\n      fetch("/api/sdr-admin", { cache: "no-store" })\n        .then((response) => response.json())\n        .then((data: { unlocked?: boolean }) => { if (active) setAdminUnlocked(Boolean(data.unlocked)); })\n        .catch(() => { if (active) setAdminUnlocked(false); });\n    };\n    window.addEventListener("sdr:admin-auth-changed", sync);\n    return () => { active = false; window.removeEventListener("sdr:admin-auth-changed", sync); };\n  }, []);\n''')
          replace(path,
          '''  function saveOwnerKey() {\n    const value = ownerDraft.trim();\n    setOwnerToken(value);\n    if (value) window.sessionStorage.setItem(OWNER_STORAGE_KEY, value);\n    else window.sessionStorage.removeItem(OWNER_STORAGE_KEY);\n    setNotice(value ? "Owner key saved for this browser session." : "Owner key cleared.");\n  }\n\n  async function ownerAction(url: string, body: Record<string, unknown>) {\n    if (!ownerToken) throw new Error("Enter the Owner key first.");\n    const response = await fetch(url, {\n      method: "POST",\n      headers: { "Content-Type": "application/json", "x-acquisition-owner-token": ownerToken },\n      body: JSON.stringify(body),\n    });\n    const data = await response.json() as Record<string, unknown> & { error?: string };\n    if (!response.ok) throw new Error(data.error || "Target Pool action failed.");\n    return data;\n  }\n''',
          '''  async function ownerAction(url: string, body: Record<string, unknown>) {\n    const response = await fetch(url, {\n      method: "POST",\n      headers: { "Content-Type": "application/json" },\n      body: JSON.stringify(body),\n    });\n    const data = await response.json() as Record<string, unknown> & { error?: string };\n    if (response.status === 401) {\n      setAdminUnlocked(false);\n      window.dispatchEvent(new CustomEvent("sdr:admin-auth-changed"));\n      throw new Error("Admin access is locked. Open SDR Tools → Advanced & Data Ops and enter the admin password.");\n    }\n    if (!response.ok) throw new Error(data.error || "Target Pool action failed.");\n    return data;\n  }\n''')
          replace(path, '!payload?.configuration.apolloConfigured || !ownerToken', '!payload?.configuration.apolloConfigured || !adminUnlocked')
          replace(path,
          '''        <div className={styles.divider}/>\n        <label className={styles.owner}><span><KeyRound size={14}/> Owner key</span><input type="password" value={ownerDraft} onChange={(event) => setOwnerDraft(event.target.value)} placeholder="Session-only key"/></label>\n        <button className={styles.save} type="button" onClick={saveOwnerKey}><ShieldCheck size={15}/> Save key</button>\n        <div className={styles.guard}><BadgeCheck size={15}/><span><strong>Credit guard</strong> Dormant pool accounts trigger zero SignalHire reveals. Marita queue is explicit.</span></div>\n''',
          '''        <div className={styles.divider}/>\n        <div className={styles.guard}><BadgeCheck size={15}/><span><strong>{adminUnlocked ? "Admin unlocked" : "Admin locked"}</strong>{adminUnlocked ? " Administrative actions are ready. No browser key is required." : " Open SDR Tools → Advanced & Data Ops and enter the admin password."}</span></div>\n        <div className={styles.guard}><ShieldCheck size={15}/><span><strong>Credit guard</strong> Dormant pool accounts trigger zero SignalHire reveals. Marita queue is explicit.</span></div>\n''')
          text = Path(path).read_text().replace('!ownerToken', '!adminUnlocked')
          Path(path).write_text(text)

          # Target Pool server auth: cookie for browser, legacy header for automations.
          path = "src/app/api/target-account-pool/route.ts"
          replace(path, 'import { timingSafeEqual } from "node:crypto";\n', '')
          replace(path, 'import { scoreTalenteraAccount } from "@/lib/talentera-intelligence";\n', 'import { scoreTalenteraAccount } from "@/lib/talentera-intelligence";\nimport { sdrAdminAuthorized, sdrAdminConfigured } from "@/lib/sdr-admin-auth";\n')
          replace(path,
          '''function safeEqual(left: string, right: string) {\n  const a = Buffer.from(left);\n  const b = Buffer.from(right);\n  return a.length === b.length && timingSafeEqual(a, b);\n}\n\n''', '')
          replace(path,
          '''function ownerAuthorized(request: NextRequest) {\n  const supplied = clean(request.headers.get("x-acquisition-owner-token"), 500);\n  const configured = clean(process.env.ACQUISITION_OWNER_TOKEN || process.env.DASHBOARD_PASSWORD, 500);\n  return Boolean(supplied && configured && safeEqual(supplied, configured));\n}\n''',
          '''function ownerAuthorized(request: NextRequest) {\n  return sdrAdminAuthorized(request);\n}\n''')
          replace(path,
          '    ownerActionsConfigured: Boolean(clean(process.env.ACQUISITION_OWNER_TOKEN || process.env.DASHBOARD_PASSWORD, 500)),',
          '    ownerActionsConfigured: sdrAdminConfigured(),')

          # Acquisition server auth: same cookie gate, preserving trusted automation headers.
          path = "src/app/api/acquisition/route.ts"
          replace(path, 'import { timingSafeEqual } from "node:crypto";\n', '')
          replace(path, 'import { verifiedActiveJobCount } from "@/lib/acquisition-job-count";\n', 'import { verifiedActiveJobCount } from "@/lib/acquisition-job-count";\nimport { sdrAdminAuthorized, sdrAdminConfigured } from "@/lib/sdr-admin-auth";\n')
          p = Path(path)
          text = p.read_text()
          start = text.index('function safeEqual(left: string, right: string) {')
          end = text.index('\nfunction configuration() {', start)
          text = text[:start] + '''function ownerAuthorized(request: NextRequest) {\n  if (sdrAdminAuthorized(request)) return { ok: true as const };\n  return { ok: false as const, status: 401, error: "Admin password is required for this action." };\n}\n''' + text[end:]
          text = text.replace(
              '    ownerActionsConfigured: Boolean(clean(process.env.ACQUISITION_OWNER_TOKEN || process.env.DASHBOARD_PASSWORD, 500)),',
              '    ownerActionsConfigured: sdrAdminConfigured(),', 1)
          p.write_text(text)

          # DashboardShell: password-gate Advanced & Data Ops.
          path = "src/components/DashboardShell.tsx"
          replace(path,
          '''  const [advancedOpen, setAdvancedOpen] = useState(false);\n  const toolsRef = useRef<HTMLDivElement>(null);\n''',
          '''  const [advancedOpen, setAdvancedOpen] = useState(false);\n  const [adminUnlocked, setAdminUnlocked] = useState(false);\n  const [adminChecked, setAdminChecked] = useState(false);\n  const [adminPrompt, setAdminPrompt] = useState(false);\n  const [adminPassword, setAdminPassword] = useState("");\n  const [adminError, setAdminError] = useState("");\n  const [adminBusy, setAdminBusy] = useState(false);\n  const toolsRef = useRef<HTMLDivElement>(null);\n''')
          replace(path,
          '''  useEffect(() => {\n    const syncFromUrl = () => setView(viewFromUrl());\n    syncFromUrl();\n    window.addEventListener("popstate", syncFromUrl);\n    return () => window.removeEventListener("popstate", syncFromUrl);\n  }, []);\n''',
          '''  useEffect(() => {\n    const syncFromUrl = () => setView(viewFromUrl());\n    syncFromUrl();\n    window.addEventListener("popstate", syncFromUrl);\n    return () => window.removeEventListener("popstate", syncFromUrl);\n  }, []);\n\n  useEffect(() => {\n    let active = true;\n    fetch("/api/sdr-admin", { cache: "no-store" })\n      .then((response) => response.json())\n      .then((data: { unlocked?: boolean }) => {\n        if (!active) return;\n        setAdminUnlocked(Boolean(data.unlocked));\n        setAdminChecked(true);\n      })\n      .catch(() => { if (active) setAdminChecked(true); });\n    return () => { active = false; };\n  }, []);\n''')
          replace(path,
          '''  function changeView(next: ShellView) {\n    const url = new URL(window.location.href);\n''',
          '''  async function unlockAdmin(event: React.FormEvent<HTMLFormElement>) {\n    event.preventDefault();\n    setAdminBusy(true);\n    setAdminError("");\n    try {\n      const response = await fetch("/api/sdr-admin", {\n        method: "POST",\n        headers: { "Content-Type": "application/json" },\n        body: JSON.stringify({ password: adminPassword }),\n      });\n      const data = await response.json() as { unlocked?: boolean; error?: string };\n      if (!response.ok || !data.unlocked) throw new Error(data.error || "Incorrect admin password.");\n      setAdminUnlocked(true);\n      setAdminChecked(true);\n      setAdminPrompt(false);\n      setAdvancedOpen(true);\n      setAdminPassword("");\n      window.dispatchEvent(new CustomEvent("sdr:admin-auth-changed"));\n    } catch (error) {\n      setAdminError(error instanceof Error ? error.message : "Unable to unlock admin tools.");\n    } finally {\n      setAdminBusy(false);\n    }\n  }\n\n  function toggleAdvanced() {\n    if (advancedOpen) { setAdvancedOpen(false); return; }\n    if (adminUnlocked) { setAdvancedOpen(true); setAdminPrompt(false); return; }\n    setAdminPrompt(true);\n    setAdvancedOpen(false);\n  }\n\n  function changeView(next: ShellView) {\n    const adminViews: ShellView[] = ["hiring", "career", "ats-intent", "marita-priority", "team-activity"];\n    if (adminViews.includes(next) && !adminUnlocked) {\n      setView("core");\n      setToolsOpen(true);\n      setAdminPrompt(true);\n      return;\n    }\n    const url = new URL(window.location.href);\n''')
          replace(path,
          '''            <button className={styles.advancedToggle} type="button" onClick={() => setAdvancedOpen((current) => !current)} aria-expanded={advancedOpen}>\n              <span><Wrench size={14}/><strong>Advanced & Data Ops</strong><small>Sources, verification and admin tools</small></span>\n              {advancedOpen ? <ChevronUp size={16}/> : <ChevronDown size={16}/>} \n            </button>\n\n            {advancedOpen ? <div className={styles.advancedList}>\n''',
          '''            <button className={styles.advancedToggle} type="button" onClick={toggleAdvanced} aria-expanded={advancedOpen}>\n              <span><Wrench size={14}/><strong>Advanced & Data Ops</strong><small>{adminUnlocked ? "Admin unlocked · sources, verification and ops" : "Password protected admin tools"}</small></span>\n              {advancedOpen ? <ChevronUp size={16}/> : <ChevronDown size={16}/>} \n            </button>\n\n            {adminPrompt && !adminUnlocked ? <form className={styles.adminGate} onSubmit={(event) => void unlockAdmin(event)}>\n              <strong>Admin password</strong>\n              <small>Enter it once to unlock administrative SDR tools. No Owner key is needed.</small>\n              <input autoFocus type="password" value={adminPassword} onChange={(event) => setAdminPassword(event.target.value)} placeholder="Admin password" autoComplete="current-password"/>\n              {adminError ? <span className={styles.adminError}>{adminError}</span> : null}\n              <button type="submit" disabled={adminBusy || !adminPassword.trim()}>{adminBusy ? "Unlocking…" : "Unlock admin tools"}</button>\n            </form> : null}\n\n            {advancedOpen && adminUnlocked ? <div className={styles.advancedList}>\n''')
          # Keep direct advanced query views from remaining open after a locked browser refresh.
          marker = '''  useEffect(() => {\n    if (!toolsOpen) return;\n'''
          insert = '''  useEffect(() => {\n    if (!adminChecked || adminUnlocked) return;\n    const adminViews: ShellView[] = ["hiring", "career", "ats-intent", "marita-priority", "team-activity"];\n    if (!adminViews.includes(view)) return;\n    const url = new URL(window.location.href);\n    url.searchParams.delete("view");\n    window.history.replaceState({}, "", url);\n    setView("core");\n    setToolsOpen(true);\n    setAdminPrompt(true);\n  }, [adminChecked, adminUnlocked, view]);\n\n'''
          p = Path(path)
          text = p.read_text()
          if marker not in text: raise SystemExit("Dashboard admin-check insertion marker missing")
          p.write_text(text.replace(marker, insert + marker, 1))

          # Styles for the password box.
          path = "src/components/DashboardShell.module.css"
          p = Path(path)
          text = p.read_text()
          if ".adminGate{" not in text:
              text += '''\n.adminGate{margin:6px 4px 3px;padding:12px;border:1px solid #d7e4dd;border-radius:13px;background:linear-gradient(180deg,#f8fcfa,#f2f8f5);display:grid;gap:7px}.adminGate strong{color:#234f3b;font-size:10px;font-weight:900}.adminGate small{color:#72837a;font-size:8px;line-height:1.4}.adminGate input{width:100%;box-sizing:border-box;border:1px solid #cfdcd5;border-radius:9px;background:#fff;padding:9px 10px;color:#173249;font:inherit;font-size:10px;outline:none}.adminGate input:focus{border-color:#55a47c;box-shadow:0 0 0 3px rgba(37,149,95,.1)}.adminGate button{border:0;border-radius:9px;background:#177f4c;color:#fff;padding:9px 10px;font:inherit;font-size:9px;font-weight:900;cursor:pointer}.adminGate button:disabled{opacity:.5;cursor:not-allowed}.adminError{color:#a33c3c;font-size:8px;font-weight:800}\n'''
          p.write_text(text)

          # Remove this one-time patch workflow from the final branch state.
          Path(".github/workflows/patch-sdr-admin-gate.yml").unlink()
          PY
      - name: Commit patched admin gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Replace SDR owner keys with admin password gate"
          git push origin HEAD:feat/sdr-admin-password-gate
