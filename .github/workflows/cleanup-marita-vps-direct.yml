name: Retire Completed Marita Cleanup Project

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-marita-vps-direct.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remove verified completed one-shot project
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -euo pipefail
          AUTH="$HOSTINGER_API_KEY"; case "$AUTH" in Bearer\ *) ;; *) AUTH="Bearer $AUTH" ;; esac
          VM='https://developers.hostinger.com/api/vps/v1/virtual-machines/1604210'
          PROJECT='sdr-marita-task-cleanup'
          req(){ local m="$1" u="$2" o="$3"; curl -sS --connect-timeout 8 --max-time 30 -X "$m" -H "Authorization: $AUTH" -H 'Accept: application/json' -o "$o" -w '%{http_code}' "$u" || true; }
          get_containers(){
            for I in 1 2 3 4 5; do
              C=$(req GET "$VM/docker/$PROJECT/containers" /tmp/containers.json)
              echo "Inventory $I/5: HTTP ${C:-000}"
              [ "$C" = 200 ] && return 0
              [ "$C" = 404 ] && return 2
              sleep $((I * 3))
            done
            return 1
          }
          poll(){ local ID="$1"; [ -z "$ID" ] && return 0; for I in $(seq 1 36); do req GET "$VM/actions/$ID" /tmp/action.json >/dev/null; S=$(jq -r '.state // "unknown"' /tmp/action.json 2>/dev/null || echo unknown); echo "Delete action $I: $S"; case "$S" in success|completed) return 0;; failed|error) cat /tmp/action.json; return 1;; esac; sleep 5; done; return 1; }

          set +e
          get_containers
          RC=$?
          set -e
          [ "$RC" = 2 ] && { echo 'Project already absent.'; exit 0; }
          [ "$RC" = 0 ] || { echo 'Docker Manager still unavailable; no delete attempted.'; exit 1; }

          COUNT=$(jq 'length' /tmp/containers.json)
          RUNNING=$(jq '[.[] | select((.state // "") == "running")] | length' /tmp/containers.json)
          BAD=$(jq '[.[] | select(.image != "alpine:3.21" or .name != "sdr-marita-task-cleanup-cleanup-1")] | length' /tmp/containers.json)
          echo "containers=$COUNT running=$RUNNING unexpected=$BAD"
          jq -r '.[]? | [.name,.image,.state,.status] | @tsv' /tmp/containers.json
          test "$RUNNING" = 0
          test "$BAD" = 0

          D='000'
          for I in 1 2 3; do
            D=$(req DELETE "$VM/docker/$PROJECT/down" /tmp/delete.json)
            echo "Delete request $I/3: HTTP ${D:-000}"
            if [ "$D" -ge 200 ] 2>/dev/null && [ "$D" -lt 300 ] 2>/dev/null; then break; fi
            sleep $((I * 4))
          done
          if ! { [ "$D" -ge 200 ] 2>/dev/null && [ "$D" -lt 300 ] 2>/dev/null; }; then cat /tmp/delete.json 2>/dev/null || true; exit 1; fi
          ID=$(jq -r '.id // .action.id // empty' /tmp/delete.json 2>/dev/null || true)
          poll "$ID"

          H=$(curl -sS --connect-timeout 8 --max-time 20 -o /tmp/health.json -w '%{http_code}' 'https://sdr.dashboardtalentera.tech/api/health?marita_project_removed=1' || true)
          echo "SDR health: HTTP ${H:-000}"
          jq '{status,service,buildRef}' /tmp/health.json 2>/dev/null || true
          test "$H" = 200
