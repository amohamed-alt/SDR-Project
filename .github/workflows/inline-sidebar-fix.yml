name: Verify permanent SDR tools sidebar

on:
  push:
    branches: [fix/sdr-tools-permanent-sidebar-20261001]
    paths: [.github/workflows/inline-sidebar-fix.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/sdr-tools-permanent-sidebar-20261001
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply focused sidebar changes
        shell: python
        run: |
          from pathlib import Path
          import re

          def once(text, before, after):
              count = text.count(before)
              if count != 1:
                  raise RuntimeError(f'Expected one patch anchor, found {count}: {before[:100]}')
              return text.replace(before, after, 1)

          path = Path('src/components/DashboardShell.tsx')
          shell = path.read_text()
          shell = once(shell, 'useEffect, useRef, useState', 'useEffect, useState')
          for icon in ['ChevronDown', 'ChevronUp', 'PhoneIncoming', 'X']:
              shell = once(shell, f'  {icon},\n', '')
          for line in [
              '  const [toolsOpen, setToolsOpen] = useState(false);\n',
              '  const [advancedOpen, setAdvancedOpen] = useState(false);\n',
              '  const toolsRef = useRef<HTMLDivElement>(null);\n',
              '  const toolsCount = sdr === "marita" ? 12 : 11;\n',
          ]:
              shell = once(shell, line, '')
          start = shell.index('  useEffect(() => {\n    if (!toolsOpen) return;')
          end = shell.index('  async function unlockAdmin', start)
          shell = shell[:start] + shell[end:]
          start = shell.index('  function toggleAdvanced() {')
          end = shell.index('  function changeView(', start)
          shell = shell[:start] + shell[end:]
          shell = re.sub(r'^ *setToolsOpen\((?:true|false)\);\n', '', shell, flags=re.M)
          shell = re.sub(r'^ *setAdvancedOpen\(true\);\n', '', shell, flags=re.M)
          start = shell.index('  const toolsMenu = toolsOpen ?')
          end = shell.index('            <button className={styles.toolItem}', start)
          shell = shell[:start] + '''  // Render inside both sidebar layouts; navigation must never depend on a popup.
            const sidebarTools = <section className={styles.sidebarTools} aria-label="SDR Tools">
              <div className={styles.toolsTitle}>SDR TOOLS</div>
              <nav className={styles.toolList} aria-label="SDR tools navigation">
          '''.replace('            const sidebarTools', '  const sidebarTools') + shell[end:]
          shell, count = re.subn(
              r'            <button className=\{styles\.advancedToggle\}[\s\S]*?</button>\n',
              '''            <div className={styles.adminHeading}>
                          <Wrench size={14}/><strong>Admin Tools</strong>
                          <small>{adminUnlocked ? "Unlocked" : "Password protected"}</small>
                        </div>
          ''', shell, count=1)
          assert count == 1, 'Admin heading anchor changed'
          shell = once(shell, 'advancedOpen && adminUnlocked ?', 'adminUnlocked ?')
          shell = once(shell, 'advancedOpen && !adminUnlocked ?', '!adminUnlocked ?')
          shell = once(shell,
              '          </div>\n        </div>\n    </div> : null;\n\n  if (view === "core")',
              '          </nav>\n    </section>;\n\n  if (view === "core")')
          shell = once(shell,
              '      onToggleTools={() => setToolsOpen((current) => !current)}\n      toolsOpen={toolsOpen}\n      toolsCount={toolsCount}\n',
              '      sidebarTools={sidebarTools}\n')
          assert shell.count('    {toolsMenu}\n') == 2
          shell = shell.replace('    {toolsMenu}\n', '')
          shell = once(shell,
              '          <div className="nav-label">WORKSPACE</div>\n          <nav><button type="button" onClick={() => setToolsOpen((current) => !current)} aria-expanded={toolsOpen} aria-controls="sdr-tools-menu"><PhoneIncoming size={18}/><span>SDR Tools</span><small className="sdr-tools-count">{toolsCount}</small></button></nav>\n', '')
          shell = once(shell,
              '<strong>{owner.name}</strong></div><BadgeCheck size={17}/></div>\n        </aside>',
              '<strong>{owner.name}</strong></div><BadgeCheck size={17}/></div>\n          {sidebarTools}\n        </aside>')
          def active_button(match):
              view = match.group(1)
              return '<button className={`${styles.toolItem} ${view === "' + view + '" ? styles.activeTool : ""}`} type="button" aria-current={view === "' + view + '" ? "page" : undefined} onClick={() => changeView("' + view + '")}>'
          shell, count = re.subn(
              r'<button className=\{styles\.toolItem\} type="button" onClick=\{\(\) => changeView\("([a-z-]+)"\)\}>',
              active_button, shell)
          assert count == 7, f'Expected seven internal tool buttons, found {count}'
          assert not any(word in shell for word in ['toolsOpen', 'setToolsOpen', 'advancedOpen', 'toolsRef', 'toolsMenu', 'toggleAdvanced'])
          path.write_text(shell)

          path = Path('src/components/Dashboard.tsx')
          core = path.read_text()
          core = once(core, 'ListTodo, Mail, Menu, Phone, PhoneIncoming,', 'ListTodo, Mail, Phone, PhoneIncoming,')
          core = once(core, '  onToggleTools,\n  toolsOpen = false,\n  toolsCount = 0,\n', '  sidebarTools,\n')
          core = once(core, '  onToggleTools?: () => void;\n  toolsOpen?: boolean;\n  toolsCount?: number;\n', '  sidebarTools?: ReactNode;\n')
          core = once(core,
              '{onToggleTools ? <><div className="nav-label">WORKSPACE</div><nav><button type="button" onClick={onToggleTools} aria-expanded={toolsOpen} aria-controls="sdr-tools-menu"><Menu size={17}/><span>{toolsOpen ? "Close SDR Tools" : "SDR Tools"}</span>{toolsCount ? <small className="sdr-tools-count">{toolsCount}</small> : null}</button></nav></> : null}', '')
          core = once(core,
              '<strong>{data?.meta.ownerName ?? owner.name}</strong></div><BadgeCheck size={17}/></div><div className="sync-card">',
              '<strong>{data?.meta.ownerName ?? owner.name}</strong></div><BadgeCheck size={17}/></div>{sidebarTools}<div className="sync-card">')
          assert not any(word in core for word in ['toolsOpen', 'onToggleTools', 'toolsCount', 'Close SDR Tools'])
          path.write_text(core)

          path = Path('src/components/DashboardShell.module.css')
          path.write_text(path.read_text() + '''

          /* Permanent SDR navigation: one sidebar scroll, no overlay or nested popup. */
          .shell :global(.sidebar) {
            overflow-y: auto;
            overflow-x: hidden;
            overscroll-behavior: contain;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.3) transparent;
          }
          .shell :global(.sidebar) > * { flex-shrink: 0; }
          .sidebarTools { width: 100%; min-width: 0; margin: 4px 0 16px; }
          .toolsTitle {
            padding: 18px 10px 9px;
            color: rgba(255, 255, 255, 0.65);
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.12em;
          }
          .sidebarTools .toolList {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 0;
            max-height: none;
            overflow: visible;
          }
          .sidebarTools .toolItem {
            width: 100%;
            min-height: 40px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 8px;
            border: 1px solid transparent;
            border-radius: 9px;
            color: #fff;
            background: transparent;
            box-shadow: none;
            text-decoration: none;
            transform: none;
          }
          .sidebarTools .toolItem:hover { background: rgba(255, 255, 255, 0.09); transform: none; }
          .sidebarTools .toolItem.activeTool {
            background: rgba(255, 255, 255, 0.17);
            border-color: rgba(255, 255, 255, 0.28);
            box-shadow: inset 3px 0 0 currentColor;
          }
          .sidebarTools .toolItem:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 1px;
          }
          .sidebarTools .toolIcon {
            display: grid;
            place-items: center;
            flex: 0 0 28px;
            width: 28px;
            height: 28px;
            border-radius: 8px;
          }
          .sidebarTools .toolCopy { display: grid; min-width: 0; flex: 1; }
          .sidebarTools .toolCopy strong {
            color: inherit;
            font-size: 11px;
            font-weight: 700;
            line-height: 1.35;
            white-space: normal;
            overflow-wrap: anywhere;
          }
          .sidebarTools .toolCopy small { display: none; }
          .adminHeading {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 7px;
            margin: 10px 0 3px;
            padding: 11px 9px 3px;
            border-top: 1px solid rgba(255, 255, 255, 0.16);
            color: #fff;
          }
          .adminHeading strong { font-size: 10px; }
          .adminHeading small { flex-basis: 100%; color: rgba(255, 255, 255, 0.7); font-size: 9px; }
          .sidebarTools .advancedList {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin: 0;
            padding: 0;
            border: 0;
            border-radius: 0;
            background: transparent;
            animation: none;
          }
          .sidebarTools .lockedTool { opacity: 0.85; }
          .sidebarTools .adminGate { margin: 4px 0; }
          .sidebarTools .adminGate button { justify-content: center; }

          /* Keep labels available instead of turning this workspace into an icon rail. */
          @media (min-width: 641px) and (max-width: 900px) {
            .shell :global(.sidebar) { width: 244px; padding: 20px 14px; }
            .shell :global(.workspace) { grid-template-columns: 244px minmax(0, 1fr); }
            .shell :global(.topbar) { margin-left: 244px; }
            .shell :global(.sidebar .brand),
            .shell :global(.sidebar .owner-card) { display: flex; }
            .shell :global(.sidebar .nav-label),
            .shell :global(.sidebar .brand-subtitle),
            .shell :global(.sidebar nav button span) { display: block; }
          }
          /* Small screens keep an expanded, in-flow menu rather than a hidden bottom drawer. */
          @media (max-width: 640px) {
            .shell :global(.workspace) { display: block; }
            .shell :global(.sidebar) {
              position: relative;
              inset: auto;
              width: 100%;
              height: auto;
              max-height: none;
              flex-direction: column;
              align-items: stretch;
              padding: 16px;
              overflow: visible;
            }
            .shell :global(.topbar) { margin-left: 0; }
            .shell :global(.sidebar .brand),
            .shell :global(.sidebar .owner-card),
            .shell :global(.sidebar .sync-card) { display: flex; }
            .shell :global(.sidebar .nav-label),
            .shell :global(.sidebar .brand-subtitle),
            .shell :global(.sidebar nav button span) { display: block; }
            .shell :global(.sidebar nav) { display: flex; flex-direction: column; }
            .shell :global(.sidebar nav button) { width: 100%; justify-content: flex-start; }
            .sidebarTools .toolList, .sidebarTools .advancedList { max-height: none; overflow: visible; }
            .sidebarTools .toolItem { min-height: 44px; }
          }
          ''')

          Path('tests/sdr-tools-sidebar.test.mjs').write_text('''import test from "node:test";
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const shell = readFileSync(new URL("../src/components/DashboardShell.tsx", import.meta.url), "utf8");
          const core = readFileSync(new URL("../src/components/Dashboard.tsx", import.meta.url), "utf8");
          test("SDR tools have no open/close or outside-click state", () => {
            for (const source of [shell, core]) assert.doesNotMatch(source, /toolsOpen|setToolsOpen|onToggleTools|Close SDR Tools|closeOnOutside|toggleAdvanced/);
            assert.match(shell, /aria-label="SDR tools navigation"/);
          });
          test("both sidebar layouts place tools after the owner", () => {
            assert.match(core, /owner-card[\\s\\S]*?\\{sidebarTools\\}[\\s\\S]*?sync-card/);
            assert.match(shell, /owner-card[\\s\\S]*?\\{sidebarTools\\}[\\s\\S]*?<\\/aside>/);
            assert.match(shell, /sidebarTools=\\{sidebarTools\\}/);
          });
          test("admin tools remain password protected without an accordion", () => {
            assert.match(shell, /fetch\\("\\/api\\/sdr-admin"/);
            assert.match(shell, /adminUnlocked \\? <div className=\\{styles.advancedList\\}/);
            assert.match(shell, /!adminUnlocked \\? <div className=\\{styles.advancedList\\}/);
            assert.doesNotMatch(shell, /advancedOpen/);
          });
          test("the selected internal tool is marked as the current page", () => {
            assert.equal((shell.match(/aria-current=\\{view ===/g) || []).length, 8);
          });
          ''')
          Path('tests/e2e/sdr-tools-sidebar.spec.ts').write_text('''import { test, expect } from "@playwright/test";

          for (const owner of ["marita", "daniel"]) {
            test(`${owner}: tools stay in the sidebar across navigation, reload and escape`, async ({ page }, testInfo) => {
              test.setTimeout(90_000);
              await page.setViewportSize({ width: 1440, height: 1000 });
              await page.goto(`/?acq=${owner}`);
              const sidebar = page.locator("aside.sidebar:visible");
              const tools = sidebar.getByRole("region", { name: "SDR Tools", exact: true });
              await expect(tools).toBeVisible();
              await expect(page.getByRole("button", { name: /^(Close )?SDR Tools$/ })).toHaveCount(0);
              expect(await sidebar.evaluate((element) => {
                const owner = element.querySelector(".owner-card");
                const tools = element.querySelector('[aria-label="SDR Tools"]');
                return Boolean(owner && tools && (owner.compareDocumentPosition(tools) & Node.DOCUMENT_POSITION_FOLLOWING));
              })).toBe(true);
              await tools.getByRole("button", { name: "Calls", exact: true }).click();
              await expect(page).toHaveURL(/view=maqsam/);
              await expect(tools.getByRole("button", { name: "Calls", exact: true })).toHaveAttribute("aria-current", "page");
              await page.keyboard.press("Escape");
              await page.locator(".content:visible").click({ position: { x: 10, y: 10 } });
              await expect(tools).toBeVisible();
              await tools.getByRole("button", { name: "Team Activity", exact: true }).click();
              await expect(page).toHaveURL(/view=team-activity/);
              await tools.getByRole("button", { name: "Lead Inventory", exact: true }).click();
              await expect(page).toHaveURL(/view=inventory/);
              await page.goBack();
              await expect(page).toHaveURL(/view=team-activity/);
              await expect(tools.getByRole("button", { name: "Team Activity", exact: true })).toHaveAttribute("aria-current", "page");
              await page.reload();
              await expect(tools).toBeVisible();
              await expect(tools.getByRole("button", { name: "Team Activity", exact: true })).toHaveAttribute("aria-current", "page");
              await tools.getByRole("button", { name: "Company Repair", exact: true }).click();
              await expect(tools.getByPlaceholder("Admin password")).toBeVisible();
              await expect(page).not.toHaveURL(/company-enrichment/);
              for (const width of [1440, 768, 390]) {
                await page.setViewportSize({ width, height: 1000 });
                const calls = tools.getByRole("button", { name: "Calls", exact: true });
                await calls.scrollIntoViewIfNeeded();
                await expect(calls).toBeVisible();
                const box = await calls.boundingBox();
                expect(box).not.toBeNull();
                expect(box!.x).toBeGreaterThanOrEqual(0);
                expect(box!.x + box!.width).toBeLessThanOrEqual(width + 1);
                await page.screenshot({ path: testInfo.outputPath(`${owner}-sidebar-${width}.png`) });
              }
            });
          }
          ''')
          # The installer is temporary and never reaches main.
          Path('.github/workflows/inline-sidebar-fix.yml').unlink()
      - name: Commit only the focused change on the feature branch
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/Dashboard.tsx src/components/DashboardShell.tsx src/components/DashboardShell.module.css tests/sdr-tools-sidebar.test.mjs tests/e2e/sdr-tools-sidebar.spec.ts .github/workflows/inline-sidebar-fix.yml
          git commit -m 'fix: keep SDR tools permanently visible beneath team workspace and owner'
          git push origin HEAD:fix/sdr-tools-permanent-sidebar-20261001
          echo "Tested candidate: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Typecheck
        run: npm run typecheck
      - name: Lint modified components and regression tests
        run: npx eslint src/components/Dashboard.tsx src/components/DashboardShell.tsx tests/sdr-tools-sidebar.test.mjs tests/e2e/sdr-tools-sidebar.spec.ts
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Sidebar browser regression
        run: npx playwright test tests/e2e/sdr-tools-sidebar.spec.ts
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdr-sidebar-browser-evidence
          path: test-results/
          retention-days: 7
