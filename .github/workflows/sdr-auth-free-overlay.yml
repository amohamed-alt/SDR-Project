name: Retire SDR Temporary Overlay

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sdr-auth-free-overlay.yml"
      - "ops/sdr-overlay-retired.compose.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retire-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: sdr-auth-overlay-retirement
      cancel-in-progress: true
    steps:
      - name: Checkout retirement compose
        uses: actions/checkout@v5

      - name: Validate retirement compose
        run: docker compose -f ops/sdr-overlay-retired.compose.yml config >/tmp/sdr-overlay-retired.txt

      - name: Replace temporary high-priority overlay with inert project
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
          virtual-machine: "1604210"
          project-name: sdr-auth-hotfix
          docker-compose-path: ops/sdr-overlay-retired.compose.yml

      - name: Verify primary SDR route is no longer shadowed
        run: |
          set -euo pipefail
          HOST='sdr.dashboardtalentera.tech'

          for ATTEMPT in $(seq 1 48); do
            HEALTH_CODE=$(curl --silent --show-error --connect-timeout 5 --max-time 12 \
              -H 'Cache-Control: no-cache' \
              -o /tmp/health.json -w '%{http_code}' \
              "https://${HOST}/api/health?overlay_retired=$ATTEMPT" || true)
            BUILD_REF=$(jq -r '.buildRef // ""' /tmp/health.json 2>/dev/null || true)
            ROOT_CODE=$(curl --silent --show-error --connect-timeout 5 --max-time 12 \
              -H 'Cache-Control: no-cache' -D /tmp/root.headers \
              -o /tmp/root.html -w '%{http_code}' \
              "https://${HOST}/" || true)
            AUTH_HEADER=$(grep -i '^WWW-Authenticate:' /tmp/root.headers 2>/dev/null || true)

            echo "Primary route ${ATTEMPT}/48: health=${HEALTH_CODE:-000} build=${BUILD_REF:-none} root=${ROOT_CODE:-000} auth_header=${AUTH_HEADER:-none}"

            if [ "$HEALTH_CODE" = "200" ] && [ -n "$BUILD_REF" ] && \
               [ "$ROOT_CODE" != "401" ] && [ "$ROOT_CODE" != "000" ] && [ -z "$AUTH_HEADER" ]; then
              echo "Temporary overlay is retired; the primary SDR route is serving traffic."
              exit 0
            fi
            sleep 5
          done

          echo "::error::Primary SDR route did not become reachable after retiring the overlay."
          cat /tmp/health.json 2>/dev/null || true
          exit 1
