name: Retire SDR Temporary Overlay

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sdr-auth-free-overlay.yml"
      - "ops/sdr-overlay-retired.compose.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retire-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: sdr-auth-overlay-retirement
      cancel-in-progress: true
    steps:
      - name: Checkout retirement compose
        uses: actions/checkout@v5

      - name: Validate retirement compose
        run: docker compose -f ops/sdr-overlay-retired.compose.yml config >/tmp/sdr-overlay-retired.txt

      - name: Confirm SDR endpoint is reachable before retirement
        run: |
          set -euo pipefail
          CODE=$(curl --silent --show-error --connect-timeout 5 --max-time 15 \
            -o /tmp/pre-health.json -w '%{http_code}' \
            'https://sdr.dashboardtalentera.tech/api/health?pre_overlay_retire=1' || true)
          test "$CODE" = "200" || {
            echo "::error::SDR endpoint is not healthy enough to retire the overlay."
            cat /tmp/pre-health.json 2>/dev/null || true
            exit 1
          }

      - name: Replace legacy overlay service with inert container
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
          virtual-machine: "1604210"
          project-name: sdr-auth-hotfix
          docker-compose-path: ops/sdr-overlay-retired.compose.yml

      - name: Stop retired overlay project and preserve data
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -euo pipefail
          AUTH="$HOSTINGER_API_KEY"
          case "$AUTH" in Bearer\ *) ;; *) AUTH="Bearer $AUTH" ;; esac
          VM='https://developers.hostinger.com/api/vps/v1/virtual-machines/1604210'
          PROJECT='sdr-auth-hotfix'

          CODE=$(curl --silent --show-error --connect-timeout 8 --max-time 30 \
            -X POST -H "Authorization: $AUTH" -H 'Accept: application/json' \
            -o /tmp/stop.json -w '%{http_code}' "$VM/docker/$PROJECT/stop" || true)
          echo "Stop $PROJECT: HTTP ${CODE:-000}"
          if [ "$CODE" -ge 200 ] 2>/dev/null && [ "$CODE" -lt 300 ] 2>/dev/null; then
            ACTION_ID=$(jq -r '.id // .action.id // empty' /tmp/stop.json 2>/dev/null || true)
            if [ -n "$ACTION_ID" ]; then
              for I in $(seq 1 30); do
                curl --silent --show-error --connect-timeout 8 --max-time 20 \
                  -H "Authorization: $AUTH" -H 'Accept: application/json' \
                  -o /tmp/action.json "$VM/actions/$ACTION_ID" || true
                STATE=$(jq -r '.state // "unknown"' /tmp/action.json 2>/dev/null || echo unknown)
                echo "Overlay stop ${I}/30: ${STATE}"
                case "$STATE" in success|completed) break ;; failed|error) cat /tmp/action.json; exit 1 ;; esac
                sleep 4
              done
            fi
          else
            cat /tmp/stop.json 2>/dev/null || true
            echo "::error::Could not stop retired overlay project."
            exit 1
          fi

      - name: Verify main SDR route after retirement
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -euo pipefail
          AUTH="$HOSTINGER_API_KEY"
          case "$AUTH" in Bearer\ *) ;; *) AUTH="Bearer $AUTH" ;; esac
          VM='https://developers.hostinger.com/api/vps/v1/virtual-machines/1604210'
          READY=false

          for ATTEMPT in $(seq 1 30); do
            HEALTH_CODE=$(curl --silent --show-error --connect-timeout 5 --max-time 12 \
              -o /tmp/health.json -w '%{http_code}' \
              "https://sdr.dashboardtalentera.tech/api/health?overlay_retired=$ATTEMPT" || true)
            ROOT_CODE=$(curl --silent --show-error --connect-timeout 5 --max-time 12 \
              -D /tmp/root.headers -o /tmp/root.html -w '%{http_code}' \
              'https://sdr.dashboardtalentera.tech/' || true)
            echo "Primary route ${ATTEMPT}/30: health=${HEALTH_CODE:-000} root=${ROOT_CODE:-000}"
            if [ "$HEALTH_CODE" = "200" ] && [ "$ROOT_CODE" != "000" ] && [ "$ROOT_CODE" != "401" ] && \
               ! grep -qi '^WWW-Authenticate:' /tmp/root.headers; then
              READY=true
              break
            fi
            sleep 4
          done

          if [ "$READY" != "true" ]; then
            echo "::error::Main SDR route failed after overlay retirement; restarting overlay as rollback."
            curl --silent --show-error --connect-timeout 8 --max-time 30 \
              -X POST -H "Authorization: $AUTH" -H 'Accept: application/json' \
              "$VM/docker/sdr-auth-hotfix/start" || true
            exit 1
          fi
