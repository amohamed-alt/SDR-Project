name: Manage Contact Dropdown Properties

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/create-contact-current-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manage-properties:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update Contact dropdown properties
        env:
          HUBSPOT_PRIVATE_APP_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
        run: |
          set -euo pipefail

          test -n "${HUBSPOT_PRIVATE_APP_TOKEN:-}" || {
            echo "::error::HUBSPOT_PRIVATE_APP_TOKEN secret is missing"
            exit 1
          }

          API='https://api.hubapi.com/crm/v3/properties/contacts'
          AUTH="Authorization: Bearer ${HUBSPOT_PRIVATE_APP_TOKEN}"

          upsert_property() {
            local name="$1"
            local payload="$2"
            local status

            status=$(curl -sS -o /tmp/existing.json -w '%{http_code}' \
              -H "$AUTH" \
              -H 'Accept: application/json' \
              "$API/$name")

            if [ "$status" = '200' ]; then
              jq '{label,type,fieldType,description,options}' "$payload" > /tmp/update.json
              local update_status
              update_status=$(curl -sS -o /tmp/result.json -w '%{http_code}' \
                -X PATCH \
                -H "$AUTH" \
                -H 'Content-Type: application/json' \
                --data @/tmp/update.json \
                "$API/$name")
              echo "$name update HTTP=$update_status"
              cat /tmp/result.json
              [ "$update_status" -ge 200 ] && [ "$update_status" -lt 300 ]
            elif [ "$status" = '404' ]; then
              local create_status
              create_status=$(curl -sS -o /tmp/result.json -w '%{http_code}' \
                -X POST \
                -H "$AUTH" \
                -H 'Content-Type: application/json' \
                --data @"$payload" \
                "$API")
              echo "$name create HTTP=$create_status"
              cat /tmp/result.json
              [ "$create_status" -ge 200 ] && [ "$create_status" -lt 300 ]
            else
              echo "::error::Unexpected lookup HTTP=$status for $name"
              cat /tmp/existing.json
              exit 1
            fi
          }

          verify_property() {
            local name="$1"
            local verify_status
            verify_status=$(curl -sS -o /tmp/verify.json -w '%{http_code}' \
              -H "$AUTH" \
              -H 'Accept: application/json' \
              "$API/$name")
            echo "$name verify HTTP=$verify_status"
            jq '{name,label,type,fieldType,description,options}' /tmp/verify.json
            [ "$verify_status" = '200' ]
          }

          # Preserve the old single-line field and its historical data, but make
          # the new dropdown the clearly named field users should select.
          LEGACY_STATUS=$(curl -sS -o /tmp/legacy.json -w '%{http_code}' \
            -H "$AUTH" \
            -H 'Accept: application/json' \
            "$API/package_credit_requested")

          if [ "$LEGACY_STATUS" = '200' ]; then
            cat > /tmp/legacy-update.json <<'JSON'
          {
            "label": "Package/Credit Requested (Legacy Text)",
            "description": "Legacy single-line text field retained to preserve historical values. Use Package/Credit Requested instead."
          }
          JSON
            LEGACY_UPDATE_STATUS=$(curl -sS -o /tmp/legacy-result.json -w '%{http_code}' \
              -X PATCH \
              -H "$AUTH" \
              -H 'Content-Type: application/json' \
              --data @/tmp/legacy-update.json \
              "$API/package_credit_requested")
            echo "Legacy property rename HTTP=$LEGACY_UPDATE_STATUS"
            cat /tmp/legacy-result.json
            [ "$LEGACY_UPDATE_STATUS" -ge 200 ] && [ "$LEGACY_UPDATE_STATUS" -lt 300 ]
          elif [ "$LEGACY_STATUS" != '404' ]; then
            echo "::error::Unexpected legacy property lookup HTTP=$LEGACY_STATUS"
            cat /tmp/legacy.json
            exit 1
          fi

          cat > /tmp/current-package.json <<'JSON'
          {
            "groupName": "contactinformation",
            "name": "current_package_v2",
            "label": "Current Package",
            "type": "enumeration",
            "fieldType": "select",
            "description": "Current active Evalufy package.",
            "options": [
              {"label":"Assessment Enterprise Pro","value":"Assessment Enterprise Pro","displayOrder":0,"hidden":false},
              {"label":"Assessment Professional Pro","value":"Assessment Professional Pro","displayOrder":1,"hidden":false},
              {"label":"Assessment Standard Pro","value":"Assessment Standard Pro","displayOrder":2,"hidden":false},
              {"label":"Assessment Starter Pro","value":"Assessment Starter Pro","displayOrder":3,"hidden":false},
              {"label":"Assessment Enterprise Core","value":"Assessment Enterprise Core","displayOrder":4,"hidden":false},
              {"label":"Assessment Professional Core","value":"Assessment Professional Core","displayOrder":5,"hidden":false},
              {"label":"Assessment Standard Core","value":"Assessment Standard Core","displayOrder":6,"hidden":false},
              {"label":"Assessment Starter Core","value":"Assessment Starter Core","displayOrder":7,"hidden":false},
              {"label":"AI Interview Custom","value":"AI Interview Custom","displayOrder":8,"hidden":false},
              {"label":"AI Interview Enterprise","value":"AI Interview Enterprise","displayOrder":9,"hidden":false},
              {"label":"AI Interview Professional","value":"AI Interview Professional","displayOrder":10,"hidden":false},
              {"label":"AI Interview Standard","value":"AI Interview Standard","displayOrder":11,"hidden":false},
              {"label":"AI Interview Starter","value":"AI Interview Starter","displayOrder":12,"hidden":false}
            ]
          }
          JSON

          cat > /tmp/package-credit-requested.json <<'JSON'
          {
            "groupName": "contactinformation",
            "name": "package_credit_requested_v2",
            "label": "Package/Credit Requested",
            "type": "enumeration",
            "fieldType": "select",
            "description": "Requested Evalufy package or credit action.",
            "options": [
              {"label":"Ask for AI Interview Credits","value":"Ask for AI Interview Credits","displayOrder":0,"hidden":false},
              {"label":"Ask for Tests Credits","value":"Ask for Tests Credits","displayOrder":1,"hidden":false},
              {"label":"Upgrade to Higher Package","value":"Upgrade to Higher Package","displayOrder":2,"hidden":false}
            ]
          }
          JSON

          upsert_property current_package_v2 /tmp/current-package.json
          upsert_property package_credit_requested_v2 /tmp/package-credit-requested.json

          verify_property current_package_v2
          verify_property package_credit_requested_v2
