name: Tier 1 Apollo Sheet Enrichment

on:
  workflow_dispatch:
    inputs:
      max_companies:
        description: "Maximum no-contact companies to process"
        required: false
        default: "200"
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: tier1-apollo-sheet-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      TIER1_SPREADSHEET_ID: "1QaJX18_ZcKzN3PNouc0Y067a4qIXSJZIWQGOMuxDC1M"
      MAX_COMPANIES: ${{ inputs.max_companies || '200' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate secrets
        run: |
          test -n "$APOLLO_API_KEY" || { echo "::error::APOLLO_API_KEY is missing"; exit 1; }
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" || { echo "::error::GOOGLE_SERVICE_ACCOUNT_JSON is missing"; exit 1; }
      - name: Run isolated sheet enrichment
        run: node scripts/tier1-apollo-sheet-enrichment.mjs
