name: Production Network Diagnostic

on:
  push:
    branches: [production-network-diagnostic]
    paths:
      - ".github/workflows/production-network-diagnostic.yml"

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read production health
        id: health
        shell: bash
        run: |
          set +e
          HOST=sdr.dashboardtalentera.tech
          IP=$(getent ahostsv4 "$HOST" | awk 'NR==1{print $1}')
          [ -n "$IP" ] || IP=unresolved
          HTTPS_CODE=$(curl -ksS --connect-timeout 5 --max-time 20 -o /tmp/health.json -w '%{http_code}' "https://${HOST}/api/health?deep=1" 2>/tmp/https.err || true)
          HTTPS_CODE=${HTTPS_CODE:-000}
          BUILD=$(jq -r '.buildRef // "none"' /tmp/health.json 2>/dev/null || echo none)
          READY=$(jq -r '.ready // false' /tmp/health.json 2>/dev/null || echo false)
          GENERATION=$(jq -r '.careerGeneration // "none"' /tmp/health.json 2>/dev/null || echo none)
          ENGINE=$(jq -r '.careerEngineVersion // "none"' /tmp/health.json 2>/dev/null || echo none)
          VALIDATION=$(jq -r '.careerValidationState // "unknown"' /tmp/health.json 2>/dev/null || echo unknown)
          STORED=$(jq -r '.careerValidationProgress.stored // 0' /tmp/health.json 2>/dev/null || echo 0)
          echo "IP=$IP HTTPS=$HTTPS_CODE build=$BUILD ready=$READY generation=$GENERATION engine=$ENGINE validation=$VALIDATION stored=$STORED"
          cat /tmp/health.json 2>/dev/null | jq '{buildRef,ready,careerGeneration,careerEngineVersion,careerValidationState,careerValidationProgress,careerEngineCapabilities}' || true
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          echo "https=$HTTPS_CODE" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          echo "generation=$GENERATION" >> "$GITHUB_OUTPUT"
          echo "engine=$ENGINE" >> "$GITHUB_OUTPUT"
          echo "validation=$VALIDATION" >> "$GITHUB_OUTPUT"
          echo "stored=$STORED" >> "$GITHUB_OUTPUT"

      - name: Publish diagnostic status
        uses: actions/github-script@v7
        env:
          IP: ${{ steps.health.outputs.ip }}
          HTTPS: ${{ steps.health.outputs.https }}
          BUILD: ${{ steps.health.outputs.build }}
          READY: ${{ steps.health.outputs.ready }}
          GENERATION: ${{ steps.health.outputs.generation }}
          ENGINE: ${{ steps.health.outputs.engine }}
        with:
          script: |
            const shortBuild = (process.env.BUILD || 'none').slice(0, 12);
            const desc = `https=${process.env.HTTPS} build=${shortBuild} ready=${process.env.READY} gen=${process.env.GENERATION} engine=${process.env.ENGINE}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'production/health-diagnostic',
              description: desc.slice(0, 140),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
