name: Seed Target Pool Now

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/target-account-pool-seed-now.yml

permissions:
  contents: read

jobs:
  seed-now:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DASHBOARD_USERNAME: ${{ secrets.DASHBOARD_USERNAME || 'talentera' }}
      DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
      OWNER_TOKEN: ${{ secrets.ACQUISITION_OWNER_TOKEN || secrets.DASHBOARD_PASSWORD }}
    steps:
      - name: Confirm deployed route is available
        run: |
          set -euo pipefail
          BODY=$(curl --silent --show-error --connect-timeout 5 --max-time 10 -H 'Cache-Control: no-cache' 'https://sdr.dashboardtalentera.tech/api/health?target_pool_seed=now')
          BUILD=$(printf '%s' "$BODY" | jq -r '.buildRef // ""')
          echo "Production build: ${BUILD:-none}"
          test -n "$BUILD"

      - name: Seed one corrected Saudi Apollo page
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl --silent --show-error \
            --connect-timeout 10 \
            --max-time 120 \
            --output /tmp/seed.json \
            --write-out '%{http_code}' \
            --user "${DASHBOARD_USERNAME}:${DASHBOARD_PASSWORD}" \
            -H "x-acquisition-owner-token: ${OWNER_TOKEN}" \
            -H 'Content-Type: application/json' \
            -X POST 'https://sdr.dashboardtalentera.tech/api/target-account-pool' \
            -d '{"action":"discover_market","country":"Saudi Arabia","pages":1,"confirmCredits":true}' || true)
          echo "Seed HTTP: ${HTTP_CODE:-none}"
          jq . /tmp/seed.json || cat /tmp/seed.json
          test "$HTTP_CODE" = '200'

      - name: Read back visible results
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl --silent --show-error \
            --connect-timeout 10 \
            --max-time 60 \
            --output /tmp/pool.json \
            --write-out '%{http_code}' \
            --user "${DASHBOARD_USERNAME}:${DASHBOARD_PASSWORD}" \
            'https://sdr.dashboardtalentera.tech/api/target-account-pool?country=Saudi%20Arabia&limit=1000' || true)
          echo "Pool HTTP: ${HTTP_CODE:-none}"
          jq '{targetUniverse, visibleAccounts:(.accounts|length), sample:(.accounts[:15]|map({name,domain,country,industry,employeeCount,gtmScore,gtmTier,exclusionStatus,status}))}' /tmp/pool.json || cat /tmp/pool.json
          test "$HTTP_CODE" = '200'
          VISIBLE=$(jq -r '(.accounts // []) | length' /tmp/pool.json)
          test "$VISIBLE" -gt 0 || { echo '::error::Corrected seed still produced zero visible Target Pool accounts.'; exit 1; }
