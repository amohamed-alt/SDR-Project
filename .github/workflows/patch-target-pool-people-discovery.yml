name: Patch Target Pool People Discovery

on:
  push:
    branches:
      - feat/target-pool-people-discovery
    paths:
      - scripts/patch-target-pool-people-discovery.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/target-pool-people-discovery
      - name: Apply Target Pool people discovery patch
        run: python scripts/patch-target-pool-people-discovery.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/api/target-account-pool/route.ts src/components/TargetAccountPool.tsx
          if git diff --cached --quiet; then
            echo 'No patch changes to commit.'
            exit 0
          fi
          git commit -m 'Use zero-credit HR people discovery for Target Pool'
          git push origin HEAD:feat/target-pool-people-discovery
