name: Purge Sensitive Audit Run

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/purge-sensitive-audit-run.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Delete sensitive raw-audit workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: "33571727167"
        run: |
          set -euo pipefail
          for ATTEMPT in 1 2 3; do
            CODE=$(curl --silent --show-error --connect-timeout 8 --max-time 30 \
              -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -o /tmp/delete-run.json -w '%{http_code}' \
              "https://api.github.com/repos/$REPOSITORY/actions/runs/$RUN_ID" || true)
            echo "Delete audit run attempt $ATTEMPT: HTTP ${CODE:-000}"
            case "$CODE" in
              204|404) exit 0 ;;
              409) sleep 5 ;;
              *) cat /tmp/delete-run.json 2>/dev/null || true; sleep 3 ;;
            esac
          done
          exit 1
