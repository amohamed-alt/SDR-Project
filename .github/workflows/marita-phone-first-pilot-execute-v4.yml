name: Marita Phone-First Pilot Execute V4

on:
  push:
    paths:
      - '.github/workflows/marita-phone-first-pilot-execute-v4.yml'

permissions:
  contents: read
  statuses: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_URL: https://sdr.dashboardtalentera.tech
      DASHBOARD_USERNAME: talentera
      DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
      OWNER_TOKEN: ${{ secrets.ACQUISITION_OWNER_TOKEN || secrets.DASHBOARD_PASSWORD }}
      LIVE_SHA: 72cd71cf512d10a5d9d5d200aafecc1cf4ca31d3
      TARGET_NEW_TASKS: '20'
      MAX_SIGNALHIRE_ENRICHMENTS: '30'
    steps:
      - name: Lock older pilot runner and verify live gates
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:process.env.LIVE_SHA,state:'success',context:'pilot/marita-phone-first-live-v3',description:'Superseded by guarded V4 runner; do not spend Apollo credit'});
            const auth=`Basic ${Buffer.from(`${process.env.DASHBOARD_USERNAME}:${process.env.DASHBOARD_PASSWORD}`).toString('base64')}`;
            const health=await fetch(`${process.env.BASE_URL}/api/health?pilot=v4`,{headers:{Authorization:auth,'Cache-Control':'no-cache'}}).then(r=>r.json());
            if(health.buildRef!==process.env.LIVE_SHA) throw new Error(`Unexpected production build ${health.buildRef}`);
            const acq=await fetch(`${process.env.BASE_URL}/api/acquisition?limit=1`,{headers:{Authorization:auth,'Cache-Control':'no-cache'}}).then(r=>r.json());
            const c=acq.configuration||{};
            if(acq.database!=='postgresql'||!c.apolloConfigured||!c.signalHireConfigured||!c.ownerActionsConfigured) throw new Error(`Production acquisition gate not ready: ${JSON.stringify({database:acq.database,apollo:c.apolloConfigured,signalhire:c.signalHireConfigured,owner:c.ownerActionsConfigured})}`);
            console.log('V4_GATE='+JSON.stringify({build:health.buildRef,database:acq.database,apollo:c.apolloConfigured,signalhire:c.signalHireConfigured,owner:c.ownerActionsConfigured}));

      - name: Spend one Apollo credit and execute live phone-first pilot
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const base=process.env.BASE_URL;
            const auth=`Basic ${Buffer.from(`${process.env.DASHBOARD_USERNAME}:${process.env.DASHBOARD_PASSWORD}`).toString('base64')}`;
            const headers={Authorization:auth,'x-acquisition-owner-token':process.env.OWNER_TOKEN,'Content-Type':'application/json'};
            const target=Number(process.env.TARGET_NEW_TASKS||20),maxEnrich=Number(process.env.MAX_SIGNALHIRE_ENRICHMENTS||30);
            async function req(path,init={}){const res=await fetch(`${base}${path}`,{...init,headers:{...headers,...(init.headers||{})}});const txt=await res.text();let body={};try{body=txt?JSON.parse(txt):{}}catch{body={raw:txt.slice(0,500)}}if(!res.ok)throw new Error(`${path} ${res.status}: ${JSON.stringify(body).slice(0,1000)}`);return body}
            const guardContext='pilot/marita-phone-first-credit-20260826';
            const statuses=await github.rest.repos.listCommitStatusesForRef({owner:context.repo.owner,repo:context.repo.repo,ref:process.env.LIVE_SHA,per_page:100});
            if(statuses.data.some(s=>s.context===guardContext&&s.state==='success')){core.setFailed('The approved Apollo pilot credit was already consumed.');return}
            const discovery=await req('/api/acquisition',{method:'POST',body:JSON.stringify({action:'discover',pages:1,confirmCredits:true})});
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:process.env.LIVE_SHA,state:'success',context:guardContext,description:'Approved one Apollo company-search page consumed'});
            const batch=(Array.isArray(discovery.batch)?discovery.batch:[]).filter(a=>a?.domain&&a.exclusionStatus==='eligible').sort((a,b)=>Number(b.gtmScore||0)-Number(a.gtmScore||0));
            const uniq=a=>[...new Set((a||[]).map(String).map(v=>v.trim()).filter(Boolean))],phones=p=>uniq(p?.phones),emails=p=>uniq(p?.emails);
            function role(title=''){const v=String(title).toLowerCase();if(/talent acquisition/.test(v)&&/head|director|vp|vice president/.test(v))return 100;if(/recruit/.test(v)&&/head|director|vp|vice president/.test(v))return 96;if(/chief human resources|\bchro\b|chief people/.test(v))return 94;if(/human resources|\bhr\b|people/.test(v)&&/head|director|vp|vice president/.test(v))return 88;if(/talent acquisition|recruit/.test(v)&&/manager|lead/.test(v))return 80;return 50}
            function choose(list=[]){return [...list].filter(p=>Number(p.score||p.rankScore||0)>=55).filter(p=>/current company confirmed/i.test(String(p.reason||p.fitReason||''))).filter(p=>!/assistant|coordinator|intern|trainee|specialist/i.test(String(p.title||''))).sort((a,b)=>(Number(b.score||b.rankScore||0)*10+role(b.title))-(Number(a.score||a.rankScore||0)*10+role(a.title)))[0]||null}
            const r={apolloCredits:1,rawTotal:Number(discovery.rawTotal||0),fetched:Number(discovery.fetched||0),stored:Number(discovery.stored||0),eligible:Number(discovery.eligible||0),review:Number(discovery.review||0),excluded:Number(discovery.excluded||0),existingHubSpot:Number(discovery.existingHubSpot||0),batchEligible:batch.length,companiesChecked:0,signalHireEnrichments:0,phoneReady:0,pushed:0,duplicates:0,noCandidate:0,noPhone:0,errors:[],taskIds:[],samples:[]};
            for(const account of batch){if(r.pushed>=target||r.signalHireEnrichments>=maxEnrich)break;r.companiesChecked++;const domain=String(account.domain);try{let saved=await req(`/api/acquisition?domain=${encodeURIComponent(domain)}`);let person=(saved.people||[]).filter(p=>p.enrichmentStatus==='enriched'&&p.meta?.verifiedCurrentCompany===true&&phones(p).length).sort((a,b)=>Number(b.rankScore||0)-Number(a.rankScore||0))[0]||null;if(!person){const found=await req('/api/acquisition',{method:'POST',body:JSON.stringify({action:'find_people',domain})});const candidate=choose(found.people||[]);if(!candidate){r.noCandidate++;continue}r.signalHireEnrichments++;const enriched=await req('/api/acquisition',{method:'POST',body:JSON.stringify({action:'enrich_person',domain,uid:candidate.uid})});person=enriched.person||null}const ps=phones(person);if(!person||!ps.length||person.meta?.verifiedCurrentCompany!==true){r.noPhone++;continue}r.phoneReady++;const es=emails(person),score=Math.max(0,Math.min(100,Number(account.gtmScore||person.rankScore||60)));const pushed=await req('/api/prospecting/push',{method:'POST',body:JSON.stringify({source:'Apollo → SignalHire Pilot',signalHireUid:String(person.uid||''),assignmentMode:'marita',fullName:String(person.fullName||'').trim(),title:String(person.title||'').trim(),company:String(account.name||'').trim(),companyDomain:domain,location:String(person.location||account.country||'').trim(),linkedinUrl:String(person.linkedinUrl||'').trim(),email:es[0]||'',emails:es,phone:ps[0],phones:ps,score,priority:score>=75?'high':'medium'})});if(pushed.duplicate)r.duplicates++;if(pushed.pushed){r.pushed++;if(pushed.taskId)r.taskIds.push(String(pushed.taskId))}if(r.samples.length<25)r.samples.push({company:account.name,country:account.country,persona:person.fullName,title:person.title,score,newTask:Boolean(pushed.pushed),duplicate:Boolean(pushed.duplicate)});}catch(e){r.errors.push({company:account.name,domain,error:String(e?.message||e).slice(0,350)})}}
            const priority=await req('/api/marita-priority?refresh=1');const visible=new Set((priority.companies||[]).flatMap(c=>c.taskIds||[]).map(String));r.visibleTasks=r.taskIds.filter(id=>visible.has(id)).length;r.priorityTotalCompanies=(priority.companies||[]).length;r.priorityReadyToCall=Number(priority.summary?.readyToCallCompanies||0);r.priorityHigh=Number(priority.summary?.highPriorityCompanies||0);r.phoneFirstCompanies=Number(priority.summary?.phoneFirstCompanies||0);r.openExtensiveTasks=Number(priority.summary?.openExtensiveTasks||0);
            core.summary.addHeading('Marita Phone-First Pilot — Final Live Report').addTable([[{data:'Metric',header:true},{data:'Result',header:true}],['Apollo credits consumed','1'],['Apollo companies fetched',String(r.fetched)],['Eligible batch accounts',String(r.batchEligible)],['Already in HubSpot',String(r.existingHubSpot)],['Companies persona-checked',String(r.companiesChecked)],['SignalHire paid enrichments',String(r.signalHireEnrichments)],['Verified phone-ready personas',String(r.phoneReady)],['New Marita CALL tasks',String(r.pushed)],['Duplicates',String(r.duplicates)],['No safe persona',String(r.noCandidate)],['No phone after enrichment',String(r.noPhone)],['New tasks visible in Marita Priority',`${r.visibleTasks}/${r.taskIds.length}`],['Total Priority companies',String(r.priorityTotalCompanies)],['Ready-to-call companies',String(r.priorityReadyToCall)],['High-priority companies',String(r.priorityHigh)],['Errors',String(r.errors.length)]]);if(r.samples.length)core.summary.addHeading('Phone-ready samples — phone/email values omitted',3).addTable([[{data:'Company',header:true},{data:'Market',header:true},{data:'Persona',header:true},{data:'Title',header:true},{data:'Score',header:true},{data:'Result',header:true}],...r.samples.map(x=>[String(x.company||''),String(x.country||''),String(x.persona||''),String(x.title||''),String(x.score||''),x.newTask?'new task':x.duplicate?'duplicate':'not pushed'])]);await core.summary.write();console.log('PILOT_RESULT='+JSON.stringify({...r,taskIds:r.taskIds.length,errors:r.errors.slice(0,12)}));if(r.taskIds.length&&r.visibleTasks!==r.taskIds.length)core.setFailed(`Dashboard priority verification failed: ${r.visibleTasks}/${r.taskIds.length} new tasks visible.`);

      - name: Verify dashboard HTML route
        shell: bash
        run: |
          set -euo pipefail
          CODE=$(curl -sS --user "${DASHBOARD_USERNAME}:${DASHBOARD_PASSWORD}" --connect-timeout 5 --max-time 30 -o /tmp/dashboard.html -w '%{http_code}' "${BASE_URL}/")
          BYTES=$(wc -c < /tmp/dashboard.html)
          echo "Dashboard root HTTP=$CODE bytes=$BYTES"
          [ "$CODE" = 200 ] && [ "$BYTES" -gt 1000 ]
