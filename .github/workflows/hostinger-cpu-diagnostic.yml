# Cleanup audit pass: 2026-09-02
name: Hostinger One-Shot Project State Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hostinger-cpu-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-project-state-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Capture sanitized Hostinger project state
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${HOSTINGER_API_KEY:-}" || { echo "Hostinger API key is missing"; exit 1; }
          AUTH="$HOSTINGER_API_KEY"
          case "$AUTH" in Bearer\ *) ;; *) AUTH="Bearer $AUTH" ;; esac
          VM='https://developers.hostinger.com/api/vps/v1/virtual-machines/1604210'
          OUT="$RUNNER_TEMP/hostinger-project-states-sanitized.md"

          req() {
            curl --silent --show-error --connect-timeout 6 --max-time 20 \
              -H "Authorization: $AUTH" -H 'Accept: application/json' \
              -o "$2" -w '%{http_code}' "$1" || true
          }

          echo '# Hostinger project states (sanitized)' > "$OUT"
          echo >> "$OUT"
          echo "Generated UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$OUT"
          echo >> "$OUT"
          echo '> This report intentionally excludes project compose content, environment variables, secrets, and raw API bodies.' >> "$OUT"

          VCODE=$(req "$VM" /tmp/vm.json)
          echo >> "$OUT"
          echo '## VPS' >> "$OUT"
          if [ "$VCODE" = "200" ]; then
            jq '{id,state,hostname,plan}' /tmp/vm.json >> "$OUT" 2>/dev/null || echo "VM_HTTP=$VCODE" >> "$OUT"
          else
            echo "VM_HTTP=${VCODE:-000}" >> "$OUT"
          fi

          PROJECTS='sdr-project n8n gtm-career gtm-career-browser career-judge-ollama dashboard-cache-api open-webui ollama coolify sdr-fastapi-dashboard sdr-marita-task-cleanup'
          for P in $PROJECTS; do
            SAFE=$(printf '%s' "$P" | tr -c 'A-Za-z0-9_.-' '_')
            echo >> "$OUT"
            echo "## $P" >> "$OUT"
            DCODE=$(req "$VM/docker/$P" "/tmp/details-$SAFE.json")
            echo "DETAILS_HTTP=${DCODE:-000}" >> "$OUT"
            CCODE=$(req "$VM/docker/$P/containers" "/tmp/containers-$SAFE.json")
            echo "CONTAINERS_HTTP=${CCODE:-000}" >> "$OUT"
            if [ "$CCODE" = "200" ]; then
              jq '[.[]? | {name,image,state,status,health,cpu_percentage:(.stats.cpu_percentage // null),memory_percentage:(.stats.memory_percentage // null)}]' "/tmp/containers-$SAFE.json" >> "$OUT" 2>/dev/null || echo '[]' >> "$OUT"
            fi
          done
          cat "$OUT"

      - name: Upload sanitized audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-project-states-sanitized
          path: ${{ runner.temp }}/hostinger-project-states-sanitized.md
          if-no-files-found: error
          retention-days: 7
