name: Hostinger One-Shot Project State Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hostinger-cpu-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Capture raw project state
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -euo pipefail
          AUTH="$HOSTINGER_API_KEY"; case "$AUTH" in Bearer\ *) ;; *) AUTH="Bearer $AUTH" ;; esac
          VM='https://developers.hostinger.com/api/vps/v1/virtual-machines/1604210'
          OUT=docs/hostinger-project-states-latest.md
          mkdir -p docs
          echo '# Hostinger project states' > "$OUT"
          echo >> "$OUT"; echo "Generated UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$OUT"
          for P in sdr-project gtm-career gtm-career-browser career-judge-ollama dashboard-cache-api open-webui ollama coolify sdr-fastapi-dashboard sdr-marita-task-cleanup; do
            echo >> "$OUT"; echo "## $P" >> "$OUT"; echo '```json' >> "$OUT"
            DC=$(curl -sS --connect-timeout 6 --max-time 20 -H "Authorization: $AUTH" -H 'Accept: application/json' -o /tmp/d.json -w '%{http_code}' "$VM/docker/$P" || true)
            echo "DETAILS_HTTP=$DC" >> "$OUT"
            if [ "$DC" = 200 ]; then jq '{content,environment}' /tmp/d.json >> "$OUT" 2>/dev/null || cat /tmp/d.json >> "$OUT"; else cat /tmp/d.json >> "$OUT" 2>/dev/null || true; fi
            CC=$(curl -sS --connect-timeout 6 --max-time 20 -H "Authorization: $AUTH" -H 'Accept: application/json' -o /tmp/c.json -w '%{http_code}' "$VM/docker/$P/containers" || true)
            echo "CONTAINERS_HTTP=$CC" >> "$OUT"
            cat /tmp/c.json >> "$OUT" 2>/dev/null || true
            echo >> "$OUT"; echo '```' >> "$OUT"
          done
          cat "$OUT"
      - name: Save report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/hostinger-project-states-latest.md
          git diff --cached --quiet || git commit -m "docs: save raw Hostinger project states"
          git pull --rebase origin main
          git push origin HEAD:main
