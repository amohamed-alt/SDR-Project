name: Hostinger Production Guard

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hostinger-production-guard.yml"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: hostinger-production-guard
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check active production only
        id: guard
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -euo pipefail
          REPORT=/tmp/hostinger-guard.md
          : > "$REPORT"
          ALERT=0
          WARN=0
          NOW_EPOCH=$(date -u +%s)
          NOW_ISO=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          echo "# Hostinger production guard" >> "$REPORT"
          echo >> "$REPORT"
          echo "Checked UTC: $NOW_ISO" >> "$REPORT"
          echo >> "$REPORT"

          if [ -z "${HOSTINGER_API_KEY:-}" ]; then
            echo "- CRITICAL: Hostinger API credential is missing." >> "$REPORT"
            ALERT=1
          else
            AUTH="$HOSTINGER_API_KEY"
            case "$AUTH" in Bearer\ *) ;; *) AUTH="Bearer $AUTH" ;; esac
            VM='https://developers.hostinger.com/api/vps/v1/virtual-machines/1604210'

            req() {
              local url="$1" out="$2" tries="${3:-3}"
              local code='000'
              for try in $(seq 1 "$tries"); do
                code=$(curl --silent --show-error --connect-timeout 6 --max-time 18 \
                  -H "Authorization: $AUTH" -H 'Accept: application/json' \
                  -o "$out" -w '%{http_code}' "$url" || true)
                [ "$code" = 200 ] && { printf '%s' "$code"; return 0; }
                sleep $((try * 2))
              done
              printf '%s' "${code:-000}"
              return 1
            }

            echo "## VPS" >> "$REPORT"
            VCODE=$(req "$VM" /tmp/vm.json 3) || true
            VSTATE=$(jq -r '.state // "unknown"' /tmp/vm.json 2>/dev/null || echo unknown)
            echo "- API: HTTP ${VCODE:-000}; state: $VSTATE" >> "$REPORT"
            if [ "$VCODE" != 200 ]; then
              WARN=1
              echo "- WARNING: VPS API unavailable after retries; public health remains authoritative." >> "$REPORT"
            elif [ "$VSTATE" != running ]; then
              ALERT=1
              echo "- CRITICAL: VPS is not running." >> "$REPORT"
            fi

            echo >> "$REPORT"
            echo "## Public SDR health" >> "$REPORT"
            HEALTH_OK=false
            for ATTEMPT in 1 2 3; do
              HCODE=$(curl --silent --show-error --connect-timeout 5 --max-time 12 \
                -H 'Cache-Control: no-cache' \
                -o /tmp/health.json -w '%{http_code}' \
                "https://sdr.dashboardtalentera.tech/api/health?guard=${GITHUB_RUN_ID}-${ATTEMPT}" || true)
              HSTATUS=$(jq -r '.status // "unknown"' /tmp/health.json 2>/dev/null || echo unknown)
              BUILD=$(jq -r '.buildRef // "unknown"' /tmp/health.json 2>/dev/null || echo unknown)
              MODE=$(jq -r '.deployMode // "unknown"' /tmp/health.json 2>/dev/null || echo unknown)
              echo "- Attempt $ATTEMPT: HTTP ${HCODE:-000}; status=$HSTATUS; build=$BUILD; mode=$MODE" >> "$REPORT"
              if [ "$HCODE" = 200 ] && [ "$HSTATUS" = ok ]; then HEALTH_OK=true; break; fi
              sleep 3
            done
            if [ "$HEALTH_OK" != true ]; then
              ALERT=1
              echo "- CRITICAL: public SDR health failed three probes." >> "$REPORT"
            fi

            echo >> "$REPORT"
            echo "## Hostinger Compose actions" >> "$REPORT"
            ACODE=$(req "$VM/actions?page=1" /tmp/actions.json 3) || true
            if [ "$ACODE" = 200 ]; then
              ACTIVE=$(jq -r '[.data[]? | select(
                ((.name // "") | startswith("docker_compose_")) and
                ((.state // "") | IN("pending","queued","started","running","processing","in_progress"))
              )] | length' /tmp/actions.json)
              echo "- Active Docker Compose actions: $ACTIVE" >> "$REPORT"
              [ "$ACTIVE" -gt 1 ] && { ALERT=1; echo "- CRITICAL: overlapping Compose actions detected." >> "$REPORT"; }

              while IFS=$'\t' read -r ID NAME STATE CREATED; do
                [ -n "${ID:-}" ] || continue
                CREATED_EPOCH=$(date -u -d "$CREATED" +%s 2>/dev/null || echo "$NOW_EPOCH")
                AGE_MIN=$(( (NOW_EPOCH - CREATED_EPOCH) / 60 ))
                echo "- Active: $ID $NAME $STATE (${AGE_MIN}m old)" >> "$REPORT"
                [ "$AGE_MIN" -ge 20 ] && { ALERT=1; echo "- CRITICAL: Compose action $ID is stale (${AGE_MIN}m)." >> "$REPORT"; }
              done < <(jq -r '.data[]? | select(
                ((.name // "") | startswith("docker_compose_")) and
                ((.state // "") | IN("pending","queued","started","running","processing","in_progress"))
              ) | [.id,.name,.state,.created_at] | @tsv' /tmp/actions.json)
            else
              WARN=1
              echo "- WARNING: actions API unavailable after retries." >> "$REPORT"
            fi

            echo >> "$REPORT"
            echo "## Active container pressure" >> "$REPORT"
            # Retired/empty projects are deliberately not polled. This keeps the
            # guard cheap and avoids Hostinger API noise from dead project shells.
            for PROJECT in sdr-project n8n; do
              SAFE=$(printf '%s' "$PROJECT" | tr -c 'A-Za-z0-9_.-' '_')
              CCODE=$(req "$VM/docker/$PROJECT/containers" "/tmp/containers-$SAFE.json" 3) || true
              if [ "$CCODE" != 200 ]; then
                WARN=1
                echo "- $PROJECT: inventory unavailable after retries" >> "$REPORT"
                continue
              fi

              COUNT=$(jq -r 'length' "/tmp/containers-$SAFE.json" 2>/dev/null || echo 0)
              echo "- $PROJECT: $COUNT container(s)" >> "$REPORT"
              jq -r '.[]? | "  - \(.name): \(.status // .state // "unknown") cpu=\(.stats.cpu_percentage // 0)% mem=\(.stats.memory_percentage // 0)%"' "/tmp/containers-$SAFE.json" >> "$REPORT" 2>/dev/null || true

              HOT=$(jq -r '[.[]? | select(
                ((.status // "") | startswith("Up ")) and
                ((((.stats.cpu_percentage // 0) | tonumber) >= 70) or (((.stats.memory_percentage // 0) | tonumber) >= 90))
              )] | length' "/tmp/containers-$SAFE.json" 2>/dev/null || echo 0)
              [ "$HOT" -gt 0 ] && { ALERT=1; echo "- CRITICAL: $PROJECT has $HOT hot container(s)." >> "$REPORT"; }

              if [ "$PROJECT" = sdr-project ]; then
                CORE_TOTAL=$(jq -r '[.[]? | select((.name // "") | IN(
                  "sdr-project-postgres-1",
                  "sdr-project-dashboard-cache-api-1",
                  "sdr-project-sdr-dashboard-1",
                  "sdr-project-maqsam-sync-1"
                ))] | length' "/tmp/containers-$SAFE.json")
                CORE_UP=$(jq -r '[.[]? | select(
                  ((.name // "") | IN(
                    "sdr-project-postgres-1",
                    "sdr-project-dashboard-cache-api-1",
                    "sdr-project-sdr-dashboard-1",
                    "sdr-project-maqsam-sync-1"
                  )) and ((.status // "") | startswith("Up "))
                )] | length' "/tmp/containers-$SAFE.json")
                echo "- SDR core: $CORE_UP/$CORE_TOTAL up" >> "$REPORT"
                if [ "$CORE_TOTAL" -lt 4 ] || [ "$CORE_UP" -lt 4 ]; then
                  ALERT=1
                  echo "- CRITICAL: SDR core stack is incomplete or stopped." >> "$REPORT"
                fi
              fi
            done
          fi

          echo >> "$REPORT"
          if [ "$ALERT" -eq 1 ]; then
            echo "**Result: ALERT**" >> "$REPORT"
          elif [ "$WARN" -eq 1 ]; then
            echo "**Result: HEALTHY WITH API WARNINGS**" >> "$REPORT"
          else
            echo "**Result: HEALTHY**" >> "$REPORT"
          fi

          cat "$REPORT"
          echo "alert=$ALERT" >> "$GITHUB_OUTPUT"

      - name: Maintain a single production alert issue
        uses: actions/github-script@v7
        env:
          ALERT: ${{ steps.guard.outputs.alert }}
        with:
          script: |
            const fs = require('fs');
            const title = '[ops] Hostinger production alert';
            const body = fs.readFileSync('/tmp/hostinger-guard.md', 'utf8');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(i => !i.pull_request && i.title === title);
            const alert = process.env.ALERT === '1';

            if (alert) {
              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: [],
                });
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: 'Production guard is healthy again. Closing this alert automatically.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }

      - name: Fail run when production needs attention
        if: steps.guard.outputs.alert == '1'
        run: |
          echo "Hostinger production guard detected a production condition that needs attention."
          exit 1
