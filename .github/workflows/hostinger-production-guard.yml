name: Hostinger Production Guard

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hostinger-production-guard.yml"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: hostinger-production-guard
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check VPS, public health, actions, and container pressure
        id: guard
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -euo pipefail
          REPORT=/tmp/hostinger-guard.md
          : > "$REPORT"
          ALERT=0
          WARN=0
          NOW_EPOCH=$(date -u +%s)
          NOW_ISO=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          echo "# Hostinger production guard" >> "$REPORT"
          echo >> "$REPORT"
          echo "Checked UTC: $NOW_ISO" >> "$REPORT"
          echo >> "$REPORT"

          if [ -z "${HOSTINGER_API_KEY:-}" ]; then
            echo "- CRITICAL: HOSTINGER_API_KEY / HOSTINGER_API_TOKEN is missing." >> "$REPORT"
            ALERT=1
          else
            AUTH="$HOSTINGER_API_KEY"
            case "$AUTH" in Bearer\ *) ;; *) AUTH="Bearer $AUTH" ;; esac
            VM='https://developers.hostinger.com/api/vps/v1/virtual-machines/1604210'

            req() {
              curl --silent --show-error --connect-timeout 8 --max-time 30 \
                -H "Authorization: $AUTH" -H 'Accept: application/json' \
                -o "$2" -w '%{http_code}' "$1" || true
            }

            echo "## VPS" >> "$REPORT"
            VCODE=$(req "$VM" /tmp/vm.json)
            VSTATE=$(jq -r '.state // "unknown"' /tmp/vm.json 2>/dev/null || echo unknown)
            echo "- API: HTTP ${VCODE:-000}; state: $VSTATE" >> "$REPORT"
            if [ "$VCODE" != "200" ] || [ "$VSTATE" != "running" ]; then
              ALERT=1
              echo "- CRITICAL: VPS is not confirmed running." >> "$REPORT"
            fi

            echo >> "$REPORT"
            echo "## Public SDR health" >> "$REPORT"
            HEALTH_OK=false
            for ATTEMPT in 1 2 3; do
              HCODE=$(curl --silent --show-error --connect-timeout 5 --max-time 12 \
                -H 'Cache-Control: no-cache' \
                -o /tmp/health.json -w '%{http_code}' \
                "https://sdr.dashboardtalentera.tech/api/health?guard=${GITHUB_RUN_ID}-${ATTEMPT}" || true)
              HSTATUS=$(jq -r '.status // "unknown"' /tmp/health.json 2>/dev/null || echo unknown)
              BUILD=$(jq -r '.buildRef // "unknown"' /tmp/health.json 2>/dev/null || echo unknown)
              echo "- Attempt $ATTEMPT: HTTP ${HCODE:-000}; status=$HSTATUS; build=$BUILD" >> "$REPORT"
              if [ "$HCODE" = "200" ] && [ "$HSTATUS" = "ok" ]; then
                HEALTH_OK=true
                break
              fi
              sleep 3
            done
            if [ "$HEALTH_OK" != "true" ]; then
              ALERT=1
              echo "- CRITICAL: public SDR health failed three probes." >> "$REPORT"
            fi

            echo >> "$REPORT"
            echo "## Hostinger actions" >> "$REPORT"
            ACODE=$(req "$VM/actions?page=1" /tmp/actions.json)
            echo "- API: HTTP ${ACODE:-000}" >> "$REPORT"
            if [ "$ACODE" = "200" ]; then
              ACTIVE=$(jq -r '[.data[]? | select(
                ((.name // "") | startswith("docker_compose_")) and
                ((.state // "") | IN("pending","queued","started","running","processing","in_progress"))
              )] | length' /tmp/actions.json)
              echo "- Active Docker Compose actions: $ACTIVE" >> "$REPORT"
              if [ "$ACTIVE" -gt 1 ]; then
                ALERT=1
                echo "- CRITICAL: overlapping Hostinger Compose actions detected." >> "$REPORT"
              fi

              while IFS=$'\t' read -r ID NAME STATE CREATED; do
                [ -n "${ID:-}" ] || continue
                CREATED_EPOCH=$(date -u -d "$CREATED" +%s 2>/dev/null || echo "$NOW_EPOCH")
                AGE_MIN=$(( (NOW_EPOCH - CREATED_EPOCH) / 60 ))
                echo "- Active: $ID $NAME $STATE (${AGE_MIN}m old)" >> "$REPORT"
                if [ "$AGE_MIN" -ge 25 ]; then
                  ALERT=1
                  echo "- CRITICAL: Compose action $ID has been active for ${AGE_MIN} minutes." >> "$REPORT"
                fi
              done < <(jq -r '.data[]? | select(
                ((.name // "") | startswith("docker_compose_")) and
                ((.state // "") | IN("pending","queued","started","running","processing","in_progress"))
              ) | [.id,.name,.state,.created_at] | @tsv' /tmp/actions.json)

              RECENT_DEPLOYS=$(jq --argjson cutoff "$((NOW_EPOCH - 3600))" -r '[.data[]? | select(
                ((.name // "") | startswith("docker_compose_")) and
                ((.created_at // "1970-01-01T00:00:00Z") | fromdateiso8601) >= $cutoff
              )] | length' /tmp/actions.json 2>/dev/null || echo 0)
              echo "- Docker Compose actions in last 60m: $RECENT_DEPLOYS" >> "$REPORT"
              if [ "$RECENT_DEPLOYS" -gt 3 ]; then
                ALERT=1
                echo "- CRITICAL: deploy storm threshold exceeded (>3 Compose actions/hour)." >> "$REPORT"
              fi
            else
              WARN=1
              echo "- WARNING: Hostinger actions endpoint unavailable; public health remains authoritative." >> "$REPORT"
            fi

            echo >> "$REPORT"
            echo "## Container pressure" >> "$REPORT"
            PROJECTS='sdr-project n8n ollama career-judge-ollama gtm-career-browser open-webui coolify'
            for PROJECT in $PROJECTS; do
              SAFE=$(printf '%s' "$PROJECT" | tr -c 'A-Za-z0-9_.-' '_')
              CCODE=$(req "$VM/docker/$PROJECT/containers" "/tmp/containers-$SAFE.json")
              if [ "$CCODE" != "200" ]; then
                echo "- $PROJECT: inventory HTTP ${CCODE:-000} (not treated as outage)" >> "$REPORT"
                WARN=1
                continue
              fi

              COUNT=$(jq -r 'length' "/tmp/containers-$SAFE.json" 2>/dev/null || echo 0)
              echo "- $PROJECT: $COUNT container(s)" >> "$REPORT"
              jq -r '.[]? | "  - \(.name): state=\(.state // "unknown") health=\(.health // "") cpu=\(.stats.cpu_percentage // 0)% mem=\(.stats.memory_percentage // 0)%"' "/tmp/containers-$SAFE.json" >> "$REPORT" 2>/dev/null || true

              HOT=$(jq -r '[.[]? | select(
                ((.state // "") == "running") and
                (((.stats.cpu_percentage // 0) | tonumber) >= 70 or ((.stats.memory_percentage // 0) | tonumber) >= 90)
              )] | length' "/tmp/containers-$SAFE.json" 2>/dev/null || echo 0)
              if [ "$HOT" -gt 0 ]; then
                ALERT=1
                echo "- CRITICAL: $PROJECT has $HOT running container(s) above CPU 70% or memory 90%." >> "$REPORT"
              fi

              if [ "$PROJECT" = "sdr-project" ]; then
                CORE_BAD=$(jq -r '[.[]? | select(
                  ((.name // "") | test("sdr-dashboard|dashboard-cache-api|postgres|maqsam-sync")) and
                  (((.state // "") != "running") or (((.health // "") != "") and ((.health // "") != "healthy")))
                )] | length' "/tmp/containers-$SAFE.json" 2>/dev/null || echo 0)
                if [ "$CORE_BAD" -gt 0 ]; then
                  ALERT=1
                  echo "- CRITICAL: $CORE_BAD core SDR container(s) are stopped/unhealthy." >> "$REPORT"
                fi
              fi
            done
          fi

          echo >> "$REPORT"
          if [ "$ALERT" -eq 1 ]; then
            echo "**Result: ALERT**" >> "$REPORT"
          elif [ "$WARN" -eq 1 ]; then
            echo "**Result: HEALTHY WITH HOSTINGER API WARNINGS**" >> "$REPORT"
          else
            echo "**Result: HEALTHY**" >> "$REPORT"
          fi

          cat "$REPORT"
          echo "alert=$ALERT" >> "$GITHUB_OUTPUT"

      - name: Maintain a single production alert issue
        uses: actions/github-script@v7
        env:
          ALERT: ${{ steps.guard.outputs.alert }}
        with:
          script: |
            const fs = require('fs');
            const title = '[ops] Hostinger production alert';
            const body = fs.readFileSync('/tmp/hostinger-guard.md', 'utf8');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(i => !i.pull_request && i.title === title);
            const alert = process.env.ALERT === '1';

            if (alert) {
              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body,
                });
                core.warning(`Updated Hostinger alert issue #${existing.number}.`);
              } else {
                const { data: created } = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: [],
                });
                core.warning(`Created Hostinger alert issue #${created.number}.`);
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: 'Production guard is healthy again. Closing this alert automatically.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.notice(`Closed recovered Hostinger alert issue #${existing.number}.`);
            } else {
              core.notice('Hostinger production guard is healthy.');
            }

      - name: Fail run when production needs attention
        if: steps.guard.outputs.alert == '1'
        run: |
          echo "Hostinger production guard detected a production condition that needs attention."
          exit 1
