name: Cancel Stale Hostinger Deploy Runner

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cancel-stale-hostinger-run.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel obsolete polling run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          STALE_RUN_ID: "33566032451"
        run: |
          set -euo pipefail
          CODE=$(curl --silent --show-error --connect-timeout 8 --max-time 30 \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o /tmp/cancel.json -w '%{http_code}' \
            "https://api.github.com/repos/$REPOSITORY/actions/runs/$STALE_RUN_ID/cancel" || true)
          echo "Cancel stale run: HTTP ${CODE:-000}"
          case "$CODE" in
            202|409) exit 0 ;;
            *) cat /tmp/cancel.json 2>/dev/null || true; exit 1 ;;
          esac
