name: Power Cycle Hostinger VPS

on:
  push:
    branches:
      - recover/hostinger-power-cycle

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOSTINGER_TOKEN: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
      VM_ID: "1604210"
    steps:
      - name: Stop, start, and verify VPS
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_TOKEN" || { echo "::error::Hostinger API token is missing"; exit 1; }
          BASE="https://developers.hostinger.com/api/vps/v1/virtual-machines/${VM_ID}"
          AUTH="Authorization: Bearer ${HOSTINGER_TOKEN}"

          wait_action() {
            local id="$1"
            for n in $(seq 1 48); do
              body=$(curl -sS --connect-timeout 10 --max-time 30 -H "$AUTH" -H 'Accept: application/json' "$BASE/actions/$id" || true)
              state=$(printf '%s' "$body" | jq -r '.state // "unknown"' 2>/dev/null || echo unknown)
              echo "action=$id attempt=$n state=$state"
              [ "$state" = "success" ] && return 0
              [ "$state" = "failed" ] && { echo "$body"; return 1; }
              sleep 10
            done
            return 1
          }

          echo "=== STOP VPS ==="
          code=$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/stop.json -w '%{http_code}' -X POST -H "$AUTH" -H 'Accept: application/json' "$BASE/stop" || true)
          echo "HTTP=$code"
          cat /tmp/stop.json || true
          [ "$code" = "200" ] || exit 1
          stop_id=$(jq -r '.id // empty' /tmp/stop.json)
          [ -n "$stop_id" ] && wait_action "$stop_id"

          echo "=== WAIT STOPPED ==="
          for n in $(seq 1 36); do
            state=$(curl -sS --connect-timeout 5 --max-time 15 -H "$AUTH" -H 'Accept: application/json' "$BASE" | jq -r '.state // "unknown"' || true)
            echo "state=$state"
            [ "$state" = "stopped" ] && break
            sleep 10
          done

          sleep 20

          echo "=== START VPS ==="
          code=$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/start.json -w '%{http_code}' -X POST -H "$AUTH" -H 'Accept: application/json' "$BASE/start" || true)
          echo "HTTP=$code"
          cat /tmp/start.json || true
          [ "$code" = "200" ] || exit 1
          start_id=$(jq -r '.id // empty' /tmp/start.json)
          [ -n "$start_id" ] && wait_action "$start_id"

          echo "=== WAIT RUNNING ==="
          running=false
          for n in $(seq 1 48); do
            state=$(curl -sS --connect-timeout 5 --max-time 15 -H "$AUTH" -H 'Accept: application/json' "$BASE" | jq -r '.state // "unknown"' || true)
            echo "state=$state"
            if [ "$state" = "running" ]; then running=true; break; fi
            sleep 10
          done
          [ "$running" = "true" ] || exit 1

          echo "Waiting 90 seconds for OS, Docker, and network services..."
          sleep 90

          echo "=== PORT CHECKS ==="
          for port in 22 80 443; do
            if timeout 4 bash -c "</dev/tcp/187.77.2.175/$port" 2>/dev/null; then echo "port $port OPEN"; else echo "port $port CLOSED"; fi
          done

          echo "=== DASHBOARD HEALTH ==="
          status=$(curl -k -sS --connect-timeout 5 --max-time 15 -o /tmp/health.json -w '%{http_code}' -H 'Cache-Control: no-cache' 'https://sdr.dashboardtalentera.tech/api/health' || true)
          echo "HTTP=$status"
          cat /tmp/health.json 2>/dev/null || true

          echo "=== METRICS ==="
          FROM=$(date -u -d '15 minutes ago' '+%Y-%m-%dT%H:%MZ')
          TO=$(date -u '+%Y-%m-%dT%H:%MZ')
          curl -sS --connect-timeout 10 --max-time 30 -G -H "$AUTH" -H 'Accept: application/json' --data-urlencode "date_from=$FROM" --data-urlencode "date_to=$TO" "$BASE/metrics" | jq '{cpu_usage,ram_usage,uptime}' || true

          echo "=== DOCKER API ==="
          code=$(curl -sS --connect-timeout 10 --max-time 40 -o /tmp/docker.json -w '%{http_code}' -H "$AUTH" -H 'Accept: application/json' "$BASE/docker" || true)
          echo "HTTP=$code"
          if [ "$code" = "200" ]; then jq '[.[] | {name,status,state,path}]' /tmp/docker.json; else cat /tmp/docker.json || true; fi
