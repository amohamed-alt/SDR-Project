name: Patch Hostinger Deploy Safety

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-hostinger-deploy-safety.yml"

permissions:
  contents: write

jobs:
  patch:
    concurrency:
      group: hostinger-sdr-production
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Remove automatic VPS reboot from production deploy
        env:
          SAFE_STEP_B64: ""
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path('.github/workflows/deploy-hostinger.yml')
          text = path.read_text()
          start_marker = '      - name: Recover Hostinger Docker control plane if unhealthy\n'
          end_marker = '      - name: Deploy CPU-light SDR stack\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = base64.b64decode(os.environ['SAFE_STEP_B64']).decode()
          path.write_text(text[:start] + replacement + text[end:])
          PY

          git diff --check
          git diff -- .github/workflows/deploy-hostinger.yml

      - name: Commit deployment safety fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deploy-hostinger.yml
          git diff --cached --quiet && exit 0
          git commit -m "Stop auto-rebooting Hostinger on Docker API errors"
          git push origin HEAD:main
