name: TEMP Ojoor Contact Candidate Discovery

on:
  push:
    branches:
      - temp/ojoor-contact-discovery
    paths:
      - .github/workflows/ojoor-contact-discovery-temp.yml

permissions:
  contents: read
  actions: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
    steps:
      - name: Validate Apollo secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APOLLO_API_KEY" || { echo "::error::APOLLO_API_KEY is not configured."; exit 1; }

      - name: Download Tier 1 company export artifact
        uses: actions/download-artifact@v4
        with:
          name: ojoor-tier1-apollo-export
          path: input
          repository: amohamed-alt/SDR-Project
          run-id: 34699472060
          github-token: ${{ github.token }}

      - name: Discover ranked verified-email candidates in batches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import json
          import math
          import os
          import re
          import time
          import urllib.error
          import urllib.request
          from collections import defaultdict
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from threading import Lock

          API_KEY = os.environ["APOLLO_API_KEY"]
          API_URL = "https://api.apollo.io/api/v1/mixed_people/api_search"
          INPUT = Path("input/ojoor-tier1-companies.csv")
          OUT = Path("output")
          OUT.mkdir(exist_ok=True)
          BATCH_SIZE = 40

          EXEC_TITLES = [
              "Chief Executive Officer", "CEO", "General Manager", "Managing Director",
              "Country General Manager", "Founder and CEO", "Founder & CEO"
          ]
          HR_TITLES = [
              "Chief Human Resources Officer", "CHRO", "VP Human Resources", "VP HR",
              "Head of Human Resources", "Head of HR", "Human Resources Director", "HR Director",
              "Director of Human Resources", "Human Resources Manager", "HR Manager",
              "Head of People", "People Director", "People & Culture Director",
              "People and Culture Director", "People & Culture Manager", "People and Culture Manager"
          ]

          stats = {"requests": 0, "retries": 0, "unmapped_people": 0}
          lock = Lock()

          def clean(v):
              return " ".join(str(v or "").split())

          def normalize_domain(v):
              v = clean(v).lower()
              v = re.sub(r"^https?://", "", v).split("/")[0].split(":")[0]
              return v[4:] if v.startswith("www.") else v

          def chunks(items, n):
              for i in range(0, len(items), n):
                  yield items[i:i+n]

          def api_post(body):
              payload = json.dumps(body).encode("utf-8")
              for attempt in range(7):
                  req = urllib.request.Request(
                      API_URL,
                      data=payload,
                      method="POST",
                      headers={
                          "x-api-key": API_KEY,
                          "accept": "application/json",
                          "content-type": "application/json",
                      },
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=45) as response:
                          with lock:
                              stats["requests"] += 1
                          return json.loads(response.read().decode("utf-8"))
                  except urllib.error.HTTPError as exc:
                      body_text = exc.read().decode("utf-8", errors="replace")[:300]
                      if exc.code == 429 or 500 <= exc.code < 600:
                          with lock:
                              stats["retries"] += 1
                          time.sleep(min(20, 1.5 * (2 ** attempt)))
                          continue
                      raise RuntimeError(f"Apollo people search HTTP {exc.code}: {body_text}")
                  except Exception:
                      if attempt < 6:
                          with lock:
                              stats["retries"] += 1
                          time.sleep(min(20, 1.5 * (2 ** attempt)))
                          continue
                      raise
              raise RuntimeError("Apollo people search exhausted retries")

          with INPUT.open(newline="", encoding="utf-8-sig") as h:
              companies = list(csv.DictReader(h))

          company_by_org = {clean(c.get("Apollo Organization ID")): c for c in companies if clean(c.get("Apollo Organization ID"))}
          domain_to_org = {normalize_domain(c.get("Domain")): oid for oid, c in company_by_org.items() if normalize_domain(c.get("Domain"))}
          org_ids = list(company_by_org)

          def resolve_org_id(person):
              oid = clean(person.get("organization_id"))
              org = person.get("organization") if isinstance(person.get("organization"), dict) else {}
              oid = oid or clean(org.get("id"))
              if oid in company_by_org:
                  return oid
              domain = normalize_domain(org.get("primary_domain") or org.get("domain") or person.get("organization_domain"))
              return domain_to_org.get(domain, "")

          def search_batch(batch_org_ids, titles, small_only=False):
              all_people = []
              page = 1
              while True:
                  body = {
                      "organization_ids": batch_org_ids,
                      "person_titles": titles,
                      "include_similar_titles": True,
                      "contact_email_status": ["verified"],
                      "per_page": 100,
                      "page": page,
                  }
                  if small_only:
                      body["organization_num_employees_ranges"] = ["51,100"]
                  data = api_post(body)
                  people = data.get("people") or []
                  all_people.extend(people)
                  pagination = data.get("pagination") if isinstance(data.get("pagination"), dict) else {}
                  total = data.get("total_entries") or pagination.get("total_entries") or pagination.get("total") or len(all_people)
                  total_pages = pagination.get("total_pages") or (math.ceil(int(total) / 100) if total else 1)
                  if not people or page >= int(total_pages):
                      break
                  page += 1
                  if page > 20:
                      break
              return all_people

          def title_norm(title):
              return re.sub(r"[^a-z0-9]+", " ", clean(title).lower()).strip()

          def exec_score(title):
              t = title_norm(title)
              if "chief executive officer" in t or re.search(r"\bceo\b", t): return 110
              if "general manager" in t: return 105
              if "managing director" in t: return 100
              if "founder" in t and ("ceo" in t or "chief executive" in t): return 98
              return -1

          def hr_score(title):
              t = title_norm(title)
              if "chief human resources" in t or t == "chro": return 120
              if ("vp" in t or "vice president" in t) and ("human resources" in t or re.search(r"\bhr\b", t)): return 115
              if "head" in t and ("human resources" in t or re.search(r"\bhr\b", t)): return 110
              if "director" in t and ("human resources" in t or re.search(r"\bhr\b", t)): return 105
              if "manager" in t and ("human resources" in t or re.search(r"\bhr\b", t)): return 100
              if "head of people" in t: return 95
              if "people" in t and "culture" in t and "director" in t: return 92
              if "people" in t and "culture" in t and "manager" in t: return 88
              if "people director" in t: return 90
              return -1

          candidates = defaultdict(list)
          seen = defaultdict(set)

          def ingest(people, persona, path):
              scorer = hr_score if persona == "HR" else exec_score
              for person in people:
                  oid = resolve_org_id(person)
                  if not oid:
                      with lock:
                          stats["unmapped_people"] += 1
                      continue
                  pid = clean(person.get("id"))
                  title = clean(person.get("title"))
                  score = scorer(title)
                  if not pid or score < 0 or not person.get("has_email") or pid in seen[oid]:
                      continue
                  seen[oid].add(pid)
                  candidates[oid].append({
                      "apollo_person_id": pid,
                      "first_name": clean(person.get("first_name")),
                      "last_name_obfuscated": clean(person.get("last_name_obfuscated")),
                      "title": title,
                      "persona": persona,
                      "search_path": path,
                      "candidate_score": score,
                      "email_status": "verified",
                  })

          batch_list = list(chunks(org_ids, BATCH_SIZE))

          # Phase 1: small companies (51-100), CEO/GM first.
          with ThreadPoolExecutor(max_workers=4) as pool:
              futs = [pool.submit(search_batch, batch, EXEC_TITLES, True) for batch in batch_list]
              for fut in as_completed(futs):
                  ingest(fut.result(), "Executive", "small_51_100_exec")

          # Phase 2: HR leaders for the entire 51-200 pool.
          with ThreadPoolExecutor(max_workers=4) as pool:
              futs = [pool.submit(search_batch, batch, HR_TITLES, False) for batch in batch_list]
              for fut in as_completed(futs):
                  ingest(fut.result(), "HR", "hr_leadership")

          # Phase 3: executive fallback only for companies still lacking any candidate.
          missing_orgs = [oid for oid in org_ids if not candidates.get(oid)]
          fallback_batches = list(chunks(missing_orgs, BATCH_SIZE))
          with ThreadPoolExecutor(max_workers=4) as pool:
              futs = [pool.submit(search_batch, batch, EXEC_TITLES, False) for batch in fallback_batches]
              for fut in as_completed(futs):
                  ingest(fut.result(), "Executive", "exec_fallback")

          def final_key(row):
              if row["search_path"] == "small_51_100_exec": pri = 0
              elif row["persona"] == "HR": pri = 1
              else: pri = 2
              return (pri, -row["candidate_score"], row["title"].lower(), row["apollo_person_id"])

          for oid in list(candidates):
              candidates[oid].sort(key=final_key)
              candidates[oid] = candidates[oid][:3]

          mapped_companies = sum(1 for oid in org_ids if candidates.get(oid))
          if mapped_companies < max(500, int(len(org_ids) * 0.30)):
              raise RuntimeError(f"Batch candidate mapping unexpectedly low: {mapped_companies}/{len(org_ids)}")

          all_fields = [
              "Company Name", "Industry", "Domain", "Website", "Company LinkedIn", "HQ City", "HQ Region",
              "Apollo Organization ID", "Candidate Rank", "Apollo Person ID", "First Name", "Last Name (masked)",
              "Title", "Persona", "Search Path", "Email Status"
          ]
          primary_fields = [x for x in all_fields if x != "Candidate Rank"]

          with (OUT / "ojoor-contact-candidates.csv").open("w", newline="", encoding="utf-8-sig") as h:
              w = csv.DictWriter(h, fieldnames=all_fields); w.writeheader()
              for company in companies:
                  oid = clean(company.get("Apollo Organization ID"))
                  for rank, c in enumerate(candidates.get(oid, []), 1):
                      w.writerow({
                          "Company Name": company.get("Company Name", ""), "Industry": company.get("Industry", ""),
                          "Domain": company.get("Domain", ""), "Website": company.get("Website", ""),
                          "Company LinkedIn": company.get("LinkedIn", ""), "HQ City": company.get("HQ City", ""),
                          "HQ Region": company.get("HQ Region", ""), "Apollo Organization ID": oid,
                          "Candidate Rank": rank, "Apollo Person ID": c["apollo_person_id"], "First Name": c["first_name"],
                          "Last Name (masked)": c["last_name_obfuscated"], "Title": c["title"], "Persona": c["persona"],
                          "Search Path": c["search_path"], "Email Status": c["email_status"]
                      })

          with (OUT / "ojoor-primary-candidates.csv").open("w", newline="", encoding="utf-8-sig") as h:
              w = csv.DictWriter(h, fieldnames=primary_fields); w.writeheader()
              for company in companies:
                  oid = clean(company.get("Apollo Organization ID"))
                  if not candidates.get(oid):
                      continue
                  c = candidates[oid][0]
                  w.writerow({
                      "Company Name": company.get("Company Name", ""), "Industry": company.get("Industry", ""),
                      "Domain": company.get("Domain", ""), "Website": company.get("Website", ""),
                      "Company LinkedIn": company.get("LinkedIn", ""), "HQ City": company.get("HQ City", ""),
                      "HQ Region": company.get("HQ Region", ""), "Apollo Organization ID": oid,
                      "Apollo Person ID": c["apollo_person_id"], "First Name": c["first_name"],
                      "Last Name (masked)": c["last_name_obfuscated"], "Title": c["title"], "Persona": c["persona"],
                      "Search Path": c["search_path"], "Email Status": c["email_status"]
                  })

          with (OUT / "ojoor-companies-without-candidate.csv").open("w", newline="", encoding="utf-8-sig") as h:
              fields = ["Company Name", "Industry", "Domain", "Website", "LinkedIn", "HQ City", "HQ Region", "Apollo Organization ID"]
              w = csv.DictWriter(h, fieldnames=fields); w.writeheader()
              for company in companies:
                  oid = clean(company.get("Apollo Organization ID"))
                  if candidates.get(oid):
                      continue
                  w.writerow({field: company.get(field, "") for field in fields})

          alternatives = sum(max(0, len(candidates.get(oid, [])) - 1) for oid in org_ids)
          summary = {
              "generatedAt": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "companies": len(companies),
              "companiesWithPrimaryCandidate": mapped_companies,
              "companiesWithoutCandidate": len(companies) - mapped_companies,
              "fallbackAlternativesStored": alternatives,
              "apolloPeopleSearchRequests": stats["requests"],
              "apolloPeopleSearchRetries": stats["retries"],
              "unmappedPeople": stats["unmapped_people"],
              "enrichmentCreditsUsed": 0,
              "rules": {
                  "smallCompanyDefinition": "51-100 employees",
                  "smallCompanyPriority": "CEO / General Manager / Managing Director with verified email",
                  "otherwisePriority": "CHRO / VP HR / Head of HR / HR Director / HR Manager with verified email",
                  "fallback": "Executive only when no suitable HR candidate with verified email is found",
                  "maxFinalContactsPerCompany": 1,
                  "candidateAlternativesStoredForEmailFallback": 3
              }
          }
          (OUT / "ojoor-contact-discovery-summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload contact discovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: ojoor-contact-discovery
          path: output/*
          retention-days: 1
          if-no-files-found: error

      - name: Cancel superseded slow discovery run
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/amohamed-alt/SDR-Project/actions/runs/34700065437/cancel \
            -o /tmp/cancel.json -w '%{http_code}' > /tmp/cancel_code || true
          code=$(cat /tmp/cancel_code)
          echo "Superseded run cancel request HTTP=${code}"
