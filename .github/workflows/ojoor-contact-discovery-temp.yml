name: TEMP Ojoor Contact Candidate Discovery

on:
  push:
    branches:
      - temp/ojoor-contact-discovery
    paths:
      - .github/workflows/ojoor-contact-discovery-temp.yml

permissions:
  contents: read
  actions: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
    steps:
      - name: Validate Apollo secret
        run: |
          set -euo pipefail
          test -n "$APOLLO_API_KEY" || { echo "::error::APOLLO_API_KEY is not configured."; exit 1; }

      - name: Download Tier 1 company export artifact
        uses: actions/download-artifact@v4
        with:
          name: ojoor-tier1-apollo-export
          path: input
          repository: amohamed-alt/SDR-Project
          run-id: 34699472060
          github-token: ${{ github.token }}

      - name: Discover one verified-email contact candidate per company
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, json, os, re, time, urllib.error, urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from threading import Lock

          API_KEY = os.environ["APOLLO_API_KEY"]
          API_URL = "https://api.apollo.io/api/v1/mixed_people/api_search"
          INPUT = Path("input/ojoor-tier1-companies.csv")
          OUT = Path("output"); OUT.mkdir(exist_ok=True)

          EXEC_TITLES = ["Chief Executive Officer","CEO","General Manager","Managing Director","Country General Manager","Founder and CEO","Founder & CEO"]
          HR_TITLES = ["Chief Human Resources Officer","CHRO","VP Human Resources","VP HR","Head of Human Resources","Head of HR","Human Resources Director","HR Director","Director of Human Resources","Human Resources Manager","HR Manager","Head of People","People Director","People & Culture Director","People and Culture Director","People & Culture Manager","People and Culture Manager"]
          lock = Lock()
          stats = {"requests":0,"retries":0,"errors":0}

          def clean(v): return " ".join(str(v or "").split())
          def norm(t): return re.sub(r"[^a-z0-9]+"," ",clean(t).lower()).strip()

          def exec_score(title):
              t=norm(title)
              if "chief executive officer" in t or re.search(r"\bceo\b",t): return 110
              if "general manager" in t: return 105
              if "managing director" in t: return 100
              if "founder" in t and ("ceo" in t or "chief executive" in t): return 98
              return -1

          def hr_score(title):
              t=norm(title)
              if "chief human resources" in t or t=="chro": return 120
              if ("vp" in t or "vice president" in t) and ("human resources" in t or re.search(r"\bhr\b",t)): return 115
              if "head" in t and ("human resources" in t or re.search(r"\bhr\b",t)): return 110
              if "director" in t and ("human resources" in t or re.search(r"\bhr\b",t)): return 105
              if "manager" in t and ("human resources" in t or re.search(r"\bhr\b",t)): return 100
              if "head of people" in t: return 95
              if "people" in t and "culture" in t and "director" in t: return 92
              if "people director" in t: return 90
              if "people" in t and "culture" in t and "manager" in t: return 88
              return -1

          def api_search(org_id,titles,small_only=False):
              body={"organization_ids":[org_id],"person_titles":titles,"include_similar_titles":True,"contact_email_status":["verified"],"per_page":10,"page":1}
              if small_only: body["organization_num_employees_ranges"]=["51,100"]
              payload=json.dumps(body).encode()
              for attempt in range(7):
                  req=urllib.request.Request(API_URL,data=payload,method="POST",headers={"x-api-key":API_KEY,"accept":"application/json","content-type":"application/json"})
                  try:
                      with urllib.request.urlopen(req,timeout=45) as r:
                          with lock: stats["requests"]+=1
                          return (json.loads(r.read().decode()).get("people") or [])
                  except urllib.error.HTTPError as e:
                      body_text=e.read().decode(errors="replace")[:300]
                      if e.code==429 or 500<=e.code<600:
                          with lock: stats["retries"]+=1
                          time.sleep(min(15,1.2*(2**attempt))); continue
                      raise RuntimeError(f"Apollo HTTP {e.code}: {body_text}")
                  except Exception:
                      if attempt<6:
                          with lock: stats["retries"]+=1
                          time.sleep(min(15,1.2*(2**attempt))); continue
                      raise
              raise RuntimeError("Apollo search retries exhausted")

          def ranked(people,persona,path):
              scorer=exec_score if persona=="Executive" else hr_score
              out=[]; seen=set()
              for p in people:
                  pid=clean(p.get("id")); title=clean(p.get("title")); score=scorer(title)
                  if not pid or pid in seen or score<0 or not p.get("has_email"): continue
                  seen.add(pid)
                  out.append({"apollo_person_id":pid,"first_name":clean(p.get("first_name")),"last_name_obfuscated":clean(p.get("last_name_obfuscated")),"title":title,"persona":persona,"search_path":path,"candidate_score":score,"email_status":"verified"})
              out.sort(key=lambda x:(-x["candidate_score"],x["title"].lower(),x["apollo_person_id"]))
              return out[:3]

          def discover(company):
              oid=clean(company.get("Apollo Organization ID"))
              if not oid: return company,[],"missing_apollo_org_id"
              try:
                  # Companies in the 51-100 band: CEO/GM first, exactly as requested.
                  small_exec=ranked(api_search(oid,EXEC_TITLES,True),"Executive","small_51_100_exec")
                  if small_exec: return company,small_exec,""
                  # Otherwise select the strongest HR leader with a verified email.
                  hr=ranked(api_search(oid,HR_TITLES,False),"HR","hr_leadership")
                  if hr: return company,hr,""
                  # If no HR leader has a verified email, fall back to CEO/GM.
                  exec_fallback=ranked(api_search(oid,EXEC_TITLES,False),"Executive","exec_fallback")
                  return company,exec_fallback,""
              except Exception as e:
                  with lock: stats["errors"]+=1
                  return company,[],clean(e)

          with INPUT.open(newline="",encoding="utf-8-sig") as h: companies=list(csv.DictReader(h))
          results=[]
          with ThreadPoolExecutor(max_workers=12) as pool:
              futures=[pool.submit(discover,c) for c in companies]
              for i,f in enumerate(as_completed(futures),1):
                  results.append(f.result())
                  if i%200==0: print(f"Processed {i}/{len(companies)}")

          order={clean(c.get("Apollo Organization ID")):i for i,c in enumerate(companies)}
          results.sort(key=lambda x:order.get(clean(x[0].get("Apollo Organization ID")),10**9))

          all_fields=["Company Name","Industry","Domain","Website","Company LinkedIn","HQ City","HQ Region","Apollo Organization ID","Candidate Rank","Apollo Person ID","First Name","Last Name (masked)","Title","Persona","Search Path","Email Status"]
          primary_fields=[x for x in all_fields if x!="Candidate Rank"]

          with (OUT/"ojoor-contact-candidates.csv").open("w",newline="",encoding="utf-8-sig") as h:
              w=csv.DictWriter(h,fieldnames=all_fields); w.writeheader()
              for company,cands,error in results:
                  for rank,c in enumerate(cands,1):
                      w.writerow({"Company Name":company.get("Company Name",""),"Industry":company.get("Industry",""),"Domain":company.get("Domain",""),"Website":company.get("Website",""),"Company LinkedIn":company.get("LinkedIn",""),"HQ City":company.get("HQ City",""),"HQ Region":company.get("HQ Region",""),"Apollo Organization ID":company.get("Apollo Organization ID",""),"Candidate Rank":rank,"Apollo Person ID":c["apollo_person_id"],"First Name":c["first_name"],"Last Name (masked)":c["last_name_obfuscated"],"Title":c["title"],"Persona":c["persona"],"Search Path":c["search_path"],"Email Status":c["email_status"]})

          with (OUT/"ojoor-primary-candidates.csv").open("w",newline="",encoding="utf-8-sig") as h:
              w=csv.DictWriter(h,fieldnames=primary_fields); w.writeheader()
              for company,cands,error in results:
                  if not cands: continue
                  c=cands[0]
                  w.writerow({"Company Name":company.get("Company Name",""),"Industry":company.get("Industry",""),"Domain":company.get("Domain",""),"Website":company.get("Website",""),"Company LinkedIn":company.get("LinkedIn",""),"HQ City":company.get("HQ City",""),"HQ Region":company.get("HQ Region",""),"Apollo Organization ID":company.get("Apollo Organization ID",""),"Apollo Person ID":c["apollo_person_id"],"First Name":c["first_name"],"Last Name (masked)":c["last_name_obfuscated"],"Title":c["title"],"Persona":c["persona"],"Search Path":c["search_path"],"Email Status":c["email_status"]})

          with (OUT/"ojoor-companies-without-candidate.csv").open("w",newline="",encoding="utf-8-sig") as h:
              fields=["Company Name","Industry","Domain","Website","LinkedIn","HQ City","HQ Region","Apollo Organization ID","Discovery Error"]
              w=csv.DictWriter(h,fieldnames=fields); w.writeheader()
              for company,cands,error in results:
                  if cands: continue
                  w.writerow({"Company Name":company.get("Company Name",""),"Industry":company.get("Industry",""),"Domain":company.get("Domain",""),"Website":company.get("Website",""),"LinkedIn":company.get("LinkedIn",""),"HQ City":company.get("HQ City",""),"HQ Region":company.get("HQ Region",""),"Apollo Organization ID":company.get("Apollo Organization ID",""),"Discovery Error":error})

          found=sum(1 for _,c,_ in results if c)
          alternatives=sum(max(0,len(c)-1) for _,c,_ in results)
          summary={"generatedAt":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime()),"companies":len(companies),"companiesWithPrimaryCandidate":found,"companiesWithoutCandidate":len(companies)-found,"fallbackAlternativesStored":alternatives,"discoveryErrors":sum(1 for _,_,e in results if e),"apolloPeopleSearchRequests":stats["requests"],"apolloPeopleSearchRetries":stats["retries"],"enrichmentCreditsUsed":0,"rules":{"smallCompanyDefinition":"51-100 employees","smallCompanyPriority":"CEO / General Manager / Managing Director with verified email","otherwisePriority":"CHRO / VP HR / Head of HR / HR Director / HR Manager with verified email","fallback":"Executive only when no suitable HR candidate with verified email is found","maxFinalContactsPerCompany":1,"candidateAlternativesStoredForEmailFallback":3}}
          (OUT/"ojoor-contact-discovery-summary.json").write_text(json.dumps(summary,indent=2),encoding="utf-8")
          print(json.dumps(summary,indent=2))
          PY

      - name: Upload contact discovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: ojoor-contact-discovery-fast
          path: output/*
          retention-days: 1
          if-no-files-found: error

      - name: Cancel superseded discovery run
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/amohamed-alt/SDR-Project/actions/runs/34700065437/cancel -o /dev/null || true
