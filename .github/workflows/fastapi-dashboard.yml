name: Retire Legacy FastAPI Dashboard Gateway

on:
  pull_request:
    paths:
      - "docker-compose.fastapi-dashboard.yml"
      - ".github/workflows/fastapi-dashboard.yml"
  push:
    branches: [main]
    paths:
      - "docker-compose.fastapi-dashboard.yml"
      - ".github/workflows/fastapi-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate retired gateway compose
        run: docker compose -f docker-compose.fastapi-dashboard.yml config >/tmp/fastapi-retired-compose.yml

  retire:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: sdr-fastapi-dashboard-retirement
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      - name: Confirm primary SDR health before gateway retirement
        run: |
          set -euo pipefail
          CODE=$(curl --silent --show-error --connect-timeout 5 --max-time 15 \
            -o /tmp/pre-health.json -w '%{http_code}' \
            'https://sdr.dashboardtalentera.tech/api/health?pre_fastapi_retire=1' || true)
          test "$CODE" = "200" || {
            echo "::error::Primary SDR endpoint is not healthy enough to retire the legacy gateway."
            cat /tmp/pre-health.json 2>/dev/null || true
            exit 1
          }

      - name: Replace legacy gateway service with inert container
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
          virtual-machine: "1604210"
          project-name: sdr-fastapi-dashboard
          docker-compose-path: docker-compose.fastapi-dashboard.yml

      - name: Stop retired gateway project and preserve its volume
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -euo pipefail
          AUTH="$HOSTINGER_API_KEY"
          case "$AUTH" in Bearer\ *) ;; *) AUTH="Bearer $AUTH" ;; esac
          VM='https://developers.hostinger.com/api/vps/v1/virtual-machines/1604210'
          PROJECT='sdr-fastapi-dashboard'

          CODE=$(curl --silent --show-error --connect-timeout 8 --max-time 30 \
            -X POST -H "Authorization: $AUTH" -H 'Accept: application/json' \
            -o /tmp/stop.json -w '%{http_code}' "$VM/docker/$PROJECT/stop" || true)
          echo "Stop $PROJECT: HTTP ${CODE:-000}"
          if ! { [ "$CODE" -ge 200 ] 2>/dev/null && [ "$CODE" -lt 300 ] 2>/dev/null; }; then
            cat /tmp/stop.json 2>/dev/null || true
            echo "::error::Could not stop legacy FastAPI gateway."
            exit 1
          fi

          ACTION_ID=$(jq -r '.id // .action.id // empty' /tmp/stop.json 2>/dev/null || true)
          if [ -n "$ACTION_ID" ]; then
            for I in $(seq 1 30); do
              curl --silent --show-error --connect-timeout 8 --max-time 20 \
                -H "Authorization: $AUTH" -H 'Accept: application/json' \
                -o /tmp/action.json "$VM/actions/$ACTION_ID" || true
              STATE=$(jq -r '.state // "unknown"' /tmp/action.json 2>/dev/null || echo unknown)
              echo "Gateway stop ${I}/30: ${STATE}"
              case "$STATE" in success|completed) break ;; failed|error) cat /tmp/action.json; exit 1 ;; esac
              sleep 4
            done
          fi

      - name: Verify Next.js owns the SDR route
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -euo pipefail
          AUTH="$HOSTINGER_API_KEY"
          case "$AUTH" in Bearer\ *) ;; *) AUTH="Bearer $AUTH" ;; esac
          VM='https://developers.hostinger.com/api/vps/v1/virtual-machines/1604210'
          READY=false

          for ATTEMPT in $(seq 1 30); do
            CODE=$(curl --silent --show-error --connect-timeout 5 --max-time 12 \
              -D /tmp/health.headers -o /tmp/health.json -w '%{http_code}' \
              "https://sdr.dashboardtalentera.tech/api/health?fastapi_retired=$ATTEMPT" || true)
            GATEWAY_HEADER=$(grep -i '^x-dashboard-gateway:' /tmp/health.headers 2>/dev/null || true)
            echo "Main health ${ATTEMPT}/30: HTTP=${CODE:-000} gateway_header=${GATEWAY_HEADER:-none}"
            if [ "$CODE" = "200" ] && ! printf '%s' "$GATEWAY_HEADER" | grep -qi 'fastapi'; then
              READY=true
              break
            fi
            sleep 4
          done

          if [ "$READY" != "true" ]; then
            echo "::error::Primary route failed after gateway retirement; restarting gateway as rollback."
            curl --silent --show-error --connect-timeout 8 --max-time 30 \
              -X POST -H "Authorization: $AUTH" -H 'Accept: application/json' \
              "$VM/docker/sdr-fastapi-dashboard/start" || true
            exit 1
          fi
