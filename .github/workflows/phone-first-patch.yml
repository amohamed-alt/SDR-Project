name: Apply Phone-First Net-New Patch

on:
  push:
    branches: [phone-first-net-new]
    paths:
      - ".github/workflows/phone-first-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phone-first-net-new
          fetch-depth: 0
      - name: Apply deterministic phone-first edits
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly 1 match, found {count}\n--- needle ---\n{old[:500]}")
              p.write_text(text.replace(old, new, 1))

          # FastAPI/Postgres: expose phone-ready counts and sort phone-ready accounts first.
          path = "services/dashboard-cache/app.py"
          replace_once(path,
'''            SELECT a.*,
                   COALESCE(p.people_count, 0) AS people_count,
                   COALESCE(p.enriched_count, 0) AS enriched_count,
                   COALESCE(push.push_count, 0) AS push_count
            FROM acquisition_accounts a
            LEFT JOIN LATERAL (
                SELECT COUNT(*) AS people_count,
                       COUNT(*) FILTER (WHERE enrichment_status = 'enriched') AS enriched_count
                FROM acquisition_people ap WHERE ap.account_domain = a.domain
            ) p ON TRUE
''',
'''            SELECT a.*,
                   COALESCE(p.people_count, 0) AS people_count,
                   COALESCE(p.enriched_count, 0) AS enriched_count,
                   COALESCE(p.phone_ready_count, 0) AS phone_ready_count,
                   COALESCE(push.push_count, 0) AS push_count
            FROM acquisition_accounts a
            LEFT JOIN LATERAL (
                SELECT COUNT(*) AS people_count,
                       COUNT(*) FILTER (WHERE enrichment_status = 'enriched') AS enriched_count,
                       COUNT(*) FILTER (
                           WHERE enrichment_status = 'enriched'
                             AND jsonb_array_length(phones) > 0
                       ) AS phone_ready_count
                FROM acquisition_people ap WHERE ap.account_domain = a.domain
            ) p ON TRUE
''')
          replace_once(path,
'''            ORDER BY a.gtm_score DESC, a.intent_score DESC, a.active_jobs DESC, a.name ASC
''',
'''            ORDER BY
                CASE WHEN COALESCE(p.phone_ready_count, 0) > 0 THEN 1 ELSE 0 END DESC,
                a.gtm_score DESC, a.intent_score DESC, a.active_jobs DESC, a.name ASC
''')
          replace_once(path,
'''                COUNT(*) FILTER (WHERE exclusion_status='eligible' AND status IN ('people_ready','enriched')) AS people_ready,
                COUNT(*) FILTER (WHERE exclusion_status='eligible' AND status='enriched') AS enriched,
                COUNT(*) FILTER (WHERE status='pushed') AS pushed,
''',
'''                COUNT(*) FILTER (WHERE exclusion_status='eligible' AND status IN ('people_ready','enriched')) AS people_ready,
                (SELECT COUNT(DISTINCT ap.account_domain)
                   FROM acquisition_people ap
                   JOIN acquisition_accounts aa ON aa.domain = ap.account_domain
                  WHERE aa.exclusion_status='eligible'
                    AND ap.enrichment_status='enriched'
                    AND jsonb_array_length(ap.phones) > 0) AS phone_ready,
                COUNT(*) FILTER (WHERE exclusion_status='eligible' AND status='enriched') AS enriched,
                COUNT(*) FILTER (WHERE status='pushed') AS pushed,
''')
          replace_once(path,
'''            "evidence": row.get("evidence") or {}, "peopleCount": int(row.get("people_count") or 0),
            "enrichedCount": int(row.get("enriched_count") or 0), "pushCount": int(row.get("push_count") or 0),
''',
'''            "evidence": row.get("evidence") or {}, "peopleCount": int(row.get("people_count") or 0),
            "enrichedCount": int(row.get("enriched_count") or 0),
            "phoneReadyCount": int(row.get("phone_ready_count") or 0), "pushCount": int(row.get("push_count") or 0),
''')

          # Shared TypeScript type.
          replace_once("src/lib/acquisition-data-api.ts",
'''  peopleCount?: number;
  enrichedCount?: number;
  pushCount?: number;
''',
'''  peopleCount?: number;
  enrichedCount?: number;
  phoneReadyCount?: number;
  pushCount?: number;
''')

          # Dashboard: phone-first account sort, phone-ready KPI, phone-first person order, CALL priority.
          path = "src/components/NetNewAccounts.tsx"
          replace_once(path,
'''  peopleCount: number;
  enrichedCount: number;
  pushCount: number;
''',
'''  peopleCount: number;
  enrichedCount: number;
  phoneReadyCount: number;
  pushCount: number;
''')
          replace_once(path,
'''function statusLabel(account: Account) {
  if (account.status === "pushed") return "In HubSpot";
  if (account.status === "enriched") return "Contact ready";
  if (account.status === "people_ready") return "People found";
  if (account.exclusionStatus === "review") return "Review";
  return "Qualified";
}
''',
'''function statusLabel(account: Account) {
  if (account.status === "pushed") return "In HubSpot";
  if (account.phoneReadyCount > 0) return "Phone ready";
  if (account.status === "enriched") return "Email ready";
  if (account.status === "people_ready") return "People found";
  if (account.exclusionStatus === "review") return "Review";
  return "Qualified";
}
''')
          replace_once(path,
'''    return (payload?.accounts || []).filter((account) => {
      if (tier && account.gtmTier !== tier) return false;
      if (country && account.country !== country) return false;
      if (!query) return true;
      return [account.name, account.domain, account.industry, account.detectedAts, account.primaryPersona, account.strongestSignal]
        .join(" ").toLowerCase().includes(query);
    });
''',
'''    return (payload?.accounts || []).filter((account) => {
      if (tier && account.gtmTier !== tier) return false;
      if (country && account.country !== country) return false;
      if (!query) return true;
      return [account.name, account.domain, account.industry, account.detectedAts, account.primaryPersona, account.strongestSignal]
        .join(" ").toLowerCase().includes(query);
    }).sort((a, b) => {
      const phoneDelta = Number(b.phoneReadyCount > 0) - Number(a.phoneReadyCount > 0);
      if (phoneDelta) return phoneDelta;
      return b.gtmScore - a.gtmScore || b.intentScore - a.intentScore || b.activeJobs - a.activeJobs || a.name.localeCompare(b.name);
    });
''')
          replace_once(path,
'''    setPeople(data.people || []);
''',
'''    setPeople([...(data.people || [])].sort((a, b) => {
      const phoneDelta = Number(b.phones.length > 0) - Number(a.phones.length > 0);
      if (phoneDelta) return phoneDelta;
      const emailDelta = Number(b.emails.length > 0) - Number(a.emails.length > 0);
      if (emailDelta) return emailDelta;
      return b.rankScore - a.rankScore;
    }));
''')
          replace_once(path,
'''      <div><span>Enriched</span><strong>{number(summary.enriched || 0)}</strong><small>Email / phone available</small></div>
''',
'''      <div className={styles.metricHot}><span>Phone ready</span><strong>{number(summary.phone_ready || 0)}</strong><small>Verified phone available</small></div>
''')
          replace_once(path,
'''      <div><Coins size={17}/><span><strong>Cost control</strong> Search people first; enrich only the selected persona</span></div>
''',
'''      <div><Coins size={17}/><span><strong>Phone-first</strong> Verified phone leads are routed and pushed before email-only contacts</span></div>
''')
          replace_once(path,
'''          priority: selected.gtmTier === "A" ? "high" : selected.gtmTier === "B" ? "medium" : "normal",
''',
'''          priority: person.phones.length ? "high" : selected.gtmTier === "A" ? "high" : selected.gtmTier === "B" ? "medium" : "normal",
''')
          replace_once(path,
'''            { label: "Persona match", points: Math.min(100, person.rankScore) },
''',
'''            { label: "Persona match", points: Math.min(100, person.rankScore) },
            { label: person.phones.length ? "Verified phone available" : "Email-only contact", points: person.phones.length ? 100 : 30 },
''')
          replace_once(path,
'''{person.enrichmentStatus === "enriched" ? <span className={styles.verified}><BadgeCheck size={12}/> Enriched</span> : null}''',
'''{person.enrichmentStatus === "enriched" ? <span className={styles.verified}>{person.phones.length ? <Phone size={12}/> : <BadgeCheck size={12}/>} {person.phones.length ? "Phone ready" : "Email ready"}</span> : null}''')

          # Autorun: accounts already holding phone-ready people come first; within an account phones beat emails.
          path = "src/app/api/acquisition/autorun/route.ts"
          replace_once(path,
'''function accountPriority(account: AcquisitionAccount) {
  const tier = account.gtmTier === "A" ? 400 : account.gtmTier === "B" ? 300 : account.gtmTier === "C" ? 200 : 100;
  return tier + account.gtmScore * 2 + Math.max(-20, Math.min(40, account.headcountGrowth));
}

function hasReachableContact(person: AcquisitionPerson) {
  return person.enrichmentStatus === "enriched" && Boolean(person.emails.length || person.phones.length);
}
''',
'''function accountPriority(account: AcquisitionAccount) {
  const phoneBoost = Number(account.phoneReadyCount || 0) > 0 ? 1200 : 0;
  const tier = account.gtmTier === "A" ? 400 : account.gtmTier === "B" ? 300 : account.gtmTier === "C" ? 200 : 100;
  return phoneBoost + tier + account.gtmScore * 2 + Math.max(-20, Math.min(40, account.headcountGrowth));
}

function hasReachableContact(person: AcquisitionPerson) {
  return person.enrichmentStatus === "enriched" && Boolean(person.emails.length || person.phones.length);
}

function contactPriority(person: AcquisitionPerson) {
  return (person.phones.length ? 1000 : 0) + (person.emails.length ? 100 : 0) + person.rankScore;
}
''')
          replace_once(path,
'''        const ranked = [...people].sort((a, b) => b.rankScore - a.rankScore);
''',
'''        const ranked = [...people].sort((a, b) => contactPriority(b) - contactPriority(a));
''')
          replace_once(path,
'''          person = refreshed.find((item) => item.uid === person?.uid) || refreshed.sort((a, b) => b.rankScore - a.rankScore)[0];
''',
'''          person = refreshed.find((item) => item.uid === person?.uid) || refreshed.sort((a, b) => contactPriority(b) - contactPriority(a))[0];
''')
          replace_once(path,
'''      priority: current.gtmTier === "A" ? "high" : current.gtmTier === "B" ? "medium" : "normal",
''',
'''      priority: person.phones.length ? "high" : current.gtmTier === "A" ? "high" : current.gtmTier === "B" ? "medium" : "normal",
''')
          replace_once(path,
'''          title: person.title,
          status: pushed.result.duplicate ? "duplicate_task" : "pushed",
''',
'''          title: person.title,
          channel: person.phones.length ? "phone" : "email",
          status: pushed.result.duplicate ? "duplicate_task" : "pushed",
''')

          # Recovery V2: same phone-first selection and task priority.
          path = "src/app/api/acquisition/recovery-v2/route.ts"
          replace_once(path,
'''function hasReachable(person: AcquisitionPerson) {
  return person.enrichmentStatus === "enriched" && Boolean(person.emails.length || person.phones.length);
}
''',
'''function hasReachable(person: AcquisitionPerson) {
  return person.enrichmentStatus === "enriched" && Boolean(person.emails.length || person.phones.length);
}

function contactPriority(person: AcquisitionPerson) {
  return (person.phones.length ? 1000 : 0) + (person.emails.length ? 100 : 0) + person.rankScore;
}
''')
          replace_once(path,
'''function accountPriority(account: AcquisitionAccount) {
  const recoveryIndex = RECOVERY_DOMAINS.indexOf(account.domain as typeof RECOVERY_DOMAINS[number]);
  const recoveryBoost = recoveryIndex >= 0 ? 2000 - recoveryIndex * 100 : 0;
  const tier = account.gtmTier === "A" ? 400 : account.gtmTier === "B" ? 300 : account.gtmTier === "C" ? 200 : 100;
  return recoveryBoost + tier + account.gtmScore * 2 + Math.max(-20, Math.min(40, account.headcountGrowth));
}
''',
'''function accountPriority(account: AcquisitionAccount) {
  const recoveryIndex = RECOVERY_DOMAINS.indexOf(account.domain as typeof RECOVERY_DOMAINS[number]);
  const recoveryBoost = recoveryIndex >= 0 ? 2000 - recoveryIndex * 100 : 0;
  const phoneBoost = Number(account.phoneReadyCount || 0) > 0 ? 1200 : 0;
  const tier = account.gtmTier === "A" ? 400 : account.gtmTier === "B" ? 300 : account.gtmTier === "C" ? 200 : 100;
  return recoveryBoost + phoneBoost + tier + account.gtmScore * 2 + Math.max(-20, Math.min(40, account.headcountGrowth));
}
''')
          replace_once(path,
'''      priority: account.gtmTier === "A" ? "high" : account.gtmTier === "B" ? "medium" : "normal",
''',
'''      priority: person.phones.length ? "high" : account.gtmTier === "A" ? "high" : account.gtmTier === "B" ? "medium" : "normal",
''')
          replace_once(path,
'''        let reachable = people.filter(hasReachable).sort((a, b) => b.rankScore - a.rankScore)[0];
''',
'''        let reachable = people.filter(hasReachable).sort((a, b) => contactPriority(b) - contactPriority(a))[0];
''')
          replace_once(path,
'''          reachable = people.filter(hasReachable).sort((a, b) => b.rankScore - a.rankScore)[0];
''',
'''          reachable = people.filter(hasReachable).sort((a, b) => contactPriority(b) - contactPriority(a))[0];
''')
          replace_once(path,
'''          account: account.name,
          status: pushed.result.duplicate ? "duplicate_task" : "pushed",
''',
'''          account: account.name,
          channel: reachable.phones.length ? "phone" : "email",
          status: pushed.result.duplicate ? "duplicate_task" : "pushed",
''')

          # Ensure the temporary patch workflow does not stay in the product branch.
          Path(".github/workflows/phone-first-patch.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/dashboard-cache/app.py src/lib/acquisition-data-api.ts src/components/NetNewAccounts.tsx src/app/api/acquisition/autorun/route.ts src/app/api/acquisition/recovery-v2/route.ts .github/workflows/phone-first-patch.yml
          git commit -m "Prioritize phone-ready net-new leads"
          git push origin HEAD:phone-first-net-new
