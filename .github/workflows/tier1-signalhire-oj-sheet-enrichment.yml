name: Tier 1 SignalHire Oj Sheet Enrichment

on:
  workflow_dispatch:
    inputs:
      max_companies:
        description: "Maximum rows missing a work email to process"
        required: false
        default: "200"
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: read

concurrency:
  group: tier1-contacts-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SIGNALHIRE_API_KEY: ${{ secrets.SignalHire_Oj }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      TIER1_SPREADSHEET_ID: "1QaJX18_ZcKzN3PNouc0Y067a4qIXSJZIWQGOMuxDC1M"
      MAX_COMPANIES: ${{ github.event.inputs.max_companies || '200' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate secrets
        run: |
          test -n "$SIGNALHIRE_API_KEY" || { echo "::error::SignalHire_Oj secret is missing"; exit 1; }
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" || { echo "::error::GOOGLE_SERVICE_ACCOUNT_JSON is missing"; exit 1; }
      - name: Run SignalHire Oj enrichment
        run: node scripts/tier1-signalhire-oj-sheet-enrichment.mjs
