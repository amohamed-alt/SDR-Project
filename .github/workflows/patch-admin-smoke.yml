name: Patch Admin Smoke

on:
  push:
    branches: [feat/sdr-admin-password-gate]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/sdr-admin-password-gate
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/smoke.mjs')
          text = p.read_text()
          old = 'if (acquisitionOwnerGateResponse.status !== 401 || !String(acquisitionOwnerGate.error || "").includes("Owner PIN")) throw new Error("Net-new acquisition owner PIN gate is not fail-closed when the PIN is missing");'
          new = 'if (acquisitionOwnerGateResponse.status !== 401 || !String(acquisitionOwnerGate.error || "").includes("Admin password")) throw new Error("Net-new acquisition admin password gate is not fail-closed when admin access is missing");'
          if old not in text: raise SystemExit('old owner smoke assertion not found')
          text = text.replace(old, new, 1)
          text = text.replace('acquisition owner PIN gate, compact SDR tools launcher', 'acquisition admin password gate, compact SDR tools launcher', 1)
          p.write_text(text)
          Path('.github/workflows/patch-admin-smoke.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update smoke test for SDR admin password gate"
          git push origin HEAD:feat/sdr-admin-password-gate
