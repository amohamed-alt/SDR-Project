name: Bootstrap Approved Net-New Acquisition

on:
  workflow_run:
    workflows: ["Deploy SDR Dashboard to Hostinger"]
    types: [completed]
  workflow_dispatch:
  # One-time deterministic kick for the approved 2026-08-22 seed. The endpoint
  # itself is marker-protected, so later deploy completions remain idempotent.
  push:
    branches: [main]
    paths:
      - ".github/workflows/acquisition-bootstrap.yml"

permissions:
  contents: read

jobs:
  bootstrap:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate worker credential
        env:
          WORKER_KEY: ${{ secrets.SIGNALHIRE_API_KEY }}
        run: |
          test -n "$WORKER_KEY" || {
            echo "::error::SIGNALHIRE_API_KEY is required for the bounded acquisition worker."
            exit 1
          }

      - name: Seed approved accounts and process first priority batch
        env:
          WORKER_KEY: ${{ secrets.SIGNALHIRE_API_KEY }}
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl --silent --show-error \
            --connect-timeout 10 \
            --max-time 840 \
            --output /tmp/acquisition-bootstrap.json \
            --write-out '%{http_code}' \
            -X POST 'https://sdr.dashboardtalentera.tech/api/acquisition/bootstrap-once' \
            -H 'Content-Type: application/json' \
            -H "x-acquisition-worker-key: $WORKER_KEY" \
            -d '{"limit":8}' || true)

          echo "Acquisition bootstrap HTTP: ${HTTP_CODE:-none}"
          jq '{status, startedAt, completedAt, seed, selected, pushed, duplicates, unresolved, failed, outcomes, marker}' /tmp/acquisition-bootstrap.json || cat /tmp/acquisition-bootstrap.json

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Approved acquisition bootstrap failed."
            exit 1
          fi

          STATUS=$(jq -r '.status // "unknown"' /tmp/acquisition-bootstrap.json 2>/dev/null || echo unknown)
          if [ "$STATUS" != "completed" ] && [ "$STATUS" != "already_completed" ]; then
            echo "::error::Acquisition bootstrap returned unexpected status: $STATUS"
            exit 1
          fi
