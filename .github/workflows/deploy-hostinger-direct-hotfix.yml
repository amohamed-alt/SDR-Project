# Dashboard CPU-light recovery trigger: 2026-09-01T09:36+03:00
name: Direct Hostinger Hotfix Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    concurrency:
      group: hostinger-sdr-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5

      - name: Validate CPU-light compose
        run: docker compose -f docker-compose.light.yml config >/tmp/sdr-light-compose.txt

      - name: Validate SDR admin password
        env:
          SDR_ADMIN_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD || secrets.SDR_ADMIN_PASSWORD || secrets.ACQUISITION_OWNER_TOKEN }}
        run: |
          test -n "$SDR_ADMIN_PASSWORD" || {
            echo "::error::Configure DASHBOARD_PASSWORD, SDR_ADMIN_PASSWORD, or ACQUISITION_OWNER_TOKEN."
            exit 1
          }
          echo "SDR admin password is configured"

      - name: Deploy without rebooting production VPS
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
          virtual-machine: "1604210"
          project-name: sdr-project
          docker-compose-path: docker-compose.light.yml
          environment-variables: |
            SDR_BUILD_REF=${{ github.sha }}
            CAREER_GENERATION=v3
            DISABLE_AUTH=true
            SDR_ADMIN_PASSWORD=${{ secrets.DASHBOARD_PASSWORD || secrets.SDR_ADMIN_PASSWORD || secrets.ACQUISITION_OWNER_TOKEN }}
            DASHBOARD_PASSWORD=${{ secrets.DASHBOARD_PASSWORD || secrets.SDR_ADMIN_PASSWORD || secrets.ACQUISITION_OWNER_TOKEN }}
            SMARTLEAD_AUTOPILOT_ENABLED=true
            SMARTLEAD_LEGACY_SEND_ENABLED=false

      - name: Verify exact public build, admin gate, and no Basic Auth
        run: |
          set -euo pipefail
          HOST='sdr.dashboardtalentera.tech'
          EXPECTED='${{ github.sha }}'
          READY=false

          for ATTEMPT in $(seq 1 60); do
            HEALTH_CODE=$(curl --silent --show-error \
              --connect-timeout 5 \
              --max-time 12 \
              -H 'Cache-Control: no-cache' \
              --output /tmp/health.json \
              --write-out '%{http_code}' \
              "https://${HOST}/api/health?direct_hotfix=${EXPECTED}&attempt=${ATTEMPT}" || true)
            BUILD_REF=$(jq -r '.buildRef // ""' /tmp/health.json 2>/dev/null || true)
            echo "Health ${ATTEMPT}/60: HTTP=${HEALTH_CODE:-000} build=${BUILD_REF:-none}"

            if [ "$HEALTH_CODE" = "200" ] && [ "$BUILD_REF" = "$EXPECTED" ]; then
              ROOT_CODE=$(curl --silent --show-error \
                --connect-timeout 5 \
                --max-time 15 \
                -H 'Cache-Control: no-cache' \
                -D /tmp/root.headers \
                --output /tmp/root.html \
                --write-out '%{http_code}' \
                "https://${HOST}/" || true)
              ADMIN_CODE=$(curl --silent --show-error \
                --connect-timeout 5 \
                --max-time 15 \
                -H 'Cache-Control: no-cache' \
                --output /tmp/admin.json \
                --write-out '%{http_code}' \
                "https://${HOST}/api/sdr-admin" || true)
              ADMIN_CONFIGURED=$(jq -r '.configured // false' /tmp/admin.json 2>/dev/null || echo false)
              echo "Public dashboard root: HTTP=${ROOT_CODE:-000}; admin API: HTTP=${ADMIN_CODE:-000} configured=${ADMIN_CONFIGURED}"
              if [ "$ROOT_CODE" != "401" ] && [ "$ROOT_CODE" != "000" ] && \
                 ! grep -qi '^WWW-Authenticate:' /tmp/root.headers && \
                 [ "$ADMIN_CODE" = "200" ] && [ "$ADMIN_CONFIGURED" = "true" ]; then
                READY=true
                break
              fi
            fi

            sleep 10
          done

          if [ "$READY" != "true" ]; then
            echo "::error::Exact public hotfix build did not become reachable with admin auth configured and browser Basic Auth disabled."
            echo "Last health response:"
            head -c 500 /tmp/health.json 2>/dev/null || true
            echo
            echo "Last admin response:"
            head -c 300 /tmp/admin.json 2>/dev/null || true
            echo
            exit 1
          fi

          echo "Direct hotfix verified: exact build is public, admin gate is configured, and browser Basic Auth is gone."
