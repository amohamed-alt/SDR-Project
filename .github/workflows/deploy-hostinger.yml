name: Deploy SDR Dashboard to Hostinger

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

# Serialize the entire workflow. Cancelling a runner does not cancel an already
# accepted Hostinger control-plane action, so overlapping deploys must queue.
concurrency:
  group: hostinger-sdr-production
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.freshness.outputs.should_deploy }}
      deploy_sha: ${{ steps.freshness.outputs.deploy_sha }}
    steps:
      - name: Reject stale main deployment candidates
        id: freshness
        uses: actions/github-script@v7
        env:
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DEPLOY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          retries: 3
          script: |
            const candidate = String(process.env.CANDIDATE_SHA || '').trim();
            core.setOutput('deploy_sha', candidate);
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('should_deploy', 'true');
              return;
            }
            const { data: branch } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });
            const currentMain = branch.commit.sha;
            if (candidate !== currentMain) {
              core.setOutput('should_deploy', 'false');
              core.notice(`Skipping stale deployment ${candidate}; current main is ${currentMain}.`);
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: candidate,
                state: 'success',
                context: 'hostinger/deploy',
                description: 'Superseded by newer main commit; production untouched',
                target_url: process.env.DEPLOY_URL,
              });
              return;
            }
            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: candidate,
              per_page: 100,
            });
            const files = Array.isArray(commit.files) ? commit.files : [];
            const productionFiles = files.filter((file) => {
              const path = String(file.filename || '');
              return !path.startsWith('.github/') &&
                !path.startsWith('docs/') &&
                path !== 'README.md' &&
                !path.endsWith('.md');
            });
            if (productionFiles.length === 0) {
              core.setOutput('should_deploy', 'false');
              core.notice('Skipping Hostinger deployment because this commit only changes workflows or documentation.');
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: candidate,
                state: 'success',
                context: 'hostinger/deploy',
                description: 'No production files changed; production untouched',
                target_url: process.env.DEPLOY_URL,
              });
              return;
            }
            core.notice(`Production changes detected: ${productionFiles.map((file) => file.filename).join(', ')}`);
            core.setOutput('should_deploy', 'true');

  deploy:
    needs: preflight
    if: needs.preflight.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEPLOY_SHA: ${{ needs.preflight.outputs.deploy_sha }}
      DEPLOY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Mark deployment pending
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.DEPLOY_SHA,
              state: 'pending',
              context: 'hostinger/deploy',
              description: 'Deploying tracked CPU-light SDR stack',
              target_url: process.env.DEPLOY_URL,
            });

      - name: Checkout validated revision
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Validate CPU-light compose
        run: docker compose -f docker-compose.light.yml config >/tmp/sdr-light-compose.txt

      - name: Validate required and advisory secrets
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
          SDR_ADMIN_PASSWORD: ${{ secrets.SDR_ADMIN_PASSWORD || secrets.DASHBOARD_PASSWORD || secrets.ACQUISITION_OWNER_TOKEN }}
          PRIMEFORGE_API_KEY: ${{ secrets.PRIMEFORGE_API_KEY || secrets.PRIME_FORGE_API_KEY }}
        run: |
          test -n "$HOSTINGER_API_KEY" || { echo "::error::Hostinger API token is missing."; exit 1; }
          test -n "$SDR_ADMIN_PASSWORD" || { echo "::error::SDR admin password is missing."; exit 1; }
          [ -n "$PRIMEFORGE_API_KEY" ] && echo "Primeforge advisory configured" || echo "Primeforge advisory not configured"

      - name: Probe running VPS without reboot or delete
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -euo pipefail
          AUTH="$HOSTINGER_API_KEY"
          case "$AUTH" in Bearer\ *) ;; *) AUTH="Bearer $AUTH" ;; esac
          VM='https://developers.hostinger.com/api/vps/v1/virtual-machines/1604210'
          CODE=$(curl --silent --show-error --connect-timeout 8 --max-time 30 \
            -H "Authorization: $AUTH" -H 'Accept: application/json' \
            -o /tmp/vm.json -w '%{http_code}' "$VM" || true)
          STATE=$(jq -r '.state // "unknown"' /tmp/vm.json 2>/dev/null || echo unknown)
          echo "Hostinger VM: HTTP ${CODE:-000}, state=${STATE}"
          [ "$CODE" = "200" ] && [ "$STATE" = "running" ] || {
            echo "::error::VPS is not confirmed running; production will not be mutated."
            exit 1
          }

          DCODE=$(curl --silent --show-error --connect-timeout 8 --max-time 30 \
            -H "Authorization: $AUTH" -H 'Accept: application/json' \
            -o /tmp/docker.json -w '%{http_code}' "$VM/docker" || true)
          echo "Docker Manager inventory: HTTP ${DCODE:-000}"
          if [ "$DCODE" != "200" ]; then
            jq '{message,correlation_id}' /tmp/docker.json 2>/dev/null || true
            echo "::warning::Docker inventory is degraded. No reboot, down, prune, or delete will be attempted."
          fi

      - name: Deploy CPU-light stack and track Hostinger action
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -euo pipefail
          AUTH="$HOSTINGER_API_KEY"
          case "$AUTH" in Bearer\ *) ;; *) AUTH="Bearer $AUTH" ;; esac
          VM='https://developers.hostinger.com/api/vps/v1/virtual-machines/1604210'
          CONTENT_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${DEPLOY_SHA}/docker-compose.light.yml"

          # Hostinger actions continue server-side even if a GitHub runner is cancelled.
          # Refuse to start another Compose action while one is still active.
          ACODE=$(curl --silent --show-error --connect-timeout 8 --max-time 30 \
            -H "Authorization: $AUTH" -H 'Accept: application/json' \
            -o /tmp/predeploy-actions.json -w '%{http_code}' "$VM/actions?page=1" || true)
          [ "$ACODE" = "200" ] || {
            echo "::error::Cannot verify Hostinger action lock (HTTP ${ACODE:-000}); refusing to overlap a deployment."
            exit 1
          }
          ACTIVE_ACTIONS=$(jq -r '[.data[]? | select(
            ((.name // "") | startswith("docker_compose_")) and
            ((.state // "") | IN("pending","queued","started","running","processing","in_progress"))
          )] | length' /tmp/predeploy-actions.json)
          if [ "$ACTIVE_ACTIONS" -gt 0 ]; then
            jq -r '.data[]? | select(
              ((.name // "") | startswith("docker_compose_")) and
              ((.state // "") | IN("pending","queued","started","running","processing","in_progress"))
            ) | [.id,.name,.state,.created_at] | @tsv' /tmp/predeploy-actions.json
            echo "::error::A Hostinger Docker Compose action is already active; refusing an overlapping deploy."
            exit 1
          fi

          ENVIRONMENT=$(cat <<EOF
          SDR_BUILD_REF=${DEPLOY_SHA}
          DISABLE_AUTH=true
          DASHBOARD_ACCESS_MODE=public
          SDR_ADMIN_PASSWORD=${{ secrets.SDR_ADMIN_PASSWORD || secrets.DASHBOARD_PASSWORD || secrets.ACQUISITION_OWNER_TOKEN }}
          DASHBOARD_PASSWORD=${{ secrets.DASHBOARD_PASSWORD || secrets.SDR_ADMIN_PASSWORD || secrets.ACQUISITION_OWNER_TOKEN }}
          MAQSAM_INGEST_SECRET=${{ secrets.MAQSAM_INGEST_SECRET }}
          MAQSAM_ACCESS_KEY=${{ secrets.MAQSAM_ACCESS_KEY }}
          MAQSAM_ACCESS_SECRET=${{ secrets.MAQSAM_ACCESS_SECRET }}
          MAQSAM_TARGET_AGENT_EMAIL=${{ secrets.MAQSAM_TARGET_AGENT_EMAIL || 'm.chedid@bayt.net' }}
          MAQSAM_SYNC_INTERVAL_SECONDS=${{ secrets.MAQSAM_SYNC_INTERVAL_SECONDS || '600' }}
          MAQSAM_SYNC_LOOKBACK_SECONDS=${{ secrets.MAQSAM_SYNC_LOOKBACK_SECONDS || '10800' }}
          MAQSAM_SYNC_PAGE_COUNT=${{ secrets.MAQSAM_SYNC_PAGE_COUNT || '12' }}
          HUBSPOT_PRIVATE_APP_TOKEN=${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
          SMARTLEAD_AUTOPILOT_ENABLED=true
          SMARTLEAD_LEGACY_SEND_ENABLED=false
          EOF
          )

          BODY=$(jq -n \
            --arg project_name 'sdr-project' \
            --arg content "$CONTENT_URL" \
            --arg environment "$ENVIRONMENT" \
            '{project_name:$project_name,content:$content,environment:$environment}')

          CODE=$(curl --silent --show-error --connect-timeout 10 --max-time 60 \
            -X POST -H "Authorization: $AUTH" -H 'Accept: application/json' \
            -H 'Content-Type: application/json' -d "$BODY" \
            -o /tmp/deploy-action.json -w '%{http_code}' "$VM/docker" || true)
          echo "Hostinger deploy request: HTTP ${CODE:-000}"
          if [ -z "$CODE" ] || [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            jq '{message,correlation_id,errors}' /tmp/deploy-action.json 2>/dev/null || cat /tmp/deploy-action.json || true
            echo "::error::Hostinger rejected the deployment request."
            exit 1
          fi

          ACTION_ID=$(jq -r '.id // .action.id // empty' /tmp/deploy-action.json 2>/dev/null || true)
          STATE=$(jq -r '.state // .action.state // "unknown"' /tmp/deploy-action.json 2>/dev/null || echo unknown)
          echo "Deploy action id=${ACTION_ID:-none}, state=${STATE}"
          case "$STATE" in failed|error) cat /tmp/deploy-action.json; exit 1 ;; esac

          if [ -n "$ACTION_ID" ]; then
            ACTION_DONE=false
            for I in $(seq 1 60); do
              ACODE=$(curl --silent --show-error --connect-timeout 8 --max-time 25 \
                -H "Authorization: $AUTH" -H 'Accept: application/json' \
                -o /tmp/action.json -w '%{http_code}' "$VM/actions/$ACTION_ID" || true)
              STATE=$(jq -r '.state // "unknown"' /tmp/action.json 2>/dev/null || echo unknown)
              echo "Deploy action ${I}/60: HTTP=${ACODE:-000}, state=${STATE}"
              case "$STATE" in
                success|completed) ACTION_DONE=true; break ;;
                failed|error) cat /tmp/action.json; echo "::error::Hostinger deploy action failed."; exit 1 ;;
              esac
              sleep 10
            done
            [ "$ACTION_DONE" = "true" ] || echo "::warning::Action did not reach terminal success; exact public build gate will decide."
          else
            echo "::warning::No Hostinger action id returned; exact public build gate will decide."
          fi

      - name: Verify exact public build, admin gate, and no browser Basic Auth
        run: |
          set -euo pipefail
          HOST='sdr.dashboardtalentera.tech'
          READY=false
          for ATTEMPT in $(seq 1 42); do
            HEALTH_CODE=$(curl --silent --show-error --connect-timeout 5 --max-time 12 \
              -H 'Cache-Control: no-cache' -o /tmp/health.json -w '%{http_code}' \
              "https://${HOST}/api/health?deploy=${DEPLOY_SHA}&attempt=${ATTEMPT}" || true)
            BUILD_REF=$(jq -r '.buildRef // ""' /tmp/health.json 2>/dev/null || true)
            echo "Production gate ${ATTEMPT}/42: HTTP=${HEALTH_CODE:-000} build=${BUILD_REF:-none}"

            if [ "$HEALTH_CODE" = "200" ] && [ "$BUILD_REF" = "$DEPLOY_SHA" ]; then
              ROOT_CODE=$(curl --silent --show-error --connect-timeout 5 --max-time 15 \
                -H 'Cache-Control: no-cache' -D /tmp/root.headers -o /tmp/root.html -w '%{http_code}' \
                "https://${HOST}/" || true)
              ADMIN_CODE=$(curl --silent --show-error --connect-timeout 5 --max-time 15 \
                -H 'Cache-Control: no-cache' -o /tmp/admin.json -w '%{http_code}' \
                "https://${HOST}/api/sdr-admin" || true)
              ADMIN_CONFIGURED=$(jq -r '.configured // false' /tmp/admin.json 2>/dev/null || echo false)
              if [ "$ROOT_CODE" != "000" ] && [ "$ROOT_CODE" != "401" ] && \
                 ! grep -qi '^WWW-Authenticate:' /tmp/root.headers && \
                 [ "$ADMIN_CODE" = "200" ] && [ "$ADMIN_CONFIGURED" = "true" ]; then
                READY=true
                break
              fi
            fi
            sleep 10
          done
          [ "$READY" = "true" ] || {
            echo "::error::Exact CPU-light build did not become publicly reachable with in-app admin configured and browser Basic Auth disabled."
            exit 1
          }

      - name: Verify heavy Docker Ollama is not active when inventory is available
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -euo pipefail
          AUTH="$HOSTINGER_API_KEY"
          case "$AUTH" in Bearer\ *) ;; *) AUTH="Bearer $AUTH" ;; esac
          URL='https://developers.hostinger.com/api/vps/v1/virtual-machines/1604210/docker/sdr-project/containers'
          CODE=$(curl --silent --show-error --connect-timeout 8 --max-time 30 \
            -H "Authorization: $AUTH" -H 'Accept: application/json' \
            -o /tmp/containers.json -w '%{http_code}' "$URL" || true)
          if [ "$CODE" != "200" ]; then
            echo "::warning::Container inventory unavailable after exact-build verification."
            exit 0
          fi
          jq -r '.[] | [.name,.image,.state,(.stats.cpu_percentage // 0)] | @tsv' /tmp/containers.json
          if jq -e '.[] | select(((.image // "") | ascii_downcase | contains("ollama/ollama")))' /tmp/containers.json >/dev/null; then
            echo "::error::Heavy Ollama container is still active."
            exit 1
          fi

      - name: Hostinger failure diagnostics
        if: failure()
        continue-on-error: true
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
        run: |
          AUTH="$HOSTINGER_API_KEY"
          case "$AUTH" in Bearer\ *) ;; *) AUTH="Bearer $AUTH" ;; esac
          VM='https://developers.hostinger.com/api/vps/v1/virtual-machines/1604210'
          ACODE=$(curl --silent --show-error --connect-timeout 8 --max-time 30 \
            -H "Authorization: $AUTH" -H 'Accept: application/json' \
            -o /tmp/actions.json -w '%{http_code}' "$VM/actions?page=1" || true)
          echo "Recent actions: HTTP ${ACODE:-000}"
          [ "$ACODE" = "200" ] && jq -r '.data[]? | [.id,.name,.state,.created_at,.updated_at] | @tsv' /tmp/actions.json | head -20 || cat /tmp/actions.json 2>/dev/null || true

          PCODE=$(curl --silent --show-error --connect-timeout 8 --max-time 30 \
            -H "Authorization: $AUTH" -H 'Accept: application/json' \
            -o /tmp/project-failure.json -w '%{http_code}' "$VM/docker/sdr-project" || true)
          echo "Stored project after failure: HTTP ${PCODE:-000}"
          if [ "$PCODE" = "200" ]; then
            HAS_IMAGE=$(jq -r '(.content // "") | contains("image: sdr-dashboard:")' /tmp/project-failure.json 2>/dev/null || echo false)
            HAS_SHA=$(jq -r --arg sha "$DEPLOY_SHA" '((.content // "") | contains($sha)) or ((.environment // "") | contains($sha))' /tmp/project-failure.json 2>/dev/null || echo false)
            echo "Stored project has versioned dashboard image=${HAS_IMAGE}; has deploy SHA=${HAS_SHA}"
          fi

          DCODE=$(curl --silent --show-error --connect-timeout 8 --max-time 30 \
            -H "Authorization: $AUTH" -H 'Accept: application/json' \
            -o /tmp/docker-failure.json -w '%{http_code}' "$VM/docker" || true)
          echo "Docker Manager after failure: HTTP ${DCODE:-000}"
          [ "$DCODE" = "200" ] || jq '{message,correlation_id}' /tmp/docker-failure.json 2>/dev/null || true
          curl --silent --show-error --connect-timeout 5 --max-time 12 \
            -H 'Cache-Control: no-cache' 'https://sdr.dashboardtalentera.tech/api/health?failure_diagnostic=1' || true
          echo

      - name: Mark deployment successful
        if: success()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.DEPLOY_SHA,
              state: 'success',
              context: 'hostinger/deploy',
              description: 'CPU-light SDR production verified',
              target_url: process.env.DEPLOY_URL,
            });

      - name: Mark deployment failed
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.DEPLOY_SHA,
              state: 'failure',
              context: 'hostinger/deploy',
              description: 'SDR production deploy or verification failed',
              target_url: process.env.DEPLOY_URL,
            });

      - name: Mark deployment cancelled
        if: cancelled()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.DEPLOY_SHA,
              state: 'error',
              context: 'hostinger/deploy',
              description: 'SDR production deployment cancelled',
              target_url: process.env.DEPLOY_URL,
            });
