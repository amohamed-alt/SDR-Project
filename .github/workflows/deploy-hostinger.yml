name: Deploy SDR Dashboard to Hostinger

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

# Hostinger Compose actions continue server-side after the GitHub runner exits.
# Serialize GitHub deploys and also wait for any still-running Hostinger action.
concurrency:
  group: hostinger-sdr-production
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.freshness.outputs.should_deploy }}
      deploy_sha: ${{ steps.freshness.outputs.deploy_sha }}
    steps:
      - name: Reject stale deployment candidates
        id: freshness
        uses: actions/github-script@v7
        env:
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          retries: 3
          script: |
            const candidate = String(process.env.CANDIDATE_SHA || '').trim();
            core.setOutput('deploy_sha', candidate);
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('should_deploy', 'true');
              return;
            }
            const { data: branch } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });
            if (candidate !== branch.commit.sha) {
              core.notice(`Skipping stale ${candidate}; current main is ${branch.commit.sha}.`);
              core.setOutput('should_deploy', 'false');
              return;
            }
            core.setOutput('should_deploy', 'true');

  deploy:
    needs: preflight
    if: needs.preflight.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_SHA: ${{ needs.preflight.outputs.deploy_sha }}
      DEPLOY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Mark deployment pending
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.DEPLOY_SHA,
              state: 'pending',
              context: 'hostinger/deploy',
              description: 'Deploying lean Traefik SDR stack',
              target_url: process.env.DEPLOY_URL,
            });

      - name: Checkout validated revision
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Validate canonical compose and required secrets
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
          SDR_ADMIN_PASSWORD: ${{ secrets.SDR_ADMIN_PASSWORD || secrets.DASHBOARD_PASSWORD || secrets.ACQUISITION_OWNER_TOKEN }}
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml config >/tmp/sdr-compose.txt
          test -n "$HOSTINGER_API_KEY" || { echo "::error::Hostinger API token is missing."; exit 1; }
          test -n "$SDR_ADMIN_PASSWORD" || { echo "::error::SDR admin password is missing."; exit 1; }

      - name: Deploy once and verify exact public build
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -euo pipefail
          AUTH="$HOSTINGER_API_KEY"
          case "$AUTH" in Bearer\ *) ;; *) AUTH="Bearer $AUTH" ;; esac
          VM='https://developers.hostinger.com/api/vps/v1/virtual-machines/1604210'
          HOST='sdr.dashboardtalentera.tech'
          CONTENT_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${DEPLOY_SHA}/docker-compose.yml"

          VM_CODE=$(curl -sS --connect-timeout 6 --max-time 15 \
            -H "Authorization: $AUTH" -H 'Accept: application/json' \
            -o /tmp/vm.json -w '%{http_code}' "$VM" || true)
          VM_STATE=$(jq -r '.state // "unknown"' /tmp/vm.json 2>/dev/null || echo unknown)
          echo "VPS: HTTP=${VM_CODE:-000} state=$VM_STATE"
          [ "$VM_CODE" = 200 ] && [ "$VM_STATE" = running ] || exit 1

          # Hostinger actions keep running after a GitHub runner times out. Queue
          # behind that server-side mutation instead of failing immediately and
          # requiring a manual rerun. This is read-only polling; no overlap occurs.
          ACTIVE_ID=''
          for LOCK_ATTEMPT in $(seq 1 60); do
            ACTIONS_CODE=$(curl -sS --connect-timeout 6 --max-time 15 \
              -H "Authorization: $AUTH" -H 'Accept: application/json' \
              -o /tmp/actions.json -w '%{http_code}' "$VM/actions?page=1" || true)
            [ "$ACTIONS_CODE" = 200 ] || { echo "::error::Cannot verify Hostinger action lock."; exit 1; }
            ACTIVE_ID=$(jq -r '[.data[]? | select(
              ((.name // "") | startswith("docker_compose_")) and
              ((.state // "") | IN("pending","queued","started","running","processing","in_progress"))
            )][0].id // empty' /tmp/actions.json)
            if [ -z "$ACTIVE_ID" ]; then
              break
            fi
            ACTIVE_STATE=$(jq -r --argjson id "$ACTIVE_ID" '.data[]? | select(.id == $id) | .state // "active"' /tmp/actions.json | head -1)
            echo "A Hostinger Compose action is already active: id=$ACTIVE_ID state=${ACTIVE_STATE:-active}; waiting ${LOCK_ATTEMPT}/60"
            sleep 5
          done
          [ -z "$ACTIVE_ID" ] || { echo "::error::Hostinger Compose action remained active after 5 minutes."; exit 1; }

          ENVIRONMENT=$(cat <<EOF
          SDR_BUILD_REF=${DEPLOY_SHA}
          DISABLE_AUTH=true
          DASHBOARD_ACCESS_MODE=public
          DASHBOARD_USERNAME=talentera
          SDR_ADMIN_PASSWORD=${{ secrets.SDR_ADMIN_PASSWORD || secrets.DASHBOARD_PASSWORD || secrets.ACQUISITION_OWNER_TOKEN }}
          DASHBOARD_PASSWORD=${{ secrets.DASHBOARD_PASSWORD || secrets.SDR_ADMIN_PASSWORD || secrets.ACQUISITION_OWNER_TOKEN }}
          HUBSPOT_PRIVATE_APP_TOKEN=${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
          ACQUISITION_OWNER_TOKEN=${{ secrets.ACQUISITION_OWNER_TOKEN }}
          APOLLO_API_KEY=${{ secrets.APOLLO_API_KEY }}
          SIGNALHIRE_API_KEY=${{ secrets.SIGNALHIRE_API_KEY }}
          MILLIONVERIFIER_API_KEY=${{ secrets.MILLIONVERIFIER_API_KEY }}
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI=https://sdr.dashboardtalentera.tech/api/google/callback
          GOOGLE_TOKEN_ENCRYPTION_KEY=${{ secrets.GOOGLE_TOKEN_ENCRYPTION_KEY }}
          MAQSAM_INGEST_SECRET=${{ secrets.MAQSAM_INGEST_SECRET }}
          MAQSAM_BASIC_AUTH=${{ secrets.MAQSAM_BASIC_AUTH }}
          MAQSAM_ACCESS_KEY=${{ secrets.MAQSAM_ACCESS_KEY }}
          MAQSAM_ACCESS_SECRET=${{ secrets.MAQSAM_ACCESS_SECRET }}
          MAQSAM_TARGET_AGENT_EMAIL=${{ secrets.MAQSAM_TARGET_AGENT_EMAIL || 'm.chedid@bayt.net' }}
          MAQSAM_SYNC_INTERVAL_SECONDS=${{ secrets.MAQSAM_SYNC_INTERVAL_SECONDS || '600' }}
          MAQSAM_SYNC_LOOKBACK_SECONDS=${{ secrets.MAQSAM_SYNC_LOOKBACK_SECONDS || '10800' }}
          MAQSAM_SYNC_PAGE_COUNT=${{ secrets.MAQSAM_SYNC_PAGE_COUNT || '12' }}
          EOF
          )

          BODY=$(jq -n \
            --arg project_name 'sdr-project' \
            --arg content "$CONTENT_URL" \
            --arg environment "$ENVIRONMENT" \
            '{project_name:$project_name,content:$content,environment:$environment}')

          DEPLOY_CODE=$(curl -sS --connect-timeout 8 --max-time 45 \
            -X POST -H "Authorization: $AUTH" -H 'Accept: application/json' \
            -H 'Content-Type: application/json' -d "$BODY" \
            -o /tmp/deploy.json -w '%{http_code}' "$VM/docker" || true)
          echo "Hostinger deploy request: HTTP=${DEPLOY_CODE:-000}"
          if [ -z "$DEPLOY_CODE" ] || [ "$DEPLOY_CODE" -lt 200 ] || [ "$DEPLOY_CODE" -ge 300 ]; then
            jq '{message,correlation_id,errors}' /tmp/deploy.json 2>/dev/null || true
            exit 1
          fi

          ACTION_ID=$(jq -r '.id // .action.id // empty' /tmp/deploy.json 2>/dev/null || true)
          echo "Hostinger action=${ACTION_ID:-not-returned}"

          # Most builds should now hit BuildKit npm/Next caches and finish quickly.
          # Keep enough headroom for a true cold build without declaring failure
          # while Hostinger is still legitimately compiling the exact revision.
          READY=false
          for ATTEMPT in $(seq 1 150); do
            HEALTH_CODE=$(curl -sS --connect-timeout 4 --max-time 10 \
              -H 'Cache-Control: no-cache' -o /tmp/health.json -w '%{http_code}' \
              "https://${HOST}/api/health?deploy=${DEPLOY_SHA}&attempt=${ATTEMPT}" || true)
            BUILD_REF=$(jq -r '.buildRef // ""' /tmp/health.json 2>/dev/null || true)
            echo "Gate ${ATTEMPT}/150: HTTP=${HEALTH_CODE:-000} build=${BUILD_REF:-none}"

            if [ "$HEALTH_CODE" = 200 ] && [ "$BUILD_REF" = "$DEPLOY_SHA" ]; then
              ROOT_CODE=$(curl -sS --connect-timeout 4 --max-time 10 \
                -H 'Cache-Control: no-cache' -D /tmp/root.headers -o /tmp/root.html -w '%{http_code}' \
                "https://${HOST}/" || true)
              ADMIN_CODE=$(curl -sS --connect-timeout 4 --max-time 10 \
                -H 'Cache-Control: no-cache' -o /tmp/admin.json -w '%{http_code}' \
                "https://${HOST}/api/sdr-admin" || true)
              ADMIN_CONFIGURED=$(jq -r '.configured // false' /tmp/admin.json 2>/dev/null || echo false)
              if [ "$ROOT_CODE" != 000 ] && [ "$ROOT_CODE" != 401 ] && \
                 ! grep -qi '^WWW-Authenticate:' /tmp/root.headers && \
                 [ "$ADMIN_CODE" = 200 ] && [ "$ADMIN_CONFIGURED" = true ]; then
                READY=true
                break
              fi
            fi

            if [ -n "$ACTION_ID" ] && [ $((ATTEMPT % 6)) -eq 0 ]; then
              ACTION_CODE=$(curl -sS --connect-timeout 5 --max-time 12 \
                -H "Authorization: $AUTH" -H 'Accept: application/json' \
                -o /tmp/action.json -w '%{http_code}' "$VM/actions/$ACTION_ID" || true)
              ACTION_STATE=$(jq -r '.state // "unknown"' /tmp/action.json 2>/dev/null || echo unknown)
              echo "Hostinger action: HTTP=${ACTION_CODE:-000} state=$ACTION_STATE"
              case "$ACTION_STATE" in failed|error) exit 1 ;; esac
            fi
            sleep 5
          done

          [ "$READY" = true ] || { echo "::error::Exact production build did not become healthy."; exit 1; }

      - name: Mark deployment successful
        if: success()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.DEPLOY_SHA,
              state: 'success',
              context: 'hostinger/deploy',
              description: 'Lean Traefik SDR production verified',
              target_url: process.env.DEPLOY_URL,
            });

      - name: Mark deployment failed
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.DEPLOY_SHA,
              state: 'failure',
              context: 'hostinger/deploy',
              description: 'SDR production deployment failed',
              target_url: process.env.DEPLOY_URL,
            });
