name: Deploy SDR Dashboard to Hostinger

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.freshness.outputs.should_deploy }}
      deploy_sha: ${{ steps.freshness.outputs.deploy_sha }}
    steps:
      - name: Reject stale main deployment candidates
        id: freshness
        uses: actions/github-script@v7
        env:
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DEPLOY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          retries: 3
          script: |
            const candidate = String(process.env.CANDIDATE_SHA || '').trim();
            core.setOutput('deploy_sha', candidate);

            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('should_deploy', 'true');
              return;
            }

            const { data: branch } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });
            const currentMain = branch.commit.sha;

            if (candidate !== currentMain) {
              core.setOutput('should_deploy', 'false');
              core.notice(`Skipping stale deployment ${candidate}; current main is ${currentMain}.`);
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: candidate,
                state: 'success',
                context: 'hostinger/deploy',
                description: 'Superseded by newer main commit; production untouched',
                target_url: process.env.DEPLOY_URL,
              });
              return;
            }

            core.setOutput('should_deploy', 'true');

  deploy:
    needs: preflight
    if: needs.preflight.outputs.should_deploy == 'true'
    concurrency:
      group: hostinger-sdr-production
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_SHA: ${{ needs.preflight.outputs.deploy_sha }}
      DEPLOY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Mark deployment pending
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.DEPLOY_SHA,
              state: 'pending',
              context: 'hostinger/deploy',
              description: 'Deploying CPU-light SDR stack without VPS reboot',
              target_url: process.env.DEPLOY_URL,
            });

      - name: Checkout validated revision
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Validate CPU-light compose
        run: docker compose -f docker-compose.light.yml config >/tmp/sdr-light-compose.txt

      - name: Validate Hostinger API key
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
        run: test -n "$HOSTINGER_API_KEY"

      - name: Validate SDR admin password
        env:
          SDR_ADMIN_PASSWORD: ${{ secrets.SDR_ADMIN_PASSWORD || secrets.DASHBOARD_PASSWORD || secrets.ACQUISITION_OWNER_TOKEN }}
        run: |
          test -n "$SDR_ADMIN_PASSWORD" || {
            echo "::error::Configure SDR_ADMIN_PASSWORD, DASHBOARD_PASSWORD, or ACQUISITION_OWNER_TOKEN."
            exit 1
          }
          echo "SDR admin password is configured"

      - name: Report optional integrations
        env:
          PRIMEFORGE_API_KEY: ${{ secrets.PRIMEFORGE_API_KEY || secrets.PRIME_FORGE_API_KEY }}
          SMARTLEAD_API_KEY: ${{ secrets.SMARTLEAD_API_KEY }}
        run: |
          [ -n "$SMARTLEAD_API_KEY" ] && echo "Smartlead configured" || echo "Smartlead not configured"
          [ -n "$PRIMEFORGE_API_KEY" ] && echo "Primeforge advisory configured" || echo "Primeforge not configured"

      - name: Probe Hostinger control plane without rebooting production
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -euo pipefail

          AUTH="$HOSTINGER_API_KEY"
          case "$AUTH" in
            Bearer\ *) ;;
            *) AUTH="Bearer $AUTH" ;;
          esac

          VM_BASE='https://developers.hostinger.com/api/vps/v1/virtual-machines/1604210'
          DOCKER_URL="$VM_BASE/docker"

          VM_CODE=$(curl --silent --show-error \
            --connect-timeout 8 \
            --max-time 30 \
            -H "Authorization: $AUTH" \
            -H 'Accept: application/json' \
            -o /tmp/hostinger-vm.json \
            -w '%{http_code}' \
            "$VM_BASE" || true)
          VM_STATE=$(jq -r '.state // "unknown"' /tmp/hostinger-vm.json 2>/dev/null || echo unknown)
          echo "Hostinger VM preflight: HTTP ${VM_CODE:-000}, state=${VM_STATE}"

          [ "$VM_CODE" = "200" ] && [ "$VM_STATE" = "running" ] || {
            echo "::error::Hostinger VPS is not confirmed running. Refusing automatic mutation or reboot."
            exit 1
          }

          DOCKER_CODE=$(curl --silent --show-error \
            --connect-timeout 8 \
            --max-time 30 \
            -H "Authorization: $AUTH" \
            -H 'Accept: application/json' \
            -o /tmp/hostinger-docker.json \
            -w '%{http_code}' \
            "$DOCKER_URL" || true)
          echo "Hostinger Docker Manager probe: HTTP ${DOCKER_CODE:-000}"

          if [ "$DOCKER_CODE" != "200" ]; then
            echo "::warning::Hostinger Docker inventory API is degraded. The VPS will NOT be rebooted. Deployment will still be attempted and public health will decide success."
            jq '{message,correlation_id}' /tmp/hostinger-docker.json 2>/dev/null || true
          else
            echo "Hostinger Docker inventory API is healthy."
          fi

      - name: Deploy CPU-light SDR stack
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
          virtual-machine: "1604210"
          project-name: sdr-project
          docker-compose-path: docker-compose.light.yml
          environment-variables: |
            SDR_BUILD_REF=${{ env.DEPLOY_SHA }}
            CAREER_GENERATION=v3
            DISABLE_AUTH=true
            SDR_ADMIN_PASSWORD=${{ secrets.SDR_ADMIN_PASSWORD || secrets.DASHBOARD_PASSWORD || secrets.ACQUISITION_OWNER_TOKEN }}
            DASHBOARD_PASSWORD=${{ secrets.DASHBOARD_PASSWORD || secrets.SDR_ADMIN_PASSWORD || secrets.ACQUISITION_OWNER_TOKEN }}
            SMARTLEAD_AUTOPILOT_ENABLED=true
            SMARTLEAD_LEGACY_SEND_ENABLED=false

      - name: Verify exact public build, admin gate, and no browser Basic Auth
        run: |
          set -euo pipefail
          HOST='sdr.dashboardtalentera.tech'
          READY=false

          for ATTEMPT in $(seq 1 60); do
            HEALTH_CODE=$(curl --silent --show-error \
              --connect-timeout 5 \
              --max-time 12 \
              -H 'Cache-Control: no-cache' \
              --output /tmp/light-health.json \
              --write-out '%{http_code}' \
              "https://${HOST}/api/health?deploy=${DEPLOY_SHA}&attempt=${ATTEMPT}" || true)
            BUILD_REF=$(jq -r '.buildRef // ""' /tmp/light-health.json 2>/dev/null || true)
            echo "Production gate ${ATTEMPT}/60: HTTP=${HEALTH_CODE:-000} build=${BUILD_REF:-none}"

            if [ "$HEALTH_CODE" = "200" ] && [ "$BUILD_REF" = "$DEPLOY_SHA" ]; then
              ROOT_CODE=$(curl --silent --show-error \
                --connect-timeout 5 \
                --max-time 15 \
                -H 'Cache-Control: no-cache' \
                -D /tmp/root-headers.txt \
                -o /tmp/root-body.html \
                --write-out '%{http_code}' \
                "https://${HOST}/" || true)
              ADMIN_CODE=$(curl --silent --show-error \
                --connect-timeout 5 \
                --max-time 15 \
                -H 'Cache-Control: no-cache' \
                -o /tmp/admin-status.json \
                --write-out '%{http_code}' \
                "https://${HOST}/api/sdr-admin" || true)
              ADMIN_CONFIGURED=$(jq -r '.configured // false' /tmp/admin-status.json 2>/dev/null || echo false)
              echo "Dashboard root: HTTP=${ROOT_CODE:-000}; admin API: HTTP=${ADMIN_CODE:-000} configured=${ADMIN_CONFIGURED}"

              if [ "$ROOT_CODE" != "000" ] && [ "$ROOT_CODE" != "401" ] && \
                 ! grep -qi '^WWW-Authenticate:' /tmp/root-headers.txt && \
                 [ "$ADMIN_CODE" = "200" ] && [ "$ADMIN_CONFIGURED" = "true" ]; then
                READY=true
                break
              fi
            fi

            if [ "$ATTEMPT" = "1" ] || [ "$ATTEMPT" = "15" ] || [ "$ATTEMPT" = "30" ] || [ "$ATTEMPT" = "45" ] || [ "$ATTEMPT" = "60" ]; then
              printf 'Health preview: '
              head -c 220 /tmp/light-health.json 2>/dev/null | tr '\n' ' ' || true
              echo
              printf 'Admin preview: '
              head -c 220 /tmp/admin-status.json 2>/dev/null | tr '\n' ' ' || true
              echo
            fi
            sleep 10
          done

          if [ "$READY" != "true" ]; then
            echo "::error::Exact CPU-light build did not become publicly reachable with the SDR admin gate configured and browser Basic Auth disabled."
            exit 1
          fi

          echo "Exact production build is healthy, admin gate is configured, and browser Basic Auth is disabled."

      - name: Verify heavy Docker Ollama is not active when inventory is available
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -euo pipefail
          AUTH="$HOSTINGER_API_KEY"
          case "$AUTH" in Bearer\ *) ;; *) AUTH="Bearer $AUTH" ;; esac
          URL='https://developers.hostinger.com/api/vps/v1/virtual-machines/1604210/docker/sdr-project/containers'
          CODE=$(curl --silent --show-error \
            --connect-timeout 8 \
            --max-time 30 \
            -H "Authorization: $AUTH" \
            -H 'Accept: application/json' \
            -o /tmp/sdr-containers.json \
            -w '%{http_code}' \
            "$URL" || true)
          echo "SDR container inventory: HTTP ${CODE:-000}"

          if [ "$CODE" != "200" ]; then
            echo "::warning::Container inventory unavailable; public exact-build verification already passed."
            exit 0
          fi

          jq -r '.[] | "CONTAINER\t\(.name // "")\timage=\(.image // "")\tstate=\(.state // "")\thealth=\(.health // "")"' /tmp/sdr-containers.json
          if jq -e '.[] | select(((.image // "") | ascii_downcase | contains("ollama/ollama")))' /tmp/sdr-containers.json >/dev/null; then
            echo "::error::A heavy ollama/ollama container is active in sdr-project."
            exit 1
          fi
          echo "No heavy Docker Ollama image is active in sdr-project."

      - name: Hostinger failure diagnostics
        if: failure()
        continue-on-error: true
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -u
          AUTH="$HOSTINGER_API_KEY"
          case "$AUTH" in Bearer\ *) ;; *) AUTH="Bearer $AUTH" ;; esac
          BASE='https://developers.hostinger.com/api/vps/v1/virtual-machines/1604210/docker'

          CODE=$(curl --silent --show-error --connect-timeout 8 --max-time 30 \
            -H "Authorization: $AUTH" -H 'Accept: application/json' \
            -o /tmp/failure-projects.json -w '%{http_code}' "$BASE" || true)
          echo "Docker Manager after failure: HTTP ${CODE:-000}"
          if [ "$CODE" != "200" ]; then
            jq '{message,correlation_id}' /tmp/failure-projects.json 2>/dev/null || true
          fi

          HEALTH_CODE=$(curl --silent --show-error --connect-timeout 5 --max-time 12 \
            -H 'Cache-Control: no-cache' -o /tmp/failure-health.json -w '%{http_code}' \
            'https://sdr.dashboardtalentera.tech/api/health?failure_diagnostic=1' || true)
          echo "Public health after failure: HTTP ${HEALTH_CODE:-000}"
          head -c 500 /tmp/failure-health.json 2>/dev/null || true
          echo

          ADMIN_CODE=$(curl --silent --show-error --connect-timeout 5 --max-time 12 \
            -H 'Cache-Control: no-cache' -o /tmp/failure-admin.json -w '%{http_code}' \
            'https://sdr.dashboardtalentera.tech/api/sdr-admin?failure_diagnostic=1' || true)
          echo "Admin status after failure: HTTP ${ADMIN_CODE:-000}"
          head -c 300 /tmp/failure-admin.json 2>/dev/null || true
          echo

      - name: Mark deployment successful
        if: success()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.DEPLOY_SHA,
              state: 'success',
              context: 'hostinger/deploy',
              description: 'CPU-light public SDR production is healthy',
              target_url: process.env.DEPLOY_URL,
            });

      - name: Mark deployment failed
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.DEPLOY_SHA,
              state: 'failure',
              context: 'hostinger/deploy',
              description: 'SDR production deployment or public verification failed',
              target_url: process.env.DEPLOY_URL,
            });

      - name: Mark deployment cancelled
        if: cancelled()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.DEPLOY_SHA,
              state: 'error',
              context: 'hostinger/deploy',
              description: 'SDR production deployment cancelled',
              target_url: process.env.DEPLOY_URL,
            });
