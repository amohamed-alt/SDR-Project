name: Deploy SDR Dashboard to Hostinger

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    concurrency:
      group: hostinger-sdr-production
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      DEPLOY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Mark deployment pending
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.DEPLOY_SHA,
              state: 'pending',
              context: 'hostinger/deploy',
              description: 'Deploying SDR dashboard to Hostinger',
              target_url: process.env.DEPLOY_URL,
            });

      - name: Checkout validated revision
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Validate Hostinger API key
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
        run: |
          test -n "$HOSTINGER_API_KEY" || {
            echo "::error::Add HOSTINGER_API_KEY as a repository secret."
            exit 1
          }

      - name: Validate GTM premium AI configuration
        env:
          GTM_OPENROUTER_KEY: ${{ secrets.GTM_RESEARCH_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
        run: |
          test -n "$GTM_OPENROUTER_KEY" || {
            echo "::error::GTM_RESEARCH_OPENROUTER_API_KEY (or OPENROUTER_API_KEY) must be configured for TAM, ICP and Personas."
            exit 1
          }
          echo "GTM OpenRouter deployment secret: configured"

      - name: Deploy Docker Compose
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
          virtual-machine: "1604210"
          project-name: sdr-project
          docker-compose-path: docker-compose.yml
          environment-variables: |
            SDR_BUILD_REF=${{ env.DEPLOY_SHA }}
            GTM_RESEARCH_OPENROUTER_API_KEY=${{ secrets.GTM_RESEARCH_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
            GTM_RESEARCH_OPENROUTER_MODEL=openai/gpt-4.1-mini

      - name: Verify exact deployed build, Career V2, and GTM workspace health
        run: |
          set -euo pipefail
          READY=false
          for ATTEMPT in $(seq 1 120); do
            BODY=$(curl --silent --show-error \
              --connect-timeout 5 \
              --max-time 15 \
              'https://sdr.dashboardtalentera.tech/api/health?deep=1' || true)

            BUILD_REF=$(printf '%s' "$BODY" | jq -r '.buildRef // ""' 2>/dev/null || true)
            GENERATION=$(printf '%s' "$BODY" | jq -r '.careerGeneration // ""' 2>/dev/null || true)
            ENGINE_VERSION=$(printf '%s' "$BODY" | jq -r '.careerEngineVersion // ""' 2>/dev/null || true)
            IS_READY=$(printf '%s' "$BODY" | jq -r '.ready // false' 2>/dev/null || true)
            VALIDATION_STATE=$(printf '%s' "$BODY" | jq -r '.careerValidationState // "unknown"' 2>/dev/null || true)
            STORED=$(printf '%s' "$BODY" | jq -r '.careerValidationProgress.stored // 0' 2>/dev/null || true)

            echo "Production gate ${ATTEMPT}/120: build=${BUILD_REF:-none} generation=${GENERATION:-none} engine=${ENGINE_VERSION:-none} ready=${IS_READY:-false} validation=${VALIDATION_STATE:-unknown} stored=${STORED:-0}"

            if [ "$BUILD_REF" = "$DEPLOY_SHA" ] \
              && [ "$GENERATION" = "v2" ] \
              && [[ "$ENGINE_VERSION" == 2.* ]] \
              && [ "$IS_READY" = "true" ]; then
              READY=true
              break
            fi
            sleep 10
          done

          if [ "$READY" != "true" ]; then
            echo "::error::Production never exposed the exact commit $DEPLOY_SHA with ready Career Intelligence V2 within the bounded deployment window."
            exit 1
          fi

          GTM_PAGE_CODE=$(curl --silent --show-error \
            --connect-timeout 5 \
            --max-time 15 \
            --output /tmp/gtm-research.html \
            --write-out '%{http_code}' \
            'https://sdr.dashboardtalentera.tech/gtm-research' || true)
          GTM_HEALTH=$(curl --silent --show-error \
            --connect-timeout 5 \
            --max-time 15 \
            'https://sdr.dashboardtalentera.tech/api/gtm-research/analyze' || true)
          GTM_STATUS=$(printf '%s' "$GTM_HEALTH" | jq -r '.status // ""' 2>/dev/null || true)
          GTM_AI_READY=$(printf '%s' "$GTM_HEALTH" | jq -r '.aiReady // false' 2>/dev/null || true)
          GTM_OPENROUTER=$(printf '%s' "$GTM_HEALTH" | jq -r '.openRouterConfigured // false' 2>/dev/null || true)
          GTM_PREMIUM_MODEL=$(printf '%s' "$GTM_HEALTH" | jq -r '.premiumModel // "unknown"' 2>/dev/null || true)

          echo "GTM production gate: page_http=${GTM_PAGE_CODE:-none} api_status=${GTM_STATUS:-none} local_ai_ready=${GTM_AI_READY:-false} openrouter_configured=${GTM_OPENROUTER:-false} premium_model=${GTM_PREMIUM_MODEL:-unknown}"

          if [ "$GTM_PAGE_CODE" != "200" ] \
            || [ "$GTM_STATUS" != "ok" ] \
            || [ "$GTM_AI_READY" != "true" ] \
            || [ "$GTM_OPENROUTER" != "true" ] \
            || [ "$GTM_PREMIUM_MODEL" != "openai/gpt-4.1-mini" ] \
            || ! grep -q 'GTM Strategy Workspace' /tmp/gtm-research.html; then
            echo "::error::GTM Research workspace is not fully production-ready with OpenRouter GPT-4.1 Mini."
            exit 1
          fi

      - name: Mark deployment successful
        if: success()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.DEPLOY_SHA,
              state: 'success',
              context: 'hostinger/deploy',
              description: 'Exact SDR build, Career V2, and GTM OpenRouter validation are live',
              target_url: process.env.DEPLOY_URL,
            });

      - name: Mark deployment failed
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.DEPLOY_SHA,
              state: 'failure',
              context: 'hostinger/deploy',
              description: 'SDR production build/version/GTM gate failed',
              target_url: process.env.DEPLOY_URL,
            });
