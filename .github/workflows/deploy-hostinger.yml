name: Deploy SDR Dashboard to Hostinger

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.freshness.outputs.should_deploy }}
      deploy_sha: ${{ steps.freshness.outputs.deploy_sha }}
    steps:
      - name: Reject stale main deployment candidates
        id: freshness
        uses: actions/github-script@v7
        env:
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DEPLOY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          retries: 3
          script: |
            const candidate = String(process.env.CANDIDATE_SHA || '').trim();
            core.setOutput('deploy_sha', candidate);

            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('should_deploy', 'true');
              return;
            }

            const { data: branch } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });
            const currentMain = branch.commit.sha;

            if (candidate !== currentMain) {
              core.setOutput('should_deploy', 'false');
              core.notice(`Skipping stale deployment ${candidate}; current main is ${currentMain}.`);
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: candidate,
                state: 'success',
                context: 'hostinger/deploy',
                description: 'Superseded by a newer main commit; production untouched',
                target_url: process.env.DEPLOY_URL,
              });
              return;
            }

            core.setOutput('should_deploy', 'true');

  deploy:
    needs: preflight
    if: needs.preflight.outputs.should_deploy == 'true'
    concurrency:
      group: hostinger-sdr-production
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEPLOY_SHA: ${{ needs.preflight.outputs.deploy_sha }}
      DEPLOY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Mark deployment pending
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.DEPLOY_SHA,
              state: 'pending',
              context: 'hostinger/deploy',
              description: 'Recovering Hostinger and deploying CPU-light SDR stack',
              target_url: process.env.DEPLOY_URL,
            });

      - name: Checkout validated revision
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Validate light compose
        run: docker compose -f docker-compose.light.yml config >/tmp/sdr-light-compose.txt

      - name: Validate Hostinger API key
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
        run: test -n "$HOSTINGER_API_KEY"

      - name: Validate dashboard authentication
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD || secrets.ACQUISITION_OWNER_TOKEN }}
          ACQUISITION_OWNER_TOKEN: ${{ secrets.ACQUISITION_OWNER_TOKEN }}
        run: |
          test -n "$DASHBOARD_PASSWORD" || {
            echo "::error::Configure DASHBOARD_PASSWORD or ACQUISITION_OWNER_TOKEN."
            exit 1
          }
          echo "Dashboard authentication configured"

      - name: Report optional production integrations
        env:
          PRIMEFORGE_API_KEY: ${{ secrets.PRIMEFORGE_API_KEY || secrets.PRIME_FORGE_API_KEY }}
          SMARTLEAD_API_KEY: ${{ secrets.SMARTLEAD_API_KEY }}
        run: |
          [ -n "$SMARTLEAD_API_KEY" ] && echo "Smartlead configured" || true
          [ -n "$PRIMEFORGE_API_KEY" ] && echo "Primeforge advisory configured" || true

      - name: Recover Hostinger Docker control plane if unhealthy
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -euo pipefail

          AUTH="$HOSTINGER_API_KEY"
          case "$AUTH" in
            Bearer\ *) ;;
            *) AUTH="Bearer $AUTH" ;;
          esac

          VM_BASE='https://developers.hostinger.com/api/vps/v1/virtual-machines/1604210'
          DOCKER_URL="$VM_BASE/docker"

          docker_manager_code() {
            curl --silent --show-error \
              --connect-timeout 8 \
              --max-time 30 \
              -H "Authorization: $AUTH" \
              -H 'Accept: application/json' \
              -o /tmp/hostinger-docker.json \
              -w '%{http_code}' \
              "$DOCKER_URL" || true
          }

          VM_CODE=$(curl --silent --show-error \
            --connect-timeout 8 \
            --max-time 30 \
            -H "Authorization: $AUTH" \
            -H 'Accept: application/json' \
            -o /tmp/hostinger-vm.json \
            -w '%{http_code}' \
            "$VM_BASE" || true)
          VM_STATE=$(jq -r '.state // "unknown"' /tmp/hostinger-vm.json 2>/dev/null || echo unknown)
          echo "Hostinger VM preflight: HTTP ${VM_CODE:-000}, state=${VM_STATE}"
          [ "$VM_CODE" = "200" ] || {
            echo "::error::Unable to read Hostinger VPS state."
            exit 1
          }

          DOCKER_CODE=$(docker_manager_code)
          echo "Hostinger Docker Manager preflight: HTTP ${DOCKER_CODE:-000}"

          if [ "$DOCKER_CODE" = "200" ]; then
            echo "Hostinger Docker control plane is healthy; no VPS reboot needed."
            exit 0
          fi

          echo "::warning::Hostinger Docker Manager is unhealthy (HTTP ${DOCKER_CODE:-000}). Restarting the VPS once to clear the stuck Docker action queue."
          jq '{message,correlation_id}' /tmp/hostinger-docker.json 2>/dev/null || true

          RESTART_CODE=$(curl --silent --show-error \
            --connect-timeout 8 \
            --max-time 45 \
            -X POST \
            -H "Authorization: $AUTH" \
            -H 'Accept: application/json' \
            -o /tmp/hostinger-vm-restart.json \
            -w '%{http_code}' \
            "$VM_BASE/restart" || true)
          echo "Hostinger VPS restart request: HTTP ${RESTART_CODE:-000}"
          [ "$RESTART_CODE" = "200" ] || {
            jq '{message,correlation_id}' /tmp/hostinger-vm-restart.json 2>/dev/null || true
            echo "::error::Hostinger VPS restart request failed."
            exit 1
          }

          ACTION_ID=$(jq -r '.id // empty' /tmp/hostinger-vm-restart.json 2>/dev/null || true)
          [ -n "$ACTION_ID" ] || {
            echo "::error::Hostinger VPS restart did not return an action id."
            exit 1
          }
          echo "Hostinger restart action id: $ACTION_ID"

          RESTART_DONE=false
          for ATTEMPT in $(seq 1 36); do
            ACTION_CODE=$(curl --silent --show-error \
              --connect-timeout 8 \
              --max-time 30 \
              -H "Authorization: $AUTH" \
              -H 'Accept: application/json' \
              -o /tmp/hostinger-action.json \
              -w '%{http_code}' \
              "$VM_BASE/actions/$ACTION_ID" || true)
            ACTION_STATE=$(jq -r '.state // "unknown"' /tmp/hostinger-action.json 2>/dev/null || echo unknown)
            echo "VPS restart action ${ATTEMPT}/36: HTTP ${ACTION_CODE:-000}, state=${ACTION_STATE}"

            if [ "$ACTION_CODE" = "200" ] && [ "$ACTION_STATE" = "success" ]; then
              RESTART_DONE=true
              break
            fi

            case "$ACTION_STATE" in
              failed|failure|error|cancelled|canceled)
                echo "::error::Hostinger VPS restart reached terminal state: $ACTION_STATE"
                exit 1
                ;;
            esac
            sleep 10
          done

          [ "$RESTART_DONE" = "true" ] || {
            echo "::error::Hostinger VPS restart did not complete within 6 minutes."
            exit 1
          }

          CONTROL_PLANE_READY=false
          for ATTEMPT in $(seq 1 36); do
            VM_CODE=$(curl --silent --show-error \
              --connect-timeout 8 \
              --max-time 30 \
              -H "Authorization: $AUTH" \
              -H 'Accept: application/json' \
              -o /tmp/hostinger-vm.json \
              -w '%{http_code}' \
              "$VM_BASE" || true)
            VM_STATE=$(jq -r '.state // "unknown"' /tmp/hostinger-vm.json 2>/dev/null || echo unknown)
            DOCKER_CODE=$(docker_manager_code)
            echo "Control-plane recovery ${ATTEMPT}/36: vm_http=${VM_CODE:-000}, vm_state=${VM_STATE}, docker_http=${DOCKER_CODE:-000}"

            if [ "$VM_CODE" = "200" ] && [ "$VM_STATE" = "running" ] && [ "$DOCKER_CODE" = "200" ]; then
              CONTROL_PLANE_READY=true
              break
            fi
            sleep 10
          done

          [ "$CONTROL_PLANE_READY" = "true" ] || {
            echo "::error::Hostinger Docker Manager did not recover after the VPS restart."
            exit 1
          }

          echo "Hostinger Docker control plane recovered."

      - name: Deploy CPU-light SDR stack
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
          virtual-machine: "1604210"
          project-name: sdr-project
          docker-compose-path: docker-compose.light.yml
          environment-variables: |
            SDR_BUILD_REF=${{ env.DEPLOY_SHA }}
            CAREER_GENERATION=v3
            SMARTLEAD_AUTOPILOT_ENABLED=true
            SMARTLEAD_LEGACY_SEND_ENABLED=false

      - name: Verify exact light production build
        env:
          DASHBOARD_USERNAME: ${{ secrets.DASHBOARD_USERNAME || 'talentera' }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD || secrets.ACQUISITION_OWNER_TOKEN }}
        run: |
          set -euo pipefail
          HOST='sdr.dashboardtalentera.tech'
          READY=false
          for ATTEMPT in $(seq 1 48); do
            HTTP_CODE=$(curl --silent --show-error \
              --connect-timeout 5 \
              --max-time 12 \
              -H 'Cache-Control: no-cache' \
              --output /tmp/light-health.json \
              --write-out '%{http_code}' \
              "https://${HOST}/api/health?deploy=${DEPLOY_SHA}&light_attempt=${ATTEMPT}" || true)
            BUILD_REF=$(jq -r '.buildRef // ""' /tmp/light-health.json 2>/dev/null || true)
            echo "Light production gate ${ATTEMPT}/48: http=${HTTP_CODE:-000} build=${BUILD_REF:-none}"
            if [ "$HTTP_CODE" = "200" ] && [ "$BUILD_REF" = "$DEPLOY_SHA" ]; then
              READY=true
              break
            fi
            if [ "$ATTEMPT" = "1" ] || [ "$ATTEMPT" = "12" ] || [ "$ATTEMPT" = "24" ] || [ "$ATTEMPT" = "36" ] || [ "$ATTEMPT" = "48" ]; then
              printf 'Response preview: '
              head -c 180 /tmp/light-health.json 2>/dev/null | tr '\n' ' ' || true
              echo
            fi
            sleep 10
          done

          if [ "$READY" != "true" ]; then
            echo "::error::Production never exposed the exact CPU-light build $DEPLOY_SHA."
            exit 1
          fi

          ACCESS_CODE=$(curl --silent --show-error \
            --user "${DASHBOARD_USERNAME}:${DASHBOARD_PASSWORD}" \
            --connect-timeout 5 \
            --max-time 15 \
            --output /tmp/dashboard-access.json \
            --write-out '%{http_code}' \
            "https://${HOST}/api/usage?deploy=${DEPLOY_SHA}" || true)
          echo "Authenticated dashboard gate: HTTP ${ACCESS_CODE:-none}"
          [ "$ACCESS_CODE" = "200" ]

      - name: Verify heavy Ollama image is not active
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -euo pipefail
          AUTH="$HOSTINGER_API_KEY"
          case "$AUTH" in Bearer\ *) ;; *) AUTH="Bearer $AUTH" ;; esac
          URL='https://developers.hostinger.com/api/vps/v1/virtual-machines/1604210/docker/sdr-project/containers'
          CODE=$(curl --silent --show-error \
            --connect-timeout 8 \
            --max-time 30 \
            -H "Authorization: $AUTH" \
            -H 'Accept: application/json' \
            -o /tmp/sdr-containers.json \
            -w '%{http_code}' \
            "$URL" || true)
          echo "SDR container verification: HTTP ${CODE:-000}"
          if [ "$CODE" != "200" ]; then
            echo "::warning::Hostinger container inventory is temporarily unavailable; public health gate already passed."
            exit 0
          fi

          jq -r '.[] | "CONTAINER\t\(.name // "")\timage=\(.image // "")\tstate=\(.state // "")\thealth=\(.health // "")"' /tmp/sdr-containers.json
          if jq -e '.[] | select(((.image // "") | ascii_downcase | contains("ollama/ollama")))' /tmp/sdr-containers.json >/dev/null; then
            echo "::error::A heavy ollama/ollama container is still active after the light deployment."
            exit 1
          fi
          echo "Heavy local Ollama image is not active in sdr-project."

      - name: Hostinger failure diagnostics
        if: failure()
        continue-on-error: true
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -u
          AUTH="$HOSTINGER_API_KEY"
          case "$AUTH" in Bearer\ *) ;; *) AUTH="Bearer $AUTH" ;; esac
          BASE='https://developers.hostinger.com/api/vps/v1/virtual-machines/1604210/docker'

          CODE=$(curl --silent --show-error --connect-timeout 8 --max-time 30 \
            -H "Authorization: $AUTH" -H 'Accept: application/json' \
            -o /tmp/failure-projects.json -w '%{http_code}' "$BASE" || true)
          echo "Docker Manager after failure: HTTP ${CODE:-000}"
          if [ "$CODE" = "200" ]; then
            jq -r '.[] | "PROJECT\t\(.name // "")\tstatus=\(.status // "")\tstate=\(.state // "")"' /tmp/failure-projects.json 2>/dev/null || true
          else
            jq '{message,correlation_id}' /tmp/failure-projects.json 2>/dev/null || true
          fi

          PROJECT_CODE=$(curl --silent --show-error --connect-timeout 8 --max-time 30 \
            -H "Authorization: $AUTH" -H 'Accept: application/json' \
            -o /tmp/failure-containers.json -w '%{http_code}' "$BASE/sdr-project/containers" || true)
          echo "sdr-project containers after failure: HTTP ${PROJECT_CODE:-000}"
          if [ "$PROJECT_CODE" = "200" ]; then
            jq -r '.[] | "CONTAINER\t\(.name // "")\timage=\(.image // "")\tstate=\(.state // "")\thealth=\(.health // "")"' /tmp/failure-containers.json 2>/dev/null || true
          fi

          LOG_CODE=$(curl --silent --show-error --connect-timeout 8 --max-time 30 \
            -H "Authorization: $AUTH" -H 'Accept: application/json' \
            -o /tmp/failure-logs.json -w '%{http_code}' "$BASE/sdr-project/logs" || true)
          echo "sdr-project logs endpoint after failure: HTTP ${LOG_CODE:-000}"
          if [ "$LOG_CODE" = "200" ]; then
            jq -r '.[] | .service as $service | (.entries // [])[-20:][]? | "LOG\t\($service)\t\(.timestamp // "")\t\(.line // "")"' /tmp/failure-logs.json 2>/dev/null | tail -n 120 || true
          fi

      - name: Mark deployment successful
        if: success()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.DEPLOY_SHA,
              state: 'success',
              context: 'hostinger/deploy',
              description: 'CPU-light SDR production is healthy',
              target_url: process.env.DEPLOY_URL,
            });

      - name: Mark deployment failed
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.DEPLOY_SHA,
              state: 'failure',
              context: 'hostinger/deploy',
              description: 'CPU-light SDR production deployment failed',
              target_url: process.env.DEPLOY_URL,
            });

      - name: Mark deployment cancelled
        if: cancelled()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.DEPLOY_SHA,
              state: 'error',
              context: 'hostinger/deploy',
              description: 'CPU-light SDR production deployment cancelled',
              target_url: process.env.DEPLOY_URL,
            });
