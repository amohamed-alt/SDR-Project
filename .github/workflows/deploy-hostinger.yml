name: Deploy SDR Dashboard to Hostinger

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.freshness.outputs.should_deploy }}
      deploy_sha: ${{ steps.freshness.outputs.deploy_sha }}
    steps:
      - name: Reject stale main deployment candidates
        id: freshness
        uses: actions/github-script@v7
        env:
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DEPLOY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          retries: 3
          script: |
            const candidate = String(process.env.CANDIDATE_SHA || '').trim();
            core.setOutput('deploy_sha', candidate);

            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('should_deploy', 'true');
              return;
            }

            const { data: branch } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });
            const currentMain = branch.commit.sha;

            if (candidate !== currentMain) {
              core.setOutput('should_deploy', 'false');
              core.notice(`Skipping stale deployment ${candidate}; current main is ${currentMain}.`);
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: candidate,
                state: 'success',
                context: 'hostinger/deploy',
                description: 'Superseded by newer main commit; production untouched',
                target_url: process.env.DEPLOY_URL,
              });
              return;
            }

            core.setOutput('should_deploy', 'true');

  deploy:
    needs: preflight
    if: needs.preflight.outputs.should_deploy == 'true'
    concurrency:
      group: hostinger-sdr-production
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEPLOY_SHA: ${{ needs.preflight.outputs.deploy_sha }}
      DEPLOY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Mark deployment pending
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.DEPLOY_SHA,
              state: 'pending',
              context: 'hostinger/deploy',
              description: 'Deploying CPU-light SDR stack without VPS reboot',
              target_url: process.env.DEPLOY_URL,
            });

      - name: Checkout validated revision
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Validate CPU-light compose
        run: docker compose -f docker-compose.light.yml config >/tmp/sdr-light-compose.txt

      - name: Validate production secrets
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
          SDR_ADMIN_PASSWORD: ${{ secrets.SDR_ADMIN_PASSWORD || secrets.DASHBOARD_PASSWORD || secrets.ACQUISITION_OWNER_TOKEN }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD || secrets.SDR_ADMIN_PASSWORD || secrets.ACQUISITION_OWNER_TOKEN }}
        run: |
          test -n "$HOSTINGER_API_KEY" || { echo "::error::Hostinger API token is missing."; exit 1; }
          test -n "$SDR_ADMIN_PASSWORD" || { echo "::error::SDR admin password is missing."; exit 1; }
          test -n "$DASHBOARD_PASSWORD" || { echo "::error::Dashboard password is missing."; exit 1; }
          echo "Required deployment secrets are configured."

      - name: Probe Hostinger VM and control plane
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -euo pipefail
          AUTH="$HOSTINGER_API_KEY"
          case "$AUTH" in Bearer\ *) ;; *) AUTH="Bearer $AUTH" ;; esac
          VM='https://developers.hostinger.com/api/vps/v1/virtual-machines/1604210'

          VCODE=$(curl --silent --show-error --connect-timeout 8 --max-time 30 \
            -H "Authorization: $AUTH" -H 'Accept: application/json' \
            -o /tmp/hostinger-vm.json -w '%{http_code}' "$VM" || true)
          VSTATE=$(jq -r '.state // "unknown"' /tmp/hostinger-vm.json 2>/dev/null || echo unknown)
          echo "Hostinger VM: HTTP ${VCODE:-000}, state=${VSTATE}"
          [ "$VCODE" = "200" ] && [ "$VSTATE" = "running" ] || {
            echo "::error::Hostinger VPS is not confirmed running; refusing deployment mutation."
            exit 1
          }

          DCODE=$(curl --silent --show-error --connect-timeout 8 --max-time 30 \
            -H "Authorization: $AUTH" -H 'Accept: application/json' \
            -o /tmp/hostinger-docker.json -w '%{http_code}' "$VM/docker" || true)
          echo "Docker Manager inventory: HTTP ${DCODE:-000}"
          if [ "$DCODE" != "200" ]; then
            jq '{message,correlation_id}' /tmp/hostinger-docker.json 2>/dev/null || true
            echo "::warning::Docker inventory is degraded. No reboot or delete will be attempted; the deploy action and exact public build gate remain authoritative."
          fi

      - name: Start Hostinger deployment and wait for action
        id: hostinger_deploy
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
          SDR_ADMIN_PASSWORD: ${{ secrets.SDR_ADMIN_PASSWORD || secrets.DASHBOARD_PASSWORD || secrets.ACQUISITION_OWNER_TOKEN }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD || secrets.SDR_ADMIN_PASSWORD || secrets.ACQUISITION_OWNER_TOKEN }}
        run: |
          set -euo pipefail
          AUTH="$HOSTINGER_API_KEY"
          case "$AUTH" in Bearer\ *) ;; *) AUTH="Bearer $AUTH" ;; esac
          VM='https://developers.hostinger.com/api/vps/v1/virtual-machines/1604210'
          CONTENT_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${DEPLOY_SHA}/docker-compose.light.yml"

          ENVIRONMENT=$(cat <<EOF
          SDR_BUILD_REF=${DEPLOY_SHA}
          DISABLE_AUTH=true
          DASHBOARD_ACCESS_MODE=public
          SDR_ADMIN_PASSWORD=${SDR_ADMIN_PASSWORD}
          DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD}
          SMARTLEAD_AUTOPILOT_ENABLED=true
          SMARTLEAD_LEGACY_SEND_ENABLED=false
          EOF
          )

          BODY=$(jq -n \
            --arg project_name 'sdr-project' \
            --arg content "$CONTENT_URL" \
            --arg environment "$ENVIRONMENT" \
            '{project_name:$project_name,content:$content,environment:$environment}')

          CODE=$(curl --silent --show-error --connect-timeout 10 --max-time 60 \
            -X POST \
            -H "Authorization: $AUTH" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -d "$BODY" \
            -o /tmp/deploy-action.json \
            -w '%{http_code}' \
            "$VM/docker" || true)
          echo "Hostinger deploy request: HTTP ${CODE:-000}"

          if [ -z "$CODE" ] || [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            jq '{message,correlation_id,errors}' /tmp/deploy-action.json 2>/dev/null || cat /tmp/deploy-action.json || true
            echo "::error::Hostinger rejected the Docker deployment request."
            exit 1
          fi

          ACTION_ID=$(jq -r '.id // .action.id // empty' /tmp/deploy-action.json 2>/dev/null || true)
          INITIAL_STATE=$(jq -r '.state // .action.state // "unknown"' /tmp/deploy-action.json 2>/dev/null || echo unknown)
          echo "Deploy action id=${ACTION_ID:-none}, initial_state=${INITIAL_STATE}"
          echo "action_id=$ACTION_ID" >> "$GITHUB_OUTPUT"

          case "$INITIAL_STATE" in
            failed|error)
              jq . /tmp/deploy-action.json 2>/dev/null || cat /tmp/deploy-action.json
              echo "::error::Hostinger deployment action failed immediately."
              exit 1
              ;;
          esac

          if [ -z "$ACTION_ID" ]; then
            echo "::warning::Hostinger accepted the deploy but returned no action id. Public exact-build verification will decide success."
            exit 0
          fi

          ACTION_DONE=false
          for I in $(seq 1 60); do
            ACODE=$(curl --silent --show-error --connect-timeout 8 --max-time 25 \
              -H "Authorization: $AUTH" -H 'Accept: application/json' \
              -o /tmp/action.json -w '%{http_code}' "$VM/actions/$ACTION_ID" || true)
            STATE=$(jq -r '.state // "unknown"' /tmp/action.json 2>/dev/null || echo unknown)
            echo "Deploy action ${I}/60: HTTP=${ACODE:-000}, state=${STATE}"

            case "$STATE" in
              success|completed)
                ACTION_DONE=true
                break
                ;;
              failed|error)
                jq . /tmp/action.json 2>/dev/null || cat /tmp/action.json || true
                echo "::error::Hostinger deployment action entered ${STATE}."
                exit 1
                ;;
            esac
            sleep 10
          done

          if [ "$ACTION_DONE" != "true" ]; then
            echo "::warning::Hostinger action did not reach a terminal success state in 10 minutes. Continuing only to the exact public build gate; no destructive recovery will run."
          fi

      - name: Verify exact public build, admin gate, and no browser Basic Auth
        run: |
          set -euo pipefail
          HOST='sdr.dashboardtalentera.tech'
          READY=false

          for ATTEMPT in $(seq 1 42); do
            HEALTH_CODE=$(curl --silent --show-error \
              --connect-timeout 5 --max-time 12 \
              -H 'Cache-Control: no-cache' \
              -o /tmp/light-health.json -w '%{http_code}' \
              "https://${HOST}/api/health?deploy=${DEPLOY_SHA}&attempt=${ATTEMPT}" || true)
            BUILD_REF=$(jq -r '.buildRef // ""' /tmp/light-health.json 2>/dev/null || true)
            echo "Production gate ${ATTEMPT}/42: HTTP=${HEALTH_CODE:-000} build=${BUILD_REF:-none}"

            if [ "$HEALTH_CODE" = "200" ] && [ "$BUILD_REF" = "$DEPLOY_SHA" ]; then
              ROOT_CODE=$(curl --silent --show-error \
                --connect-timeout 5 --max-time 15 \
                -H 'Cache-Control: no-cache' \
                -D /tmp/root-headers.txt -o /tmp/root-body.html -w '%{http_code}' \
                "https://${HOST}/" || true)
              ADMIN_CODE=$(curl --silent --show-error \
                --connect-timeout 5 --max-time 15 \
                -H 'Cache-Control: no-cache' \
                -o /tmp/admin-status.json -w '%{http_code}' \
                "https://${HOST}/api/sdr-admin" || true)
              ADMIN_CONFIGURED=$(jq -r '.configured // false' /tmp/admin-status.json 2>/dev/null || echo false)
              echo "Dashboard root: HTTP=${ROOT_CODE:-000}; admin API: HTTP=${ADMIN_CODE:-000} configured=${ADMIN_CONFIGURED}"

              if [ "$ROOT_CODE" != "000" ] && [ "$ROOT_CODE" != "401" ] && \
                 ! grep -qi '^WWW-Authenticate:' /tmp/root-headers.txt && \
                 [ "$ADMIN_CODE" = "200" ] && [ "$ADMIN_CONFIGURED" = "true" ]; then
                READY=true
                break
              fi
            fi

            if [ "$ATTEMPT" = "1" ] || [ "$ATTEMPT" = "14" ] || [ "$ATTEMPT" = "28" ] || [ "$ATTEMPT" = "42" ]; then
              printf 'Health preview: '
              head -c 300 /tmp/light-health.json 2>/dev/null | tr '\n' ' ' || true
              echo
            fi
            sleep 10
          done

          if [ "$READY" != "true" ]; then
            echo "::error::Exact CPU-light build did not become publicly reachable with the SDR admin gate configured and browser Basic Auth disabled."
            exit 1
          fi

          echo "Exact production build is healthy, admin gate is configured, and browser Basic Auth is disabled."

      - name: Verify no heavy Ollama container when inventory is available
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -euo pipefail
          AUTH="$HOSTINGER_API_KEY"
          case "$AUTH" in Bearer\ *) ;; *) AUTH="Bearer $AUTH" ;; esac
          URL='https://developers.hostinger.com/api/vps/v1/virtual-machines/1604210/docker/sdr-project/containers'
          CODE=$(curl --silent --show-error --connect-timeout 8 --max-time 30 \
            -H "Authorization: $AUTH" -H 'Accept: application/json' \
            -o /tmp/sdr-containers.json -w '%{http_code}' "$URL" || true)
          echo "SDR container inventory: HTTP ${CODE:-000}"

          if [ "$CODE" != "200" ]; then
            echo "::warning::Container inventory unavailable; exact public build verification already passed."
            exit 0
          fi

          jq -r '.[] | "CONTAINER\t\(.name // "")\timage=\(.image // "")\tstate=\(.state // "")\thealth=\(.health // "")\tcpu=\(.stats.cpu_percentage // 0)%"' /tmp/sdr-containers.json
          if jq -e '.[] | select(((.image // "") | ascii_downcase | contains("ollama/ollama")))' /tmp/sdr-containers.json >/dev/null; then
            echo "::error::A heavy ollama/ollama container is active in sdr-project."
            exit 1
          fi
          echo "No heavy Docker Ollama image is active in sdr-project."

      - name: Hostinger failure diagnostics
        if: failure()
        continue-on-error: true
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -u
          AUTH="$HOSTINGER_API_KEY"
          case "$AUTH" in Bearer\ *) ;; *) AUTH="Bearer $AUTH" ;; esac
          VM='https://developers.hostinger.com/api/vps/v1/virtual-machines/1604210'

          echo '=== RECENT HOSTINGER ACTIONS ==='
          ACODE=$(curl --silent --show-error --connect-timeout 8 --max-time 30 \
            -H "Authorization: $AUTH" -H 'Accept: application/json' \
            -o /tmp/failure-actions.json -w '%{http_code}' "$VM/actions?page=1" || true)
          echo "Actions after failure: HTTP ${ACODE:-000}"
          [ "$ACODE" = "200" ] && jq -r '.data[]? | [.id,.name,.state,.created_at,.updated_at] | @tsv' /tmp/failure-actions.json | head -20 || cat /tmp/failure-actions.json 2>/dev/null || true

          echo '=== DOCKER MANAGER ==='
          CODE=$(curl --silent --show-error --connect-timeout 8 --max-time 30 \
            -H "Authorization: $AUTH" -H 'Accept: application/json' \
            -o /tmp/failure-projects.json -w '%{http_code}' "$VM/docker" || true)
          echo "Docker Manager after failure: HTTP ${CODE:-000}"
          [ "$CODE" = "200" ] || jq '{message,correlation_id}' /tmp/failure-projects.json 2>/dev/null || true

          PCODE=$(curl --silent --show-error --connect-timeout 8 --max-time 30 \
            -H "Authorization: $AUTH" -H 'Accept: application/json' \
            -o /tmp/failure-project.json -w '%{http_code}' "$VM/docker/sdr-project" || true)
          echo "sdr-project details after failure: HTTP ${PCODE:-000}"
          [ "$PCODE" = "200" ] && jq '{name,state,status,file_path}' /tmp/failure-project.json 2>/dev/null || true

          HEALTH_CODE=$(curl --silent --show-error --connect-timeout 5 --max-time 12 \
            -H 'Cache-Control: no-cache' -o /tmp/failure-health.json -w '%{http_code}' \
            'https://sdr.dashboardtalentera.tech/api/health?failure_diagnostic=1' || true)
          echo "Public health after failure: HTTP ${HEALTH_CODE:-000}"
          head -c 500 /tmp/failure-health.json 2>/dev/null || true
          echo

      - name: Mark deployment successful
        if: success()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.DEPLOY_SHA,
              state: 'success',
              context: 'hostinger/deploy',
              description: 'CPU-light public SDR production is healthy',
              target_url: process.env.DEPLOY_URL,
            });

      - name: Mark deployment failed
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.DEPLOY_SHA,
              state: 'failure',
              context: 'hostinger/deploy',
              description: 'SDR production deployment or public verification failed',
              target_url: process.env.DEPLOY_URL,
            });

      - name: Mark deployment cancelled
        if: cancelled()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.DEPLOY_SHA,
              state: 'error',
              context: 'hostinger/deploy',
              description: 'SDR production deployment cancelled',
              target_url: process.env.DEPLOY_URL,
            });
