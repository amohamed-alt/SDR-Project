name: Deploy SDR Dashboard to Hostinger

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    concurrency:
      group: hostinger-sdr-production
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Ensure this is the current main revision
        id: freshness
        uses: actions/github-script@v7
        env:
          CANDIDATE_SHA: ${{ env.DEPLOY_SHA }}
        with:
          retries: 3
          script: |
            const candidate = String(process.env.CANDIDATE_SHA || '').trim();
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('deploy', 'true');
              return;
            }
            const { data: branch } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });
            core.setOutput('deploy', candidate === branch.commit.sha ? 'true' : 'false');
            if (candidate !== branch.commit.sha) {
              core.notice(`Skipping stale deployment ${candidate}; main is ${branch.commit.sha}.`);
            }

      - name: Checkout production revision
        if: steps.freshness.outputs.deploy == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Validate light compose
        if: steps.freshness.outputs.deploy == 'true'
        run: docker compose -f docker-compose.light.yml config >/tmp/sdr-light-compose.txt

      - name: Validate Hostinger API key
        if: steps.freshness.outputs.deploy == 'true'
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
        run: test -n "$HOSTINGER_API_KEY"

      - name: Deploy CPU-light SDR stack
        if: steps.freshness.outputs.deploy == 'true'
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
          virtual-machine: "1604210"
          project-name: sdr-project
          docker-compose-path: docker-compose.light.yml
          environment: |
            SDR_BUILD_REF=${{ env.DEPLOY_SHA }}
            CAREER_GENERATION=v3

      - name: Verify dashboard recovery
        if: steps.freshness.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          URL='https://sdr.dashboardtalentera.tech/api/health'
          for ATTEMPT in $(seq 1 24); do
            CODE=$(curl --silent --show-error --connect-timeout 5 --max-time 12 \
              -H 'Cache-Control: no-cache' \
              -o /tmp/health.json -w '%{http_code}' \
              "$URL?light_recovery=${ATTEMPT}&deploy=${DEPLOY_SHA}" || true)
            BUILD=$(jq -r '.buildRef // ""' /tmp/health.json 2>/dev/null || true)
            echo "Light recovery ${ATTEMPT}/24: HTTP ${CODE}, build=${BUILD:-none}"
            if [ "$CODE" = "200" ]; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 10
          done
          echo "::error::Dashboard did not recover after the CPU-light deployment window."
          exit 1
