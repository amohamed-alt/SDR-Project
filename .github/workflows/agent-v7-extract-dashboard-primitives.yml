name: Agent V7 Extract Dashboard Primitives

on:
  push:
    branches: [upgrade/gtm-command-center-v7]
    paths:
      - '.github/workflows/agent-v7-extract-dashboard-primitives.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: upgrade/gtm-command-center-v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Extract primitives
        run: node scripts/agent-v7-extract-dashboard-primitives.mjs
      - name: Commit extraction
        run: |
          set -euo pipefail
          git config user.name "GTM Upgrade Bot"
          git config user.email "gtm-upgrade@users.noreply.github.com"
          git add src/components/Dashboard.tsx
          git diff --cached --quiet && { echo "No extraction changes produced"; exit 1; }
          git commit -m "refactor(dashboard): consume shared primitives"
          git push origin HEAD:upgrade/gtm-command-center-v7
