name: Cleanup Marita Extensive Lighter No-Phone Tasks

on:
  workflow_run:
    workflows: ["Deploy SDR Dashboard to Hostinger"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate internal worker credential
        env:
          WORKER_KEY: ${{ secrets.SIGNALHIRE_API_KEY }}
        run: |
          test -n "$WORKER_KEY" || {
            echo "::error::SIGNALHIRE_API_KEY is required for the protected cleanup endpoint."
            exit 1
          }

      - name: Archive Marita Extensive Lighter call tasks with no phone
        env:
          WORKER_KEY: ${{ secrets.SIGNALHIRE_API_KEY }}
        run: |
          set -euo pipefail

          HTTP_CODE=$(curl --silent --show-error \
            --connect-timeout 10 \
            --max-time 1500 \
            --output /tmp/marita-extensive-lighter-cleanup.json \
            --write-out '%{http_code}' \
            -X POST 'https://sdr.dashboardtalentera.tech/api/hubspot/cleanup-marita-extensive-lighter' \
            -H 'Content-Type: application/json' \
            -H "x-acquisition-worker-key: $WORKER_KEY" \
            -d '{"execute":true}' || true)

          echo "Marita Extensive Lighter cleanup HTTP: ${HTTP_CODE:-none}"
          jq '{status, ownerId, source, scannedMaritaOpenCalls, sourceScopedTasks, eligibleTasks, archivedTasks, skipped, marker, error}' /tmp/marita-extensive-lighter-cleanup.json \
            || cat /tmp/marita-extensive-lighter-cleanup.json

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Marita Extensive Lighter cleanup failed."
            exit 1
          fi

          STATUS=$(jq -r '.status // "unknown"' /tmp/marita-extensive-lighter-cleanup.json 2>/dev/null || echo unknown)
          if [ "$STATUS" != "completed" ] && [ "$STATUS" != "already_completed" ]; then
            echo "::error::Unexpected cleanup status: $STATUS"
            exit 1
          fi
