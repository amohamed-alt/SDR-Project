name: Marita Phone-First Priority

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:
    inputs:
      target_phones:
        description: New Marita phone-ready CALL tasks to create
        required: false
        default: '20'
      max_enrichments:
        description: Maximum SignalHire person enrichments
        required: false
        default: '30'

permissions:
  contents: read

concurrency:
  group: marita-phone-first-daily
  cancel-in-progress: false

jobs:
  enrich-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_URL: https://sdr.dashboardtalentera.tech
      OWNER_TOKEN: ${{ secrets.ACQUISITION_OWNER_TOKEN || secrets.DASHBOARD_PASSWORD }}
      DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
      TARGET_PHONES: ${{ inputs.target_phones || '20' }}
      MAX_ENRICHMENTS: ${{ inputs.max_enrichments || '30' }}
    steps:
      - name: Validate required secrets
        run: |
          set -euo pipefail
          test -n "$OWNER_TOKEN" || { echo "::error::ACQUISITION_OWNER_TOKEN or DASHBOARD_PASSWORD is required"; exit 1; }
          test -n "$DASHBOARD_PASSWORD" || { echo "::error::DASHBOARD_PASSWORD is required"; exit 1; }

      - name: Build Marita phone-ready priority queue
        uses: actions/github-script@v7
        env:
          DASHBOARD_USERNAME: talentera
        with:
          script: |
            const base = process.env.BASE_URL;
            const ownerToken = process.env.OWNER_TOKEN;
            const username = process.env.DASHBOARD_USERNAME || 'talentera';
            const password = process.env.DASHBOARD_PASSWORD;
            const targetPhones = Math.max(1, Math.min(40, Number(process.env.TARGET_PHONES || 20)));
            const maxEnrichments = Math.max(targetPhones, Math.min(60, Number(process.env.MAX_ENRICHMENTS || 30)));
            const auth = `Basic ${Buffer.from(`${username}:${password}`).toString('base64')}`;
            const headers = { Authorization: auth, 'x-acquisition-owner-token': ownerToken, 'Content-Type': 'application/json' };

            async function request(path, init = {}) {
              const response = await fetch(`${base}${path}`, {
                ...init,
                headers: { ...headers, ...(init.headers || {}) },
              });
              const text = await response.text();
              let body = {};
              try { body = text ? JSON.parse(text) : {}; } catch { body = { raw: text.slice(0, 1000) }; }
              if (!response.ok) throw new Error(`${path} failed ${response.status}: ${JSON.stringify(body).slice(0, 1200)}`);
              return body;
            }

            const marketRank = new Map([
              ['Saudi Arabia', 100],
              ['United Arab Emirates', 96],
              ['Egypt', 90],
              ['South Africa', 88],
              ['Morocco', 78],
              ['Qatar', 76],
              ['Kuwait', 74],
              ['Jordan', 65],
              ['Oman', 62],
              ['Bahrain', 60],
              ['Iraq', 58],
            ]);

            function accountScore(account) {
              const explicit = Number(account.priorityScore || account.gtmScore || account.fitScore || 0);
              const market = marketRank.get(String(account.country || '')) || 0;
              const researched = account.researched ? 8 : 0;
              const confidence = account.researchConfidence === 'high' ? 6 : account.researchConfidence === 'medium' ? 3 : 0;
              return explicit * 10 + market + researched + confidence;
            }

            function personaStrength(title = '') {
              const value = String(title).toLowerCase();
              if (/chief human resources|\bchro\b|chief people/.test(value)) return 95;
              if (/talent acquisition/.test(value) && /head|director|vp|vice president/.test(value)) return 100;
              if (/recruit/.test(value) && /head|director|vp|vice president/.test(value)) return 96;
              if (/human resources|\bhr\b|people/.test(value) && /head|director|vp|vice president/.test(value)) return 88;
              if (/talent acquisition|recruit/.test(value) && /manager|lead/.test(value)) return 80;
              return 50;
            }

            function chooseCandidate(people = []) {
              return [...people]
                .filter((person) => Number(person.score || 0) >= 60)
                .filter((person) => /current company confirmed/i.test(String(person.reason || '')))
                .filter((person) => !/assistant|coordinator|intern|trainee|specialist/i.test(String(person.title || '')))
                .sort((a, b) => {
                  const left = Number(a.score || 0) * 10 + personaStrength(a.title);
                  const right = Number(b.score || 0) * 10 + personaStrength(b.title);
                  return right - left;
                })[0] || null;
            }

            function phoneList(person) {
              return [...new Set((Array.isArray(person?.phones) ? person.phones : []).map(String).map((v) => v.trim()).filter(Boolean))];
            }

            function emailList(person) {
              return [...new Set((Array.isArray(person?.emails) ? person.emails : []).map(String).map((v) => v.trim()).filter(Boolean))];
            }

            async function pushPhoneReady(account, person) {
              const phones = phoneList(person);
              if (!phones.length) return { pushed: false, reason: 'no_phone' };
              const emails = emailList(person);
              const score = Math.max(0, Math.min(100, Number(account.priorityScore || account.gtmScore || person.score || 60)));
              const payload = {
                source: 'Apollo → SignalHire Daily',
                signalHireUid: String(person.uid || ''),
                assignmentMode: 'marita',
                fullName: String(person.fullName || '').trim(),
                title: String(person.title || '').trim(),
                company: String(account.name || '').trim(),
                companyDomain: String(account.domain || '').trim(),
                location: String(person.location || account.country || '').trim(),
                linkedinUrl: String(person.linkedinUrl || '').trim(),
                email: emails[0] || '',
                emails,
                phone: phones[0],
                phones,
                score,
                priority: score >= 75 ? 'high' : 'medium',
              };
              if (!payload.fullName || !payload.companyDomain) return { pushed: false, reason: 'identity_incomplete' };
              return request('/api/prospecting/push', { method: 'POST', body: JSON.stringify(payload) });
            }

            const queue = await request('/api/acquisition?limit=1000');
            const accounts = (Array.isArray(queue.accounts) ? queue.accounts : [])
              .filter((account) => account && account.exclusionStatus === 'eligible')
              .filter((account) => ['A', 'B', 'A+', ''].includes(String(account.priorityTier || account.gtmTier || '')) || Number(account.gtmScore || 0) >= 55)
              .sort((a, b) => accountScore(b) - accountScore(a));

            const result = {
              generatedAt: new Date().toISOString(),
              targetPhones,
              maxEnrichments,
              eligibleAccounts: accounts.length,
              companiesChecked: 0,
              signalHireEnrichments: 0,
              phoneReady: 0,
              pushed: 0,
              duplicates: 0,
              noCandidate: 0,
              noPhone: 0,
              errors: [],
              prospects: [],
            };

            for (const account of accounts) {
              if (result.pushed >= targetPhones || result.signalHireEnrichments >= maxEnrichments) break;
              const domain = String(account.domain || '').trim();
              if (!domain) continue;
              result.companiesChecked += 1;

              try {
                const peoplePayload = await request(`/api/acquisition?domain=${encodeURIComponent(domain)}`);
                let person = (Array.isArray(peoplePayload.people) ? peoplePayload.people : [])
                  .filter((candidate) => candidate.enrichmentStatus === 'enriched' && candidate.meta?.verifiedCurrentCompany === true)
                  .filter((candidate) => phoneList(candidate).length > 0)
                  .sort((a, b) => Number(b.score || 0) - Number(a.score || 0))[0] || null;

                if (!person) {
                  const found = await request('/api/acquisition', {
                    method: 'POST',
                    body: JSON.stringify({ action: 'find_people', domain }),
                  });
                  const candidate = chooseCandidate(found.people || []);
                  if (!candidate) {
                    result.noCandidate += 1;
                    continue;
                  }

                  result.signalHireEnrichments += 1;
                  const enriched = await request('/api/acquisition', {
                    method: 'POST',
                    body: JSON.stringify({ action: 'enrich_person', domain, uid: candidate.uid }),
                  });
                  person = enriched.person || null;
                }

                const phones = phoneList(person);
                if (!person || !phones.length || person.meta?.verifiedCurrentCompany !== true) {
                  result.noPhone += 1;
                  continue;
                }

                result.phoneReady += 1;
                const pushed = await pushPhoneReady(account, person);
                if (pushed.duplicate) result.duplicates += 1;
                if (pushed.pushed) result.pushed += 1;
                result.prospects.push({
                  company: account.name,
                  country: account.country,
                  person: person.fullName,
                  title: person.title,
                  phones: phones.length,
                  score: account.priorityScore || account.gtmScore || person.score || 0,
                  taskId: pushed.taskId || '',
                  duplicate: Boolean(pushed.duplicate),
                });
              } catch (error) {
                result.errors.push({ domain, error: String(error?.message || error).slice(0, 500) });
              }
            }

            core.summary
              .addHeading('Marita Phone-First Daily')
              .addTable([
                [{ data: 'Metric', header: true }, { data: 'Result', header: true }],
                ['Eligible accounts', String(result.eligibleAccounts)],
                ['Companies checked', String(result.companiesChecked)],
                ['SignalHire enrichments', String(result.signalHireEnrichments)],
                ['Phone-ready personas', String(result.phoneReady)],
                ['New Marita tasks', String(result.pushed)],
                ['Existing/duplicate tasks', String(result.duplicates)],
                ['No safe persona', String(result.noCandidate)],
                ['No phone after enrichment', String(result.noPhone)],
                ['Errors', String(result.errors.length)],
              ]);

            if (result.prospects.length) {
              core.summary.addHeading('Phone-ready prospects', 3).addTable([
                [{ data: 'Company', header: true }, { data: 'Market', header: true }, { data: 'Persona', header: true }, { data: 'Title', header: true }, { data: 'Phones', header: true }, { data: 'Task', header: true }],
                ...result.prospects.slice(0, 25).map((item) => [item.company, item.country || '', item.person, item.title || '', String(item.phones), item.taskId || (item.duplicate ? 'existing' : '')]),
              ]);
            }
            await core.summary.write();

            console.log(JSON.stringify(result, null, 2));
            if (result.errors.length && result.phoneReady === 0) core.setFailed(`Daily phone-first run produced no phone-ready prospects and ${result.errors.length} errors.`);
