# Consolidates the old Marita-only paid phone-first cron into one owner-safe,
# dual-SDR Meeting Creator. Keeps the existing workflow file (no competing cron).
name: Meeting Creator Saudi Daily 200

on:
  schedule:
    # 09:15 Saudi time, Sunday through Thursday; GitHub may run a little late.
    - cron: '15 6 * * 0-4'
  push:
    branches: [main]
    paths:
      - '.github/workflows/marita-phone-first-daily.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview only; no HubSpot writes or alternate searches
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      target_per_sdr:
        description: Target per SDR per Saudi working day (hard maximum 100)
        required: false
        default: '100'
      max_inventory_pages:
        description: Existing acquisition-inventory pages to scan (each <=100)
        required: false
        default: '12'
      max_free_alternate_searches:
        description: Search-only Wrong Number company searches (0 paid reveals)
        required: false
        default: '20'

permissions:
  contents: read

concurrency:
  group: meeting-creator-saudi-daily
  cancel-in-progress: false

jobs:
  produce-and-assign:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_URL: https://sdr.dashboardtalentera.tech
      OWNER_TOKEN: ${{ secrets.ACQUISITION_OWNER_TOKEN || secrets.SDR_ADMIN_PASSWORD || secrets.DASHBOARD_PASSWORD }}
      DASHBOARD_PASSWORD: ${{ secrets.SDR_ADMIN_PASSWORD || secrets.DASHBOARD_PASSWORD }}
      DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run || 'true' }}
      TARGET_PER_SDR: ${{ inputs.target_per_sdr || '100' }}
      MAX_INVENTORY_PAGES: ${{ github.event_name == 'push' && '3' || inputs.max_inventory_pages || '12' }}
      MAX_ALTERNATE_SEARCHES: ${{ inputs.max_free_alternate_searches || '20' }}
    steps:
      - name: Validate credentials and bounded zero-credit policy
        run: |
          set -euo pipefail
          test -n "$OWNER_TOKEN" || { echo "::error::Meeting Creator admin token is missing"; exit 1; }
          test -n "$DASHBOARD_PASSWORD" || { echo "::error::Dashboard access credential is missing"; exit 1; }
          echo 'Paid provider reveals: disabled (0 Apollo / SignalHire contact credits).'
          echo 'This workflow never sends emails or WhatsApp.'

      - name: Research and schedule verified existing HubSpot contacts
        uses: actions/github-script@v7
        with:
          script: |
            const base=process.env.BASE_URL;
            const token=process.env.OWNER_TOKEN;
            const password=process.env.DASHBOARD_PASSWORD;
            const dryRun=process.env.DRY_RUN!=='false';
            const target=Math.max(1,Math.min(100,Number(process.env.TARGET_PER_SDR||100)));
            const maxInventoryPages=Math.max(1,Math.min(20,Number(process.env.MAX_INVENTORY_PAGES||12)));
            const maxAlt=Math.max(0,Math.min(20,Number(process.env.MAX_ALTERNATE_SEARCHES||20)));
            const auth='Basic '+Buffer.from('talentera:'+password).toString('base64');
            const headers={Authorization:auth,'x-acquisition-owner-token':token,'Content-Type':'application/json'};
            const ownerNames={'31644369':'Marita','37624223':'Daniel'};
            const owners=Object.keys(ownerNames);

            async function read(path) {
              for(let attempt=1;attempt<=3;attempt++){
                const controller=new AbortController();
                const timer=setTimeout(()=>controller.abort(),90000);
                try{
                  const response=await fetch(base+path,{headers,signal:controller.signal});
                  const body=await response.json().catch(()=>({}));
                  if(!response.ok)throw new Error('GET '+path+' HTTP='+response.status+' '+String(body.error||'').slice(0,150));
                  return body;
                }catch(error){
                  if(attempt===3)throw error;
                  await new Promise(resolve=>setTimeout(resolve,attempt*3000));
                }finally{clearTimeout(timer);}
              }
            }
            // HubSpot task writes are intentionally NOT retried: a timed-out POST
            // can still have created the task, and must be reconciled first.
            async function write(path,body){
              const controller=new AbortController();
              const timer=setTimeout(()=>controller.abort(),110000);
              try{
                const response=await fetch(base+path,{
                  method:'POST',headers,body:JSON.stringify(body),signal:controller.signal,
                });
                const payload=await response.json().catch(()=>({}));
                if(!response.ok)throw new Error('POST '+path+' HTTP='+response.status+' '+String(payload.error||'').slice(0,160));
                return payload;
              }finally{clearTimeout(timer);}
            }

            const reports=[];
            const seen=new Set();
            const candidates=[];
            const alternatives=[];
            let scanned=0,protectedCount=0,needsResearch=0,sourceFailures=0;

            async function scanSource(source,maxPages){
              let offset=0;
              for(let page=0;page<maxPages;page++){
                const path='/api/meeting-creator/queue?source='+source+'&offset='+offset+'&scan=100&limit=100';
                let payload;
                try{payload=await read(path);}
                catch(error){
                  reports.push({source,offset,error:String(error?.message||error).slice(0,200)});
                  sourceFailures++;
                  break;
                }
                if(payload.previewOnly!==true)throw new Error('Unsafe queue response: previewOnly was not true.');
                const list=Array.isArray(payload.accounts)?payload.accounts:[];
                scanned+=Number(payload.summary?.scanned||0);
                for(const row of list){
                  const key=String(row.domain||'').toLowerCase().replace(/^www\./,'');
                  if(!key || seen.has(key))continue;
                  seen.add(key);
                  const record={...row,source,offset,scan:100,limit:100};
                  if(row.status==='call_ready'
                    && owners.includes(String(row.sdrId))
                    && String(row.contactPhone||'').startsWith('+9665')
                    && row.phoneEvidence==='saudi_mobile_format_unverified'){
                    candidates.push(record);
                  }else if(row.status==='needs_alternate' && row.companyId){
                    alternatives.push(record);
                  }else if(row.status==='protected')protectedCount++;
                  else needsResearch++;
                }
                const next=Number(payload.pagination?.nextOffset||0);
                const total=Number(payload.pagination?.sourceTotal||0);
                if(next<=offset || next>=total)break;
                offset=next;
              }
            }
            // Search the recovery source FIRST, so a company with Wrong Number
            // does not get hidden by a weaker generic inventory classification.
            await scanSource('wrong_number',5);
            await scanSource('inventory',maxInventoryPages);
            candidates.sort((a,b)=>Number(b.priority||0)-Number(a.priority||0));
            alternatives.sort((a,b)=>Number(b.priority||0)-Number(a.priority||0));

            const plan={};
            const globallySelected=new Set();
            for(const owner of owners){
              const personal=candidates.filter(row=>String(row.sdrId)===owner);
              const fresh=personal.filter(row=>row.motion==='new_contact');
              const reactivated=personal.filter(row=>row.motion==='reactivation');
              const selected=[];
              let recoveryCount=0;
              for(const row of fresh){
                if(selected.length>=target)break;
                if(globallySelected.has(row.domain))continue;
                selected.push(row);globallySelected.add(row.domain);
              }
              for(const row of reactivated){
                if(selected.length>=target || recoveryCount>=Math.floor(target*.25))break;
                if(globallySelected.has(row.domain))continue;
                selected.push(row);globallySelected.add(row.domain);recoveryCount++;
              }
              plan[owner]={ownerId:owner,name:ownerNames[owner],target,selected,
                selectedNew:selected.filter(r=>r.motion==='new_contact').length,
                selectedReactivated:recoveryCount,created:0,skipped:0,errors:[],results:[]};
            }

            if(!dryRun){
              for(const owner of owners){
                const selected=plan[owner].selected;
                // POST selected contacts only after fresh CRM verification.
                // The application's scheduler maintains a persistent lock and
                // 100/day cap inclusive of other open SDR tasks and overdue work.
                const byPage=new Map();
                for(const row of selected){
                  const key=row.source+'|'+row.offset;
                  if(!byPage.has(key))byPage.set(key,[]);
                  byPage.get(key).push(row);
                }
                for(const rows of byPage.values()){
                  for(let i=0;i<rows.length;i+=10){
                    const batch=rows.slice(i,i+10);
                    try{
                      const result=await write('/api/meeting-creator/push',{
                        action:'push_selected',source:batch[0].source,scan:100,limit:100,
                        offset:batch[0].offset,
                        choices:batch.map(row=>({companyId:row.companyId,contactId:row.contactId})),
                      });
                      const actual=Number(result.created||0),held=Number(result.skipped||0);
                      plan[owner].created+=actual;
                      plan[owner].skipped+=held;
                      plan[owner].results.push(...(Array.isArray(result.results)?result.results:[]).map(r=>({
                        status:r.status,reason:r.reason||'',ownerId:r.ownerId||'',dueAt:r.dueAt||'',
                      })));
                    }catch(error){
                      plan[owner].errors.push(String(error?.message||error).slice(0,200));
                      // No retry after uncertain POST; prevents duplicate task creation.
                    }
                    await new Promise(resolve=>setTimeout(resolve,500));
                  }
                }
              }

              // Free search-only research on wrong numbers; do not reveal any paid
              // phone/email, create a contact or push a task without a new number.
              const researched=new Set();
              for(const row of alternatives){
                if(researched.size>=maxAlt)break;
                if(researched.has(row.domain))continue;
                researched.add(row.domain);
                try{
                  const result=await write('/api/meeting-creator/alternate',{
                    action:'find_alternate',source:row.source,offset:row.offset,
                    scan:row.scan,companyId:row.companyId,
                  });
                  reports.push({company:row.companyName,alternateSearchMatches:Number(result.matchedAlternates||0)});
                }catch(error){
                  reports.push({company:row.companyName,alternateSearchError:String(error?.message||error).slice(0,160)});
                }
              }
            }

            core.summary.addHeading('Meeting Creator · Saudi Daily 200');
            core.summary.addTable([
              [{data:'Metric',header:true},{data:'Outcome',header:true}],
              ['Date (UTC)',new Date().toISOString().slice(0,10)],
              ['Execution mode',dryRun?'Read-only preview':'Auto-push approved CRM tasks'],
              ['Target','100 Marita + 100 Daniel'],
              ['Companies scanned',String(scanned)],
              ['Ready candidates found',String(candidates.length)],
              ['Wrong-number cases requiring a new person',String(alternatives.length)],
              ['Protected accounts',String(protectedCount)],
              ['Other cases needing research',String(needsResearch)],
              ['Paid contact reveals','0'],
            ]);
            core.summary.addTable([
              [{data:'SDR',header:true},{data:'Target',header:true},{data:'Selected candidates',header:true},
               {data:'Fresh',header:true},{data:'Reactivations',header:true},{data:'HubSpot tasks confirmed',header:true},{data:'Shortfall',header:true}],
              ...owners.map(id=>{
                const p=plan[id];
                return [p.name,String(p.target),String(p.selected.length),String(p.selectedNew),String(p.selectedReactivated),
                  String(p.created),String(Math.max(0,p.target-(dryRun?p.selected.length:p.created)))];
              }),
            ]);
            for(const message of reports.slice(0,35)){
              if(message.error||message.alternateSearchError)core.warning(JSON.stringify(message));
            }
            await core.summary.write();
            const counts=Object.fromEntries(owners.map(id=>[ownerNames[id],{
              target:plan[id].target,selected:plan[id].selected.length,
              created:plan[id].created,shortfall:Math.max(0,target-(dryRun?plan[id].selected.length:plan[id].created)),
              skipped:plan[id].skipped,errors:plan[id].errors.length,
            }]));
            // CRM names and phone numbers never enter Actions logs.
            console.log(JSON.stringify({dryRun,scanned,ready:candidates.length,needsAlternate:alternatives.length,
              protected:protectedCount,needsResearch,sourceFailures,owners:counts,paidContactReveals:0}));
            if(sourceFailures===2)core.setFailed('Neither inventory nor wrong-number CRM source was available.');
