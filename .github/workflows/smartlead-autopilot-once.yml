name: Smartlead Autopilot Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/smartlead-autopilot-once.yml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: smartlead-orchestrator-production
  cancel-in-progress: false

jobs:
  send-once:
    if: contains(github.event.head_commit.message, 'Run Smartlead safe batch once')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run verified Smartlead daily batch once
        env:
          SMARTLEAD_API_KEY: ${{ secrets.SMARTLEAD_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$SMARTLEAD_API_KEY" || {
            echo "::error::SMARTLEAD_API_KEY repository secret is required."
            exit 1
          }
          HTTP_CODE=$(curl --silent --show-error \
            --connect-timeout 10 \
            --max-time 300 \
            --output /tmp/smartlead-send-once.json \
            --write-out '%{http_code}' \
            -X POST 'https://sdr.dashboardtalentera.tech/api/smartlead/send-today' \
            -H "Authorization: Bearer ${SMARTLEAD_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d '{"confirm":"SEND_VERIFIED_DAILY_BATCH"}')

          jq '{ok, mode, skipped, blocked, reason, languagePreflight, queued, laneCounts, analytics, verification, laneTargets, salesActivitySync, state, warnings}' /tmp/smartlead-send-once.json || cat /tmp/smartlead-send-once.json

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Smartlead send-once returned HTTP $HTTP_CODE."
            cat /tmp/smartlead-send-once.json || true
            exit 1
          fi
          if [ "$(jq -r '.blocked // false' /tmp/smartlead-send-once.json)" = "true" ]; then
            echo "::error::Smartlead send-once returned blocked=true."
            jq '{reason, warnings, state}' /tmp/smartlead-send-once.json || cat /tmp/smartlead-send-once.json || true
            exit 1
          fi

      - name: Verify sender reconciliation remains clean
        env:
          SMARTLEAD_API_KEY: ${{ secrets.SMARTLEAD_API_KEY }}
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl --silent --show-error \
            --connect-timeout 10 \
            --max-time 180 \
            --output /tmp/smartlead-senders.json \
            --write-out '%{http_code}' \
            -X POST 'https://sdr.dashboardtalentera.tech/api/smartlead/sender-reconcile' \
            -H "Authorization: Bearer ${SMARTLEAD_API_KEY}" \
            -H 'Content-Type: application/json')
          jq '{ok, blocked, lanes, providers, warnings}' /tmp/smartlead-senders.json || cat /tmp/smartlead-senders.json
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ] || [ "$(jq -r '.blocked // false' /tmp/smartlead-senders.json)" = "true" ]; then
            exit 1
          fi

      - name: Verify campaign parity remains clean
        env:
          SMARTLEAD_API_KEY: ${{ secrets.SMARTLEAD_API_KEY }}
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl --silent --show-error \
            --connect-timeout 10 \
            --max-time 180 \
            --output /tmp/smartlead-parity.json \
            --write-out '%{http_code}' \
            -X POST 'https://sdr.dashboardtalentera.tech/api/smartlead/campaign-parity' \
            -H "Authorization: Bearer ${SMARTLEAD_API_KEY}" \
            -H 'Content-Type: application/json')
          jq '{ok, blocked, canonical, issues}' /tmp/smartlead-parity.json || cat /tmp/smartlead-parity.json
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ] || [ "$(jq -r '.blocked // false' /tmp/smartlead-parity.json)" = "true" ]; then
            exit 1
          fi
