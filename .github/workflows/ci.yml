name: CI

on:
  push:
    branches: [main, phone-first-net-new]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DEMO_MODE: "true"
      DISABLE_AUTH: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply one-time phone-first branch patch
        if: github.ref == 'refs/heads/phone-first-net-new'
        run: |
          set -euo pipefail
          python scripts/apply-phone-first.py
          git checkout origin/main -- .github/workflows/ci.yml
          git rm -f .github/workflows/phone-first-patch.yml scripts/apply-phone-first.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/dashboard-cache/app.py src/lib/acquisition-data-api.ts src/components/NetNewAccounts.tsx src/app/api/acquisition/autorun/route.ts src/app/api/acquisition/recovery-v2/route.ts .github/workflows/ci.yml
          git commit -m "Prioritize phone-ready net-new leads"
          git push origin HEAD:phone-first-net-new
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - name: Validate Career browser runtime
        working-directory: services/career-browser
        run: |
          npm install --omit=dev --no-audit --no-fund
          npm run check
      - name: Validate FastAPI dashboard cache
        run: |
          python -m py_compile services/dashboard-cache/app.py services/dashboard-cache/smoke.py
          docker build -t sdr-dashboard-cache-ci services/dashboard-cache
          docker run -d --rm --name sdr-dashboard-cache-ci -p 127.0.0.1:18080:8000 sdr-dashboard-cache-ci
          trap 'docker rm -f sdr-dashboard-cache-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs sdr-dashboard-cache-ci
              exit 1
            fi
            sleep 1
          done
          python services/dashboard-cache/smoke.py
      - name: Validate production Docker Compose
        run: SDR_ENV_FILE=.env.example docker compose -f docker-compose.yml config >/dev/null
