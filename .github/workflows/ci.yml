name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DEMO_MODE: "true"
      DISABLE_AUTH: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - name: Validate Career browser runtime
        working-directory: services/career-browser
        run: |
          npm install --omit=dev --no-audit --no-fund
          npm run check
      - name: Validate production Docker Compose
        run: |
          sudo mkdir -p /root/SDR-Project
          sudo cp .env.example /root/SDR-Project/.env
          docker compose -f docker-compose.yml config >/dev/null
