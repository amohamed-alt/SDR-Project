name: Agent V5 Dashboard Patch

on:
  push:
    branches: [upgrade/gtm-command-center-v5]
    paths:
      - '.github/workflows/agent-v5-dashboard-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: upgrade/gtm-command-center-v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply exact dashboard patch
        run: node scripts/agent-patch-dashboard-url-state.mjs
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name "GTM Upgrade Bot"
          git config user.email "gtm-upgrade@users.noreply.github.com"
          git add src/components/Dashboard.tsx
          git diff --cached --quiet && { echo "No patch changes produced"; exit 1; }
          git commit -m "feat(filters): sync dashboard views to URL"
          git push origin HEAD:upgrade/gtm-command-center-v5
