name: One-Time Extensive-Lighter Holding Task Phone Enrichment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enrich-extensive-lighter-holding-tasks-once.yml'

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      WORKER_KEY: ${{ secrets.SIGNALHIRE_API_KEY }}
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Validate worker credential
        run: |
          set -euo pipefail
          test -n "$WORKER_KEY" || { echo '::error::SIGNALHIRE_API_KEY is required.'; exit 1; }

      - name: Wait for this exact build to reach production
        run: |
          set -euo pipefail
          HOST='https://sdr.dashboardtalentera.tech'
          READY=false
          for ATTEMPT in $(seq 1 80); do
            BODY=$(curl --silent --show-error --connect-timeout 8 --max-time 15 -H 'Cache-Control: no-cache' "${HOST}/api/health?ts=$(date +%s)" || true)
            BUILD_REF=$(printf '%s' "$BODY" | jq -r '.buildRef // empty' 2>/dev/null || true)
            if [ "$BUILD_REF" = "$TARGET_SHA" ]; then
              READY=true
              echo "Exact production build is live: $BUILD_REF"
              break
            fi
            echo "Production build ${BUILD_REF:-unavailable}; target $TARGET_SHA (attempt $ATTEMPT)."
            sleep 15
          done
          if [ "$READY" != "true" ]; then
            echo '::error::Exact production build did not become available during this run.'
            exit 1
          fi

      - name: Enrich exact Extensive-Lighter holding-task contacts
        run: |
          set -euo pipefail
          ENDPOINT='https://sdr.dashboardtalentera.tech/api/hubspot/enrich-extensive-lighter-holding-tasks'
          TOTAL_SELECTED=0
          TOTAL_UPDATED=0
          TOTAL_NO_PHONE=0
          TOTAL_NOT_FOUND=0
          TOTAL_MISMATCH=0
          TOTAL_INELIGIBLE=0
          TOTAL_API_ERRORS=0
          FINISHED=false
          LAST_CREDITS='null'

          for BATCH in $(seq 1 10); do
            OUT="/tmp/extensive-lighter-${BATCH}.json"
            HTTP_CODE=$(curl --silent --show-error \
              --connect-timeout 10 \
              --max-time 1800 \
              --output "$OUT" \
              --write-out '%{http_code}' \
              -X POST "$ENDPOINT" \
              -H 'Content-Type: application/json' \
              -H "x-acquisition-worker-key: $WORKER_KEY" \
              -d '{"execute":true,"limit":100}' || true)

            echo "Batch $BATCH HTTP: ${HTTP_CODE:-none}"
            jq '{status,scope,totals,skippedBeforeSignalHire,creditsLeft,error}' "$OUT" || cat "$OUT"
            if [ "$HTTP_CODE" != "200" ]; then
              echo "::error::Targeted enrichment failed in batch $BATCH."
              exit 1
            fi

            SELECTED=$(jq -r '.totals.selectedForSignalHire // 0' "$OUT")
            UPDATED=$(jq -r '.totals.updated // 0' "$OUT")
            NO_PHONE=$(jq -r '.totals.noPhone // 0' "$OUT")
            NOT_FOUND=$(jq -r '.totals.notFound // 0' "$OUT")
            MISMATCH=$(jq -r '.totals.identityMismatch // 0' "$OUT")
            INELIGIBLE=$(jq -r '.totals.becameIneligible // 0' "$OUT")
            API_ERRORS=$(jq -r '.totals.apiErrors // 0' "$OUT")
            LAST_CREDITS=$(jq -r '.creditsLeft // "null"' "$OUT")

            TOTAL_SELECTED=$((TOTAL_SELECTED + SELECTED))
            TOTAL_UPDATED=$((TOTAL_UPDATED + UPDATED))
            TOTAL_NO_PHONE=$((TOTAL_NO_PHONE + NO_PHONE))
            TOTAL_NOT_FOUND=$((TOTAL_NOT_FOUND + NOT_FOUND))
            TOTAL_MISMATCH=$((TOTAL_MISMATCH + MISMATCH))
            TOTAL_INELIGIBLE=$((TOTAL_INELIGIBLE + INELIGIBLE))
            TOTAL_API_ERRORS=$((TOTAL_API_ERRORS + API_ERRORS))

            echo 'RESULT_IDS_BEGIN'
            jq -r '.outcomes[]? | [.contactId, .status] | @tsv' "$OUT" || true
            echo 'RESULT_IDS_END'

            if [ "$SELECTED" -eq 0 ]; then
              FINISHED=true
              echo 'No remaining eligible unattempted contacts in the exact 669-task scope.'
              break
            fi
          done

          echo 'FINAL_SUMMARY_BEGIN'
          jq -n \
            --argjson finished "$FINISHED" \
            --argjson selected "$TOTAL_SELECTED" \
            --argjson updated "$TOTAL_UPDATED" \
            --argjson noPhone "$TOTAL_NO_PHONE" \
            --argjson notFound "$TOTAL_NOT_FOUND" \
            --argjson identityMismatch "$TOTAL_MISMATCH" \
            --argjson becameIneligible "$TOTAL_INELIGIBLE" \
            --argjson apiErrors "$TOTAL_API_ERRORS" \
            --arg creditsLeft "$LAST_CREDITS" \
            '{finished:$finished,selectedForSignalHire:$selected,updated:$updated,noPhone:$noPhone,notFound:$notFound,identityMismatch:$identityMismatch,becameIneligible:$becameIneligible,apiErrors:$apiErrors,creditsLeft:($creditsLeft | if . == "null" then null else tonumber end)}'
          echo 'FINAL_SUMMARY_END'

          if [ "$FINISHED" != "true" ]; then
            echo '::error::Stopped before the exact target scope was exhausted.'
            exit 1
          fi
