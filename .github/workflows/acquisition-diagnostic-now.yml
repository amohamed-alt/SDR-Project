name: Acquisition Diagnostic Now

on:
  push:
    branches: [acquisition-diagnostic-check]
    paths:
      - ".github/workflows/acquisition-diagnostic-now.yml"

permissions:
  contents: read
  statuses: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read production queue
        id: queue
        run: |
          set -euo pipefail
          # Read-only snapshot 2. This workflow never invokes Apollo or SignalHire.
          HTTP_CODE=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --output /tmp/acquisition.json --write-out '%{http_code}' \
            'https://sdr.dashboardtalentera.tech/api/acquisition?limit=1000&includeExcluded=1' || true)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "state=error" >> "$GITHUB_OUTPUT"
            echo "description=queue HTTP $HTTP_CODE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          QUEUE=$(jq -r '(.accounts // []) | length' /tmp/acquisition.json)
          ELIGIBLE=$(jq -r '[.accounts[]? | select(.exclusionStatus == "eligible")] | length' /tmp/acquisition.json)
          EXISTING=$(jq -r '[.accounts[]? | select(.exclusionReason == "Already exists in HubSpot")] | length' /tmp/acquisition.json)
          PEOPLE=$(jq -r '[.accounts[]? | select((.peopleCount // 0) > 0)] | length' /tmp/acquisition.json)
          ENRICHED=$(jq -r '[.accounts[]? | select((.enrichedCount // 0) > 0)] | length' /tmp/acquisition.json)
          PUSHED=$(jq -r '[.accounts[]? | select((.pushCount // 0) > 0)] | length' /tmp/acquisition.json)
          DESC="queue=$QUEUE eligible=$ELIGIBLE existing=$EXISTING people=$PEOPLE enriched=$ENRICHED pushed=$PUSHED"
          echo "state=success" >> "$GITHUB_OUTPUT"
          echo "description=$DESC" >> "$GITHUB_OUTPUT"
          echo "$DESC"
      - name: Publish diagnostic status
        uses: actions/github-script@v7
        env:
          STATE: ${{ steps.queue.outputs.state }}
          DESCRIPTION: ${{ steps.queue.outputs.description }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: process.env.STATE === 'success' ? 'success' : 'error',
              context: 'acquisition/diagnostic',
              description: process.env.DESCRIPTION.slice(0, 140),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
