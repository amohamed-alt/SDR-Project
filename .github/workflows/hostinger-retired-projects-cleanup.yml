name: Remove Verified Empty Retired Hostinger Projects

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hostinger-retired-projects-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remove only verified empty retired projects
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${HOSTINGER_API_KEY:-}"
          AUTH="$HOSTINGER_API_KEY"; case "$AUTH" in Bearer\ *) ;; *) AUTH="Bearer $AUTH" ;; esac
          VM='https://developers.hostinger.com/api/vps/v1/virtual-machines/1604210'
          req(){ local m="$1" u="$2" o="$3"; curl -sS --connect-timeout 8 --max-time 30 -X "$m" -H "Authorization: $AUTH" -H 'Accept: application/json' -o "$o" -w '%{http_code}' "$u" || true; }
          poll(){ local ID="$1" LABEL="$2"; [ -z "$ID" ] && return 0; for I in $(seq 1 36); do req GET "$VM/actions/$ID" /tmp/action.json >/dev/null; S=$(jq -r '.state // "unknown"' /tmp/action.json 2>/dev/null || echo unknown); echo "$LABEL action $I: $S"; case "$S" in success|completed) return 0;; failed|error) cat /tmp/action.json; return 1;; esac; sleep 5; done; return 1; }

          for PROJECT in gtm-career-browser career-judge-ollama; do
            echo "=== $PROJECT ==="
            OK=0
            C='000'
            for TRY in 1 2 3 4 5; do
              C=$(req GET "$VM/docker/$PROJECT/containers" /tmp/containers.json)
              echo "inventory $TRY/5: HTTP ${C:-000}"
              if [ "$C" = 404 ] || [ "$C" = 422 ]; then echo "$PROJECT already absent"; OK=2; break; fi
              if [ "$C" = 200 ]; then OK=1; break; fi
              sleep $((TRY * 3))
            done
            [ "$OK" = 2 ] && continue
            if [ "$OK" != 1 ]; then echo "Skip $PROJECT: inventory unavailable."; continue; fi

            COUNT=$(jq 'length' /tmp/containers.json 2>/dev/null || echo 999)
            echo "container_count=$COUNT"
            if [ "$COUNT" != 0 ]; then
              jq -r '.[]? | [.name,.image,.state,.status] | @tsv' /tmp/containers.json || true
              echo "Skip $PROJECT: project is not empty."
              continue
            fi

            D='000'
            for TRY in 1 2 3; do
              D=$(req DELETE "$VM/docker/$PROJECT/down" /tmp/delete.json)
              echo "delete $TRY/3: HTTP ${D:-000}"
              if [ "$D" -ge 200 ] 2>/dev/null && [ "$D" -lt 300 ] 2>/dev/null; then break; fi
              sleep $((TRY * 4))
            done
            if [ "$D" -ge 200 ] 2>/dev/null && [ "$D" -lt 300 ] 2>/dev/null; then
              ID=$(jq -r '.id // .action.id // empty' /tmp/delete.json 2>/dev/null || true)
              poll "$ID" "$PROJECT"
            else
              cat /tmp/delete.json 2>/dev/null || true
              echo "Could not delete $PROJECT; leaving it untouched."
            fi
          done

          H=$(curl -sS --connect-timeout 8 --max-time 20 -o /tmp/health.json -w '%{http_code}' 'https://sdr.dashboardtalentera.tech/api/health?retired_shells_cleanup=1' || true)
          echo "SDR health: HTTP ${H:-000}"
          jq '{status,service,buildRef}' /tmp/health.json 2>/dev/null || true
          test "$H" = 200
