name: Agent V8 Install Playwright

on:
  push:
    branches: [upgrade/gtm-command-center-v8-e2e]
    paths:
      - '.github/workflows/agent-v8-install-playwright.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: upgrade/gtm-command-center-v8-e2e
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Playwright Test
        run: |
          npm install -D @playwright/test@latest --save-exact --no-audit
          npm pkg set scripts.test:e2e="playwright test"
      - name: Commit dependency graph
        run: |
          set -euo pipefail
          git config user.name "GTM Upgrade Bot"
          git config user.email "gtm-upgrade@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && { echo "No Playwright dependency changes produced"; exit 1; }
          git commit -m "test(e2e): add Playwright Test"
          git push origin HEAD:upgrade/gtm-command-center-v8-e2e
