name: Verify Current Work Email Safety Production
# Temporary read-only production verification for PR #141.

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/hostinger-diagnostic.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the exact safety merge is live
        env:
          DASHBOARD_USERNAME: ${{ secrets.DASHBOARD_USERNAME || 'talentera' }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD || secrets.ACQUISITION_OWNER_TOKEN }}
        run: |
          set -euo pipefail
          EXPECTED_SHA='ea58b05a0d821a55f0b1b0537ea6fc1dcc718779'
          test -n "${DASHBOARD_PASSWORD:-}"

          for ATTEMPT in $(seq 1 12); do
            HTTP_CODE=$(curl --silent --show-error \
              --user "${DASHBOARD_USERNAME}:${DASHBOARD_PASSWORD}" \
              --connect-timeout 10 \
              --max-time 30 \
              --output /tmp/health.json \
              --write-out '%{http_code}' \
              "https://sdr.dashboardtalentera.tech/api/health?workEmailSafety=${EXPECTED_SHA}&attempt=${ATTEMPT}" || true)
            BUILD_REF=$(jq -r '.buildRef // .build // empty' /tmp/health.json 2>/dev/null || true)
            if [ "$HTTP_CODE" = '200' ] && [ "$BUILD_REF" = "$EXPECTED_SHA" ]; then
              echo "PRODUCTION_CURRENT_WORK_EMAIL_SAFETY_OK build=$BUILD_REF"
              exit 0
            fi
            echo "Production verification ${ATTEMPT}/12: HTTP=${HTTP_CODE:-none} build=${BUILD_REF:-unknown}"
            sleep 10
          done

          echo '::error::Production did not expose the safety merge build.'
          exit 1
