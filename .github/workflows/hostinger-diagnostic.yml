name: Dispatch Verified Production Deploy

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/hostinger-diagnostic.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch the official Hostinger deployment from current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MAIN_SHA=$(curl --silent --show-error --fail             -H "Authorization: Bearer ${GH_TOKEN}"             -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/main"             | jq -r '.commit.sha')
          test "$MAIN_SHA" = '86d9e95d2f82e8d058a3352230126d47b787fc22'

          HTTP_CODE=$(curl --silent --show-error             --output /tmp/dispatch.json             --write-out '%{http_code}'             -X POST             -H "Authorization: Bearer ${GH_TOKEN}"             -H 'Accept: application/vnd.github+json'             -H 'Content-Type: application/json'             -d '{"ref":"main"}'             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-hostinger.yml/dispatches")
          test "$HTTP_CODE" = '204'
          echo "OFFICIAL_DEPLOY_DISPATCHED sha=$MAIN_SHA"
