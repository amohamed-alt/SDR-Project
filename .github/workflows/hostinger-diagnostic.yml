name: Verify Current Work Email Safety Production
# Temporary read-only production verification for PR #141.

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/hostinger-diagnostic.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify the exact deployed descendant is live
        env:
          DASHBOARD_USERNAME: ${{ secrets.DASHBOARD_USERNAME || 'talentera' }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD || secrets.ACQUISITION_OWNER_TOKEN }}
        run: |
          set -euo pipefail
          EXPECTED_SHA='86d9e95d2f82e8d058a3352230126d47b787fc22'
          test -n "${DASHBOARD_PASSWORD:-}"

          HTTP_CODE=$(curl --silent --show-error \
            --user "${DASHBOARD_USERNAME}:${DASHBOARD_PASSWORD}" \
            --connect-timeout 10 \
            --max-time 30 \
            --output /tmp/health.json \
            --write-out '%{http_code}' \
            "https://sdr.dashboardtalentera.tech/api/health?workEmailSafety=${EXPECTED_SHA}" || true)
          BUILD_REF=$(jq -r '.buildRef // .build // empty' /tmp/health.json 2>/dev/null || true)
          test "$HTTP_CODE" = '200'
          test "$BUILD_REF" = "$EXPECTED_SHA"
          echo "PRODUCTION_CURRENT_WORK_EMAIL_SAFETY_OK build=$BUILD_REF"
