name: Run Verified Smartlead Batch Once
# Temporary dispatcher. The official workflow owns all send and safety logic.

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/hostinger-diagnostic.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch-and-wait:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Dispatch official idempotent Smartlead autopilot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXPECTED_SHA='b4ca90c319060af2ee436700ce88f1a4c8980fe5'
          STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          DISPATCH_CODE=$(curl --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output /tmp/dispatch.json \
            --write-out '%{http_code}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/smartlead-autopilot.yml/dispatches" \
            --data '{"ref":"main","inputs":{"mode":"autopilot"}}')
          test "$DISPATCH_CODE" = '204'
          echo "Official Smartlead autopilot dispatched."

          RUN_ID=''
          for ATTEMPT in $(seq 1 30); do
            curl --silent --show-error --fail \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/smartlead-autopilot.yml/runs?event=workflow_dispatch&branch=main&per_page=20" \
              > /tmp/runs.json
            RUN_ID=$(jq -r --arg sha "$EXPECTED_SHA" --arg started "$STARTED_AT" \
              '[.workflow_runs[] | select(.head_sha == $sha and .created_at >= $started)] | sort_by(.created_at) | reverse | .[0].id // empty' /tmp/runs.json)
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 5
          done
          test -n "$RUN_ID"
          echo "SMARTLEAD_OFFICIAL_RUN_ID=$RUN_ID"

          CONCLUSION=''
          for ATTEMPT in $(seq 1 60); do
            curl --silent --show-error --fail \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
              > /tmp/run.json
            STATUS=$(jq -r '.status' /tmp/run.json)
            CONCLUSION=$(jq -r '.conclusion // ""' /tmp/run.json)
            echo "Smartlead run ${ATTEMPT}/60: ${STATUS} ${CONCLUSION:-pending}"
            if [ "$STATUS" = 'completed' ]; then break; fi
            sleep 10
          done

          test "$CONCLUSION" = 'success'
          echo "SMARTLEAD_VERIFIED_BATCH_WORKFLOW_OK run=$RUN_ID"
