name: Audit Today's Smartlead Launch

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/hostinger-diagnostic.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read today's production state and managed campaign statuses
        env:
          SMARTLEAD_API_KEY: ${{ secrets.SMARTLEAD_API_KEY }}
          DASHBOARD_USERNAME: ${{ secrets.DASHBOARD_USERNAME || 'talentera' }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD || secrets.ACQUISITION_OWNER_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${SMARTLEAD_API_KEY:-}"
          test -n "${DASHBOARD_PASSWORD:-}"

          curl --silent --show-error --fail             --user "${DASHBOARD_USERNAME}:${DASHBOARD_PASSWORD}"             --connect-timeout 10             --max-time 60             'https://sdr.dashboardtalentera.tech/api/smartlead/orchestrator-v3'             > /tmp/state.json

          jq '{state, schedule, verification, campaigns}' /tmp/state.json

          echo '[]' > /tmp/all-campaigns.json
          for OFFSET in $(seq 0 100 900); do
            curl --silent --show-error --fail               --connect-timeout 10               --max-time 60               "https://server.smartlead.ai/api/v1/campaigns?api_key=${SMARTLEAD_API_KEY}&offset=${OFFSET}&limit=100"               > /tmp/page.json
            jq 'if type == "array" then . elif (.data | type) == "array" then .data elif (.campaigns | type) == "array" then .campaigns else [] end'               /tmp/page.json > /tmp/page-normalized.json
            COUNT=$(jq 'length' /tmp/page-normalized.json)
            jq -s 'add' /tmp/all-campaigns.json /tmp/page-normalized.json > /tmp/next.json
            mv /tmp/next.json /tmp/all-campaigns.json
            if [ "$COUNT" -lt 100 ]; then break; fi
          done

          jq '[.[] | select((.id // .campaign_id) as $id | [3841527,3841528,3841529,3841530] | index($id)) | {id:(.id // .campaign_id), name:(.name // .campaign_name), status}] | sort_by(.id)'             /tmp/all-campaigns.json > /tmp/managed.json
          jq . /tmp/managed.json
          test "$(jq 'length' /tmp/managed.json)" = '4'
          test "$(jq '[.[] | select((.status | ascii_upcase) != "STARTED" and (.status | ascii_upcase) != "ACTIVE")] | length' /tmp/managed.json)" = '0'
          echo 'SMARTLEAD_LAUNCH_AUDIT_OK managed_campaigns=4 status=started'
