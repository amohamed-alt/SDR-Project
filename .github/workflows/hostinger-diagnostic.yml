name: Read-only Smartlead Lane Audit
# Temporary diagnostic. No writes to Smartlead, HubSpot, or production.

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/hostinger-diagnostic.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Audit four live campaign lanes
        env:
          SMARTLEAD_API_KEY: ${{ secrets.SMARTLEAD_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$SMARTLEAD_API_KEY"
          SL='https://server.smartlead.ai/api/v1'

          printf '%s\n' \
            'talentera_ar|3841527' \
            'talentera_en|3841528' \
            'evalufy_ar|3841530' \
            'evalufy_en|3841529' > /tmp/specs.txt

          while IFS='|' read -r LANE ID; do
            curl --silent --show-error --fail --retry 4 --retry-delay 2 --retry-all-errors --max-time 90 \
              "$SL/campaigns/$ID?api_key=$SMARTLEAD_API_KEY" > "/tmp/c-$LANE.json"
            curl --silent --show-error --fail --retry 4 --retry-delay 2 --retry-all-errors --max-time 90 \
              "$SL/campaigns/$ID/analytics?api_key=$SMARTLEAD_API_KEY" > "/tmp/a-$LANE.json"
            curl --silent --show-error --fail --retry 4 --retry-delay 2 --retry-all-errors --max-time 90 \
              "$SL/campaigns/$ID/leads?offset=0&limit=100&api_key=$SMARTLEAD_API_KEY" > "/tmp/l-$LANE.json"
            curl --silent --show-error --fail --retry 4 --retry-delay 2 --retry-all-errors --max-time 90 \
              "$SL/campaigns/$ID/leads?offset=0&limit=1&emailStatus=is_spam&api_key=$SMARTLEAD_API_KEY" > "/tmp/s-$LANE.json"

            ACCOUNTS_CODE=$(curl --silent --show-error --retry 2 --retry-delay 1 --max-time 60 \
              --output "/tmp/e-$LANE.json" --write-out '%{http_code}' \
              "$SL/campaigns/$ID/email-accounts?api_key=$SMARTLEAD_API_KEY")
            if [ "$ACCOUNTS_CODE" != '200' ]; then echo '[]' > "/tmp/e-$LANE.json"; fi

            jq -nc \
              --arg lane "$LANE" \
              --slurpfile campaign "/tmp/c-$LANE.json" \
              --slurpfile analytics "/tmp/a-$LANE.json" \
              --slurpfile leads "/tmp/l-$LANE.json" \
              --slurpfile spam "/tmp/s-$LANE.json" \
              --slurpfile accounts "/tmp/e-$LANE.json" \
              --arg accountsHttp "$ACCOUNTS_CODE" '
              def root($x): if (($x.data // null) | type) == "object" then $x.data else $x end;
              def rows($x):
                if ($x | type) == "array" then $x
                else ($x.data // $x.leads // $x.results // $x.email_accounts // $x.accounts // [])
                end;
              def status($r): ($r.status // $r.lead_status // $r.email_status // $r.category // "UNKNOWN" | tostring);
              def personal($e): (($e // "" | ascii_downcase) | test("@(gmail|hotmail|outlook|yahoo|icloud|live|protonmail|aol)\\."));
              def spamcount($x): (($x.total // $x.count // $x.total_count) // (rows($x) | length));
              {
                lane: $lane,
                campaign: (root($campaign[0]) | {id,name,status}),
                analytics: $analytics[0],
                leads: {
                  total: (rows($leads[0]) | length),
                  statuses: (rows($leads[0]) | map(status(.)) | sort | group_by(.) | map({key: .[0], value: length}) | from_entries),
                  personalDomains: (rows($leads[0]) | map(select(personal(.email // .lead.email))) | length),
                  personalDomainStatuses: (rows($leads[0]) | map(select(personal(.email // .lead.email))) | map(status(.)) | sort | group_by(.) | map({key: .[0], value: length}) | from_entries),
                  emailStatuses: (rows($leads[0]) | map((.email_status // "UNKNOWN") | tostring) | sort | group_by(.) | map({key: .[0], value: length}) | from_entries),
                  bounceReasons: (rows($leads[0]) | map(select((.bounce_reason // .email_status // "") | tostring | test("bounce|invalid"; "i"))) | map((.bounce_reason // .email_status // "UNKNOWN") | tostring) | sort | group_by(.) | map({key: .[0], value: length}) | from_entries),
                  sequenceSteps: (rows($leads[0]) | map((.last_email_sequence_sent // .sequence_number // .current_sequence_number // 0) | tostring) | sort | group_by(.) | map({key: .[0], value: length}) | from_entries)
                },
                spamComplaints: spamcount($spam[0]),
                assignedSenders: (if $accountsHttp == "200" then (rows($accounts[0]) | length) else null end),
                assignedSendersHttp: $accountsHttp
              }'
          done < /tmp/specs.txt

          echo 'SMARTLEAD_LANE_AUDIT_OK'
