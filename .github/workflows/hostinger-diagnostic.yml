name: Reconcile HubSpot MillionVerifier Property

on:
  pull_request:
    types: [reopened]
    paths:
      - .github/workflows/hostinger-diagnostic.yml

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Rename and verify the existing HubSpot contact property
        env:
          HUBSPOT_PRIVATE_APP_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${HUBSPOT_PRIVATE_APP_TOKEN:-}" || {
            echo "::error::HUBSPOT_PRIVATE_APP_TOKEN is missing."
            exit 1
          }

          API_URL='https://api.hubapi.com/crm/v3/properties/contacts/gtm_email_status'
          AUTH_HEADER="Authorization: Bearer ${HUBSPOT_PRIVATE_APP_TOKEN}"

          curl --silent --show-error --fail             -H "$AUTH_HEADER"             "$API_URL" > /tmp/property-before.json

          test "$(jq -r '.name' /tmp/property-before.json)" = 'gtm_email_status'
          test "$(jq -r '.type' /tmp/property-before.json)" = 'enumeration'
          test "$(jq -r '[.options[].value] | sort | join(",")' /tmp/property-before.json)" = 'catch_all,invalid,unknown,valid'

          curl --silent --show-error --fail             -X PATCH             -H "$AUTH_HEADER"             -H 'Content-Type: application/json'             --data '{"label":"MillionVerifier Status"}'             "$API_URL" > /tmp/property-after.json

          test "$(jq -r '.name' /tmp/property-after.json)" = 'gtm_email_status'
          test "$(jq -r '.label' /tmp/property-after.json)" = 'MillionVerifier Status'
          test "$(jq -r '.type' /tmp/property-after.json)" = 'enumeration'
          test "$(jq -r '[.options[].value] | sort | join(",")' /tmp/property-after.json)" = 'catch_all,invalid,unknown,valid'

          echo 'HUBSPOT_PROPERTY_RECONCILED name=gtm_email_status label=MillionVerifier_Status statuses=valid,catch_all,invalid,unknown'
