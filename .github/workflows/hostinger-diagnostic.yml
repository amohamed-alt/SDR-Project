name: Reconcile HubSpot MillionVerifier Property

on:
  pull_request:
    paths:
      - .github/workflows/hostinger-diagnostic.yml

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Patch and verify the existing HubSpot property through an isolated container
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_API_KEY"
          API_BASE='https://developers.hostinger.com/api/vps/v1/virtual-machines/1604210/docker'
          PROJECT='sdr-hubspot-property-once'

          cleanup() {
            curl --silent --show-error \
              -X DELETE \
              -H "Authorization: Bearer ${HOSTINGER_API_KEY}" \
              "${API_BASE}/${PROJECT}/down" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cleanup

          CONTENT_URL="https://github.com/amohamed-alt/SDR-Project/blob/${HEAD_SHA}/docker-compose.hubspot-once.yml"
          BODY=$(jq -n \
            --arg project_name "$PROJECT" \
            --arg content "$CONTENT_URL" \
            '{project_name: $project_name, content: $content}')
          HTTP_CODE=$(curl --silent --show-error \
            --output /tmp/create.json \
            --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${HOSTINGER_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d "$BODY" \
            "${API_BASE}")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Temporary Hostinger project creation failed (HTTP ${HTTP_CODE})."
            exit 1
          fi
          jq '{id, status, message}' /tmp/create.json

          COMPLETED=false
          for ATTEMPT in $(seq 1 60); do
            sleep 5
            curl --silent --show-error --fail \
              -H "Authorization: Bearer ${HOSTINGER_API_KEY}" \
              "${API_BASE}/${PROJECT}/containers" > /tmp/containers.json || continue
            STATE=$(jq -r '.[0].state // ""' /tmp/containers.json)
            STATUS=$(jq -r '.[0].status // ""' /tmp/containers.json)
            echo "Property worker ${ATTEMPT}/60: state=${STATE:-pending} status=${STATUS:-pending}"
            if [ "$STATE" = "exited" ]; then
              if printf '%s' "$STATUS" | grep -Fq 'Exited (0)'; then
                COMPLETED=true
              fi
              break
            fi
          done

          curl --silent --show-error --fail \
            -H "Authorization: Bearer ${HOSTINGER_API_KEY}" \
            "${API_BASE}/${PROJECT}/logs" > /tmp/logs.json
          SAFE_LOGS=$(jq -r '.. | strings' /tmp/logs.json \
            | grep -E 'Existing HubSpot property|HUBSPOT_PROPERTY_RECONCILED' || true)
          printf '%s\n' "$SAFE_LOGS"
          test "$COMPLETED" = "true"
          printf '%s' "$SAFE_LOGS" | grep -Fq 'HUBSPOT_PROPERTY_RECONCILED'
