name: Reconcile HubSpot MillionVerifier Property

on:
  pull_request:
    paths:
      - .github/workflows/hostinger-diagnostic.yml

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Patch and verify the existing HubSpot property through an isolated container
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_API_KEY"
          API_BASE='https://developers.hostinger.com/api/vps/v1/virtual-machines/1604210/docker'
          PROJECT='sdr-hubspot-property-once'

          cleanup() {
            curl --silent --show-error \
              -X DELETE \
              -H "Authorization: Bearer ${HOSTINGER_API_KEY}" \
              "${API_BASE}/${PROJECT}/down" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cleanup

          read -r -d '' COMPOSE_CONTENT <<'YAML' || true
          name: sdr-hubspot-property-once
          services:
            hubspot-property:
              image: curlimages/curl:8.10.1
              user: "0:0"
              restart: "no"
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  set -a
                  . /run/sdr-env/.env
                  set +a
                  test -n "$$HUBSPOT_PRIVATE_APP_TOKEN"
                  API='https://api.hubapi.com/crm/v3/properties/contacts/gtm_email_status'
                  curl --silent --show-error --fail \
                    -H "Authorization: Bearer $$HUBSPOT_PRIVATE_APP_TOKEN" \
                    "$$API" > /tmp/before.json
                  grep -Fq '"name":"gtm_email_status"' /tmp/before.json
                  grep -Fq '"type":"enumeration"' /tmp/before.json
                  for STATUS in valid catch_all invalid unknown; do
                    grep -Fq "\"value\":\"$$STATUS\"" /tmp/before.json
                  done
                  echo 'Existing HubSpot property and statuses verified.'
                  curl --silent --show-error --fail \
                    -X PATCH \
                    -H "Authorization: Bearer $$HUBSPOT_PRIVATE_APP_TOKEN" \
                    -H 'Content-Type: application/json' \
                    -d '{"label":"MillionVerifier Status"}' \
                    "$$API" > /tmp/update.json
                  curl --silent --show-error --fail \
                    -H "Authorization: Bearer $$HUBSPOT_PRIVATE_APP_TOKEN" \
                    "$$API" > /tmp/after.json
                  grep -Fq '"name":"gtm_email_status"' /tmp/after.json
                  grep -Fq '"label":"MillionVerifier Status"' /tmp/after.json
                  grep -Fq '"type":"enumeration"' /tmp/after.json
                  for STATUS in valid catch_all invalid unknown; do
                    grep -Fq "\"value\":\"$$STATUS\"" /tmp/after.json
                  done
                  echo 'HUBSPOT_PROPERTY_RECONCILED name=gtm_email_status label=MillionVerifier_Status statuses=valid,catch_all,invalid,unknown'
              volumes:
                - sdr_runtime_env:/run/sdr-env:ro
          volumes:
            sdr_runtime_env:
              external: true
              name: sdr-project_sdr_runtime_env
          YAML

          BODY=$(jq -n \
            --arg project_name "$PROJECT" \
            --arg content "$COMPOSE_CONTENT" \
            '{project_name: $project_name, content: $content}')
          HTTP_CODE=$(curl --silent --show-error \
            --output /tmp/create.json \
            --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${HOSTINGER_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d "$BODY" \
            "${API_BASE}")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Temporary Hostinger project creation failed (HTTP ${HTTP_CODE})."
            exit 1
          fi

          COMPLETED=false
          for ATTEMPT in $(seq 1 24); do
            sleep 5
            curl --silent --show-error --fail \
              -H "Authorization: Bearer ${HOSTINGER_API_KEY}" \
              "${API_BASE}/${PROJECT}/containers" > /tmp/containers.json || continue
            STATE=$(jq -r '.[0].state // ""' /tmp/containers.json)
            STATUS=$(jq -r '.[0].status // ""' /tmp/containers.json)
            echo "Property worker ${ATTEMPT}/24: state=${STATE:-pending} status=${STATUS:-pending}"
            if [ "$STATE" = "exited" ]; then
              if printf '%s' "$STATUS" | grep -Fq 'Exited (0)'; then
                COMPLETED=true
              fi
              break
            fi
          done

          curl --silent --show-error --fail \
            -H "Authorization: Bearer ${HOSTINGER_API_KEY}" \
            "${API_BASE}/${PROJECT}/logs" > /tmp/logs.json
          SAFE_LOGS=$(jq -r '.. | strings' /tmp/logs.json \
            | grep -E 'Existing HubSpot property|HUBSPOT_PROPERTY_RECONCILED' || true)
          printf '%s\n' "$SAFE_LOGS"
          test "$COMPLETED" = "true"
          printf '%s' "$SAFE_LOGS" | grep -Fq 'HUBSPOT_PROPERTY_RECONCILED'
