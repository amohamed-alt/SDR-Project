name: Patch Target Pool Bigger Batches

on:
  push:
    branches:
      - fix/target-pool-bigger-batches
    paths:
      - scripts/patch-target-pool-bigger-batches.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/target-pool-bigger-batches
      - name: Apply batch scaling patch
        run: python scripts/patch-target-pool-bigger-batches.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/api/target-account-pool/route.ts
          if git diff --cached --quiet; then
            echo 'No patch changes to commit.'
            exit 0
          fi
          git commit -m 'Scale Target Pool market stocking batches'
          git push origin HEAD:fix/target-pool-bigger-batches
