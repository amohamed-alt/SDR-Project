name: Marita Phone-First Pilot Once

on:
  push:
    paths:
      - '.github/workflows/marita-phone-first-pilot-once.yml'

permissions:
  contents: write
  statuses: write

concurrency:
  group: marita-phone-first-pilot-once
  cancel-in-progress: false

jobs:
  fix-deploy-run-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_URL: https://sdr.dashboardtalentera.tech
      DASHBOARD_USERNAME: talentera
      DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
      OWNER_TOKEN: ${{ secrets.ACQUISITION_OWNER_TOKEN || secrets.DASHBOARD_PASSWORD }}
      TARGET_NEW_TASKS: '20'
      MAX_SIGNALHIRE_ENRICHMENTS: '30'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Patch acquisition pilot and owner-gate fallback
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DASHBOARD_PASSWORD" || { echo '::error::DASHBOARD_PASSWORD is required'; exit 1; }
          test -n "$OWNER_TOKEN" || { echo '::error::Owner fallback token could not be resolved'; exit 1; }

          python3 - <<'PY'
          from pathlib import Path

          route = Path('src/app/api/acquisition/route.ts')
          text = route.read_text()
          old = '''function apolloUrl(page: number) {
            const query = new URLSearchParams();
            for (const location of ["Saudi Arabia", "United Arab Emirates"]) query.append("organization_locations[]", location);
            for (const range of ["201,500", "501,1000", "1001,2000"]) query.append("organization_num_employees_ranges[]", range);
            query.set("organization_num_jobs_range[min]", "5");
            query.set("page", String(page));
            query.set("per_page", "100");
            return `https://api.apollo.io/api/v1/mixed_companies/search?${query.toString()}`;
          }'''
          new = '''function apolloUrl(page: number) {
            const query = new URLSearchParams();
            for (const location of ["Saudi Arabia", "United Arab Emirates", "Egypt", "South Africa"]) query.append("organization_locations[]", location);
            for (const range of ["201,500", "501,1000", "1001,2000", "2001,5000", "5001,10000", "10001,50000"]) query.append("organization_num_employees_ranges[]", range);
            query.set("page", String(page));
            query.set("per_page", "100");
            return `https://api.apollo.io/api/v1/mixed_companies/search?${query.toString()}`;
          }'''
          if old not in text:
              raise SystemExit('Apollo query anchor not found; refusing an unsafe patch')
          text = text.replace(old, new, 1)

          old_return = '''    existingHubSpot: accounts.filter((account) => account.exclusionReason === "Already exists in HubSpot").length,
            };'''
          new_return = '''    existingHubSpot: accounts.filter((account) => account.exclusionReason === "Already exists in HubSpot").length,
              batch: accounts.map((account) => ({
                domain: account.domain,
                name: account.name,
                country: account.country,
                employeeCount: account.employeeCount,
                industry: account.industry,
                gtmScore: account.gtmScore,
                gtmTier: account.gtmTier,
                exclusionStatus: account.exclusionStatus,
                exclusionReason: account.exclusionReason,
                primaryPersona: account.primaryPersona,
                secondaryPersona: account.secondaryPersona,
              })),
            };'''
          if old_return not in text:
              raise SystemExit('Discover return anchor not found; refusing an unsafe patch')
          text = text.replace(old_return, new_return, 1)
          route.write_text(text)

          for filename in ['.github/workflows/deploy-hostinger.yml', '.github/workflows/marita-phone-first-daily.yml']:
              path = Path(filename)
              body = path.read_text()
              needle = 'secrets.ACQUISITION_OWNER_TOKEN'
              replacement = 'secrets.ACQUISITION_OWNER_TOKEN || secrets.DASHBOARD_PASSWORD'
              if replacement not in body:
                  if needle not in body:
                      raise SystemExit(f'{filename}: owner-token anchor not found')
                  body = body.replace(needle, replacement)
              path.write_text(body)
          PY

          git config user.name 'Talentera GTM Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/app/api/acquisition/route.ts .github/workflows/deploy-hostinger.yml .github/workflows/marita-phone-first-daily.yml
          git diff --cached --check
          git commit -m 'Fix Marita phone-first production gate and pilot scope'
          git push origin HEAD:main
          PATCH_SHA=$(git rev-parse HEAD)
          echo "patch_sha=$PATCH_SHA" >> "$GITHUB_OUTPUT"
          echo "Patched commit: $PATCH_SHA"

      - name: Wait for exact production build and owner gate
        shell: bash
        env:
          PATCH_SHA: ${{ steps.patch.outputs.patch_sha }}
        run: |
          set -euo pipefail
          auth=(--user "${DASHBOARD_USERNAME}:${DASHBOARD_PASSWORD}")
          READY=false
          for ATTEMPT in $(seq 1 60); do
            HEALTH=$(curl -fsS "${auth[@]}" --connect-timeout 5 --max-time 12 -H 'Cache-Control: no-cache' "${BASE_URL}/api/health?pilot=${PATCH_SHA}&attempt=${ATTEMPT}" || true)
            BUILD=$(printf '%s' "$HEALTH" | jq -r '.buildRef // ""' 2>/dev/null || true)
            if [ "$BUILD" = "$PATCH_SHA" ]; then
              ACQ=$(curl -fsS "${auth[@]}" --connect-timeout 5 --max-time 20 -H 'Cache-Control: no-cache' "${BASE_URL}/api/acquisition?limit=1" || true)
              OWNER=$(printf '%s' "$ACQ" | jq -r '.configuration.ownerActionsConfigured // false' 2>/dev/null || echo false)
              APOLLO=$(printf '%s' "$ACQ" | jq -r '.configuration.apolloConfigured // false' 2>/dev/null || echo false)
              SIGNAL=$(printf '%s' "$ACQ" | jq -r '.configuration.signalHireConfigured // false' 2>/dev/null || echo false)
              DB=$(printf '%s' "$ACQ" | jq -r '.database // ""' 2>/dev/null || true)
              echo "Production gate: build_match=true owner=${OWNER} apollo=${APOLLO} signalhire=${SIGNAL} db=${DB}"
              if [ "$OWNER" = true ] && [ "$APOLLO" = true ] && [ "$SIGNAL" = true ] && [ "$DB" = postgresql ]; then
                READY=true
                break
              fi
            else
              echo "Production gate ${ATTEMPT}/60: waiting for exact build"
            fi
            sleep 15
          done
          [ "$READY" = true ] || { echo '::error::Production did not become phone-first ready'; exit 1; }

      - name: Spend one Apollo credit and run phone-first pilot
        id: pilot
        uses: actions/github-script@v7
        env:
          PATCH_SHA: ${{ steps.patch.outputs.patch_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const base = process.env.BASE_URL;
            const username = process.env.DASHBOARD_USERNAME || 'talentera';
            const password = process.env.DASHBOARD_PASSWORD;
            const ownerToken = process.env.OWNER_TOKEN;
            const target = Number(process.env.TARGET_NEW_TASKS || 20);
            const maxEnrich = Number(process.env.MAX_SIGNALHIRE_ENRICHMENTS || 30);
            const auth = `Basic ${Buffer.from(`${username}:${password}`).toString('base64')}`;
            const headers = { Authorization: auth, 'x-acquisition-owner-token': ownerToken, 'Content-Type': 'application/json' };

            async function request(path, init = {}) {
              const response = await fetch(`${base}${path}`, { ...init, headers: { ...headers, ...(init.headers || {}) } });
              const text = await response.text();
              let body = {};
              try { body = text ? JSON.parse(text) : {}; } catch { body = { raw: text.slice(0, 400) }; }
              if (!response.ok) throw new Error(`${path} failed ${response.status}: ${JSON.stringify(body).slice(0, 800)}`);
              return body;
            }

            const statusContext = 'pilot/marita-phone-first-1-credit';
            const existing = await github.rest.repos.listCommitStatusesForRef({ owner: context.repo.owner, repo: context.repo.repo, ref: process.env.PATCH_SHA, per_page: 100 });
            if (existing.data.some((item) => item.context === statusContext && item.state === 'success')) {
              core.setFailed('Pilot credit was already consumed for this commit; refusing to spend another credit.');
              return;
            }

            const discovery = await request('/api/acquisition', {
              method: 'POST',
              body: JSON.stringify({ action: 'discover', pages: 1, confirmCredits: true }),
            });

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.PATCH_SHA,
              state: 'success',
              context: statusContext,
              description: 'One Apollo discovery page authorized and consumed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

            const batch = (Array.isArray(discovery.batch) ? discovery.batch : [])
              .filter((account) => account?.domain && account.exclusionStatus === 'eligible')
              .sort((a, b) => Number(b.gtmScore || 0) - Number(a.gtmScore || 0));

            function phones(person) {
              return [...new Set((Array.isArray(person?.phones) ? person.phones : []).map(String).map((v) => v.trim()).filter(Boolean))];
            }
            function emails(person) {
              return [...new Set((Array.isArray(person?.emails) ? person.emails : []).map(String).map((v) => v.trim()).filter(Boolean))];
            }
            function personaStrength(title = '') {
              const value = String(title).toLowerCase();
              if (/talent acquisition/.test(value) && /head|director|vp|vice president/.test(value)) return 100;
              if (/recruit/.test(value) && /head|director|vp|vice president/.test(value)) return 96;
              if (/chief human resources|\bchro\b|chief people/.test(value)) return 94;
              if (/human resources|\bhr\b|people/.test(value) && /head|director|vp|vice president/.test(value)) return 88;
              if (/talent acquisition|recruit/.test(value) && /manager|lead/.test(value)) return 80;
              return 50;
            }
            function chooseCandidate(list = []) {
              return [...list]
                .filter((p) => Number(p.score || p.rankScore || 0) >= 55)
                .filter((p) => /current company confirmed/i.test(String(p.reason || p.fitReason || '')))
                .filter((p) => !/assistant|coordinator|intern|trainee|specialist/i.test(String(p.title || '')))
                .sort((a, b) => {
                  const as = Number(a.score || a.rankScore || 0) * 10 + personaStrength(a.title);
                  const bs = Number(b.score || b.rankScore || 0) * 10 + personaStrength(b.title);
                  return bs - as;
                })[0] || null;
            }

            const result = {
              authorizedApolloCredits: 1,
              rawApolloTotal: Number(discovery.rawTotal || 0),
              fetched: Number(discovery.fetched || 0),
              stored: Number(discovery.stored || 0),
              eligible: Number(discovery.eligible || 0),
              excluded: Number(discovery.excluded || 0),
              existingHubSpot: Number(discovery.existingHubSpot || 0),
              batchEligible: batch.length,
              companiesChecked: 0,
              signalHireEnrichments: 0,
              phoneReady: 0,
              pushed: 0,
              duplicates: 0,
              noCandidate: 0,
              noPhone: 0,
              errors: [],
              pushedTasks: [],
              visibleTasks: 0,
              visibleCompanies: 0,
              samples: [],
            };

            for (const account of batch) {
              if (result.pushed >= target || result.signalHireEnrichments >= maxEnrich) break;
              result.companiesChecked += 1;
              const domain = String(account.domain);
              try {
                let storedPeople = await request(`/api/acquisition?domain=${encodeURIComponent(domain)}`);
                let person = (storedPeople.people || [])
                  .filter((p) => p.enrichmentStatus === 'enriched' && p.meta?.verifiedCurrentCompany === true && phones(p).length)
                  .sort((a, b) => Number(b.rankScore || 0) - Number(a.rankScore || 0))[0] || null;

                if (!person) {
                  const found = await request('/api/acquisition', {
                    method: 'POST',
                    body: JSON.stringify({ action: 'find_people', domain }),
                  });
                  const candidate = chooseCandidate(found.people || []);
                  if (!candidate) { result.noCandidate += 1; continue; }
                  result.signalHireEnrichments += 1;
                  const enriched = await request('/api/acquisition', {
                    method: 'POST',
                    body: JSON.stringify({ action: 'enrich_person', domain, uid: candidate.uid }),
                  });
                  person = enriched.person || null;
                }

                const phoneValues = phones(person);
                if (!person || !phoneValues.length || person.meta?.verifiedCurrentCompany !== true) {
                  result.noPhone += 1;
                  continue;
                }
                result.phoneReady += 1;
                const emailValues = emails(person);
                const score = Math.max(0, Math.min(100, Number(account.gtmScore || person.rankScore || 60)));
                const pushed = await request('/api/prospecting/push', {
                  method: 'POST',
                  body: JSON.stringify({
                    source: 'Apollo → SignalHire Pilot',
                    signalHireUid: String(person.uid || ''),
                    assignmentMode: 'marita',
                    fullName: String(person.fullName || '').trim(),
                    title: String(person.title || '').trim(),
                    company: String(account.name || '').trim(),
                    companyDomain: domain,
                    location: String(person.location || account.country || '').trim(),
                    linkedinUrl: String(person.linkedinUrl || '').trim(),
                    email: emailValues[0] || '',
                    emails: emailValues,
                    phone: phoneValues[0],
                    phones: phoneValues,
                    score,
                    priority: score >= 75 ? 'high' : 'medium',
                  }),
                });
                if (pushed.duplicate) result.duplicates += 1;
                if (pushed.pushed) {
                  result.pushed += 1;
                  if (pushed.taskId) result.pushedTasks.push(String(pushed.taskId));
                }
                if (result.samples.length < 20) {
                  result.samples.push({ company: account.name, country: account.country, persona: person.fullName, title: person.title, score, phonePresent: true, newTask: Boolean(pushed.pushed), duplicate: Boolean(pushed.duplicate) });
                }
              } catch (error) {
                result.errors.push({ company: account.name, domain, error: String(error?.message || error).slice(0, 300) });
              }
            }

            const priority = await request('/api/marita-priority?refresh=1');
            const taskSet = new Set((priority.companies || []).flatMap((company) => company.taskIds || []).map(String));
            const companySet = new Set((priority.companies || []).map((company) => String(company.companyId || company.domain || company.companyName || '')));
            result.visibleTasks = result.pushedTasks.filter((id) => taskSet.has(id)).length;
            result.visibleCompanies = Number(priority.summary?.phoneFirstCompanies || 0);
            result.priorityReadyToCall = Number(priority.summary?.readyToCallCompanies || 0);
            result.priorityHigh = Number(priority.summary?.highPriorityCompanies || 0);
            result.priorityTotalCompanies = Array.isArray(priority.companies) ? priority.companies.length : 0;

            core.summary.addHeading('Marita Phone-First Pilot — Live Result');
            core.summary.addTable([
              [{data:'Metric',header:true},{data:'Result',header:true}],
              ['Apollo credits consumed', '1'],
              ['Apollo companies fetched', String(result.fetched)],
              ['Eligible after HubSpot/exclusion checks', String(result.batchEligible)],
              ['Already in HubSpot', String(result.existingHubSpot)],
              ['Companies checked for persona', String(result.companiesChecked)],
              ['SignalHire person enrichments', String(result.signalHireEnrichments)],
              ['Phone-ready verified personas', String(result.phoneReady)],
              ['New Marita CALL tasks', String(result.pushed)],
              ['Duplicates', String(result.duplicates)],
              ['New tasks visible in Marita Priority API', `${result.visibleTasks}/${result.pushedTasks.length}`],
              ['Marita Priority ready-to-call companies', String(result.priorityReadyToCall)],
              ['Marita Priority high-priority companies', String(result.priorityHigh)],
              ['Errors', String(result.errors.length)],
            ]);
            if (result.samples.length) {
              core.summary.addHeading('Pilot samples (no phone/email values logged)', 3).addTable([
                [{data:'Company',header:true},{data:'Market',header:true},{data:'Persona',header:true},{data:'Title',header:true},{data:'Score',header:true},{data:'Task',header:true}],
                ...result.samples.map((x) => [String(x.company||''), String(x.country||''), String(x.persona||''), String(x.title||''), String(x.score||''), x.newTask ? 'new' : x.duplicate ? 'existing' : 'not pushed']),
              ]);
            }
            await core.summary.write();

            console.log('PILOT_RESULT=' + JSON.stringify({ ...result, pushedTasks: result.pushedTasks.length, errors: result.errors.slice(0, 10) }));
            core.setOutput('pushed', String(result.pushed));
            core.setOutput('visible', String(result.visibleTasks));
            if (result.pushedTasks.length && result.visibleTasks !== result.pushedTasks.length) {
              core.setFailed(`Dashboard verification failed: only ${result.visibleTasks}/${result.pushedTasks.length} new tasks are visible in Marita Priority.`);
            }

      - name: Verify dashboard route is serving live
        shell: bash
        run: |
          set -euo pipefail
          CODE=$(curl -sS --user "${DASHBOARD_USERNAME}:${DASHBOARD_PASSWORD}" --connect-timeout 5 --max-time 30 -o /tmp/dashboard.html -w '%{http_code}' "${BASE_URL}/")
          test "$CODE" = 200 || { echo "::error::Dashboard root returned HTTP $CODE"; exit 1; }
          BYTES=$(wc -c < /tmp/dashboard.html)
          echo "Dashboard root HTTP 200, bytes=$BYTES"
          test "$BYTES" -gt 1000 || { echo '::error::Dashboard HTML response is unexpectedly small'; exit 1; }
