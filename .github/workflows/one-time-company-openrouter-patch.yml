name: One-time Company OpenRouter Patch

on:
  push:
    branches: [agent/company-openrouter-premium]
    paths:
      - .github/workflows/one-time-company-openrouter-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/company-openrouter-premium
      - name: Route Company Research through OpenRouter
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/api/gtm-research/analyze/route.ts')
          text = path.read_text()
          old_stages = 'const PREMIUM_STAGES = new Set<Stage>(["tam", "icp", "personas"]);'
          new_stages = 'const PREMIUM_STAGES = new Set<Stage>(["company", "tam", "icp", "personas"]);'
          old_model = 'const OPENROUTER_MODEL = process.env.GTM_RESEARCH_OPENROUTER_MODEL || "anthropic/claude-sonnet-4.5";'
          new_model = 'const OPENROUTER_MODEL = process.env.GTM_RESEARCH_OPENROUTER_MODEL || "openai/gpt-4.1-mini";'
          if old_stages not in text:
              raise SystemExit('Expected PREMIUM_STAGES line not found')
          if old_model not in text:
              raise SystemExit('Expected OPENROUTER_MODEL line not found')
          text = text.replace(old_stages, new_stages, 1).replace(old_model, new_model, 1)
          path.write_text(text)
          PY
          rm .github/workflows/one-time-company-openrouter-patch.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/gtm-research/analyze/route.ts .github/workflows/one-time-company-openrouter-patch.yml
          git commit -m "Route Company Research through OpenRouter"
          git push origin HEAD:agent/company-openrouter-premium
