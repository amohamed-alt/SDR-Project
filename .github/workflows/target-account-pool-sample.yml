name: Seed Saudi Target Pool Sample

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/target-account-pool-sample.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed-sample:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Seed Saudi Target Pool sample')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DASHBOARD_USERNAME: ${{ secrets.DASHBOARD_USERNAME || 'talentera' }}
      DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
      OWNER_TOKEN: ${{ secrets.ACQUISITION_OWNER_TOKEN || secrets.DASHBOARD_PASSWORD }}
    steps:
      - name: Wait for this exact build to reach production
        run: |
          set -euo pipefail
          READY=false
          for ATTEMPT in $(seq 1 30); do
            BODY=$(curl --silent --show-error \
              --connect-timeout 5 \
              --max-time 10 \
              -H 'Cache-Control: no-cache' \
              "https://sdr.dashboardtalentera.tech/api/health?sample_seed=${GITHUB_SHA}&attempt=${ATTEMPT}" || true)
            BUILD=$(printf '%s' "$BODY" | jq -r '.buildRef // ""' 2>/dev/null || true)
            echo "Production build check ${ATTEMPT}/30: ${BUILD:-none}"
            if [ "$BUILD" = "$GITHUB_SHA" ]; then
              READY=true
              break
            fi
            sleep 20
          done
          test "$READY" = 'true' || { echo "::error::Exact build did not reach production before seed window closed"; exit 1; }

      - name: Seed exactly one Saudi Apollo page
        run: |
          set -euo pipefail
          test -n "$DASHBOARD_PASSWORD" || { echo '::error::DASHBOARD_PASSWORD is required'; exit 1; }
          test -n "$OWNER_TOKEN" || { echo '::error::Owner token is required'; exit 1; }

          HTTP_CODE=$(curl --silent --show-error \
            --connect-timeout 10 \
            --max-time 120 \
            --output /tmp/seed.json \
            --write-out '%{http_code}' \
            --user "${DASHBOARD_USERNAME}:${DASHBOARD_PASSWORD}" \
            -H "x-acquisition-owner-token: ${OWNER_TOKEN}" \
            -H 'Content-Type: application/json' \
            -X POST 'https://sdr.dashboardtalentera.tech/api/target-account-pool' \
            -d '{"action":"discover_market","country":"Saudi Arabia","pages":1,"confirmCredits":true}' || true)

          echo "Seed HTTP: ${HTTP_CODE:-none}"
          jq . /tmp/seed.json || cat /tmp/seed.json
          test "$HTTP_CODE" = '200'

      - name: Read back visible Saudi pool results
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl --silent --show-error \
            --connect-timeout 10 \
            --max-time 60 \
            --output /tmp/pool.json \
            --write-out '%{http_code}' \
            --user "${DASHBOARD_USERNAME}:${DASHBOARD_PASSWORD}" \
            'https://sdr.dashboardtalentera.tech/api/target-account-pool?country=Saudi%20Arabia&limit=1000' || true)
          echo "Pool HTTP: ${HTTP_CODE:-none}"
          jq '{targetUniverse, summary, visibleAccounts:(.accounts|length), sample:(.accounts[:10]|map({name,domain,country,industry,employeeCount,gtmScore,gtmTier,exclusionStatus,status}))}' /tmp/pool.json || cat /tmp/pool.json
          test "$HTTP_CODE" = '200'
