name: Saudi 200+ Company Inventory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/acquisition-apollo-crawl-once.yml'
      - 'scripts/saudi-inventory-crawl.mjs'

permissions:
  contents: read

concurrency:
  group: saudi-200-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BASE_URL: https://sdr.dashboardtalentera.tech
      ACQUISITION_OWNER_TOKEN: ${{ secrets.ACQUISITION_OWNER_TOKEN || secrets.SDR_ADMIN_PASSWORD || secrets.DASHBOARD_PASSWORD }}
      EXPECTED_BUILD_REF: ${{ github.event_name == 'push' && github.sha || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resume Saudi company stock and HubSpot comparison
        run: node scripts/saudi-inventory-crawl.mjs
