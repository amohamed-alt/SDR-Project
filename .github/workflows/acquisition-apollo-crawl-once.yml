name: Approved Apollo Coverage Crawl

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/acquisition-apollo-crawl-once.yml
      - services/dashboard-cache/**
      - src/app/api/acquisition/coverage-status/route.ts
      - src/app/api/acquisition/reclassify/route.ts
      - src/lib/acquisition-data-api.ts

permissions:
  contents: read

concurrency:
  group: approved-apollo-coverage-crawl
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_URL: https://sdr.dashboardtalentera.tech
      ACQUISITION_OWNER_TOKEN: ${{ secrets.ACQUISITION_OWNER_TOKEN || secrets.SDR_ADMIN_PASSWORD || secrets.DASHBOARD_PASSWORD }}
    steps:
      - name: Validate authorization
        run: |
          set -euo pipefail
          test -n "$ACQUISITION_OWNER_TOKEN" || { echo "::error::No acquisition/admin authorization secret is configured."; exit 1; }

      - name: Wait for coverage-ledger-v3 production API
        run: |
          set -euo pipefail
          URL="$BASE_URL/api/acquisition/reclassify"
          for attempt in $(seq 1 180); do
            code=$(curl -sS --connect-timeout 8 --max-time 20 -o /tmp/live.json -w '%{http_code}' "$URL" || true)
            version=$(jq -r '.version // ""' /tmp/live.json 2>/dev/null || true)
            echo "Production coverage API: HTTP=${code:-000} version=${version:-missing} (${attempt}/180)"
            if [ "$code" = 200 ] && [ "$version" = "coverage-ledger-v3" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::coverage-ledger-v3 did not become live; no provider calls were made."
          exit 1

      - name: Preserve page 30 as spent partial coverage
        run: |
          set -euo pipefail
          http=$(curl -sS --connect-timeout 10 --max-time 30 \
            -X POST "$BASE_URL/api/acquisition/coverage-progress" \
            -H "x-acquisition-owner-token: $ACQUISITION_OWNER_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"page":30,"status":"failed_spent"}' \
            -o /tmp/page30.json -w '%{http_code}' || true)
          [ "$http" = 200 ] || { echo "::error::Could not persist page 30 spent checkpoint."; cat /tmp/page30.json; exit 1; }

      - name: Verify no remaining approved Apollo page calls
        run: |
          set -euo pipefail
          curl -sS --connect-timeout 10 --max-time 30 "$BASE_URL/api/acquisition/coverage-progress" -o /tmp/progress.json
          completed=$(jq -c '.completedPages // []' /tmp/progress.json)
          missing=0
          for page in $(seq 31 89); do
            if ! echo "$completed" | jq -e --argjson page "$page" 'index($page) != null' >/dev/null; then
              echo "::error::Page $page is not checkpointed. Refusing any new Apollo request because the approved 88-credit envelope is already exhausted."
              missing=$((missing + 1))
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "Pages 31–89 are already checkpointed. Apollo calls in this finalization: 0."

      - name: Reclassify stored coverage with zero provider credits
        run: |
          set -euo pipefail
          http=$(curl -sS --connect-timeout 10 --max-time 120 \
            -X POST "$BASE_URL/api/acquisition/reclassify" \
            -H "x-acquisition-owner-token: $ACQUISITION_OWNER_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{}' \
            -o /tmp/reclassify.json -w '%{http_code}' || true)
          [ "$http" = 200 ] || { echo "::error::Zero-credit reclassification failed HTTP=${http:-000}."; cat /tmp/reclassify.json; exit 1; }
          jq '{status,scanned,changed,before,after,providerCreditsUsed}' /tmp/reclassify.json
          apollo=$(jq -r '.providerCreditsUsed.apollo // -1' /tmp/reclassify.json)
          sh_contact=$(jq -r '.providerCreditsUsed.signalHireContact // -1' /tmp/reclassify.json)
          sh_search=$(jq -r '.providerCreditsUsed.signalHireSearch // -1' /tmp/reclassify.json)
          [ "$apollo" -eq 0 ] && [ "$sh_contact" -eq 0 ] && [ "$sh_search" -eq 0 ] || {
            echo "::error::Reclassification reported unexpected provider spend."; exit 1;
          }

      - name: Verify final persistent coverage state
        run: |
          set -euo pipefail
          curl -sS --connect-timeout 10 --max-time 30 "$BASE_URL/api/acquisition/coverage-status?page=1&limit=20" -o /tmp/final.json
          jq '{stored:.ledger.stored,eligible:.ledger.eligible,review:.ledger.review,hubspot:.ledger.existingHubSpot,ready:.ledger.ready,needsPeople:.ledger.needsPeople,completedPages:.probe.completedPageCount,spentPages:.probe.spentPageCount,partialSpentPages:.probe.partialSpentPages,totalPages:.probe.totalPages,additionalCredits:.probe.estimatedAdditionalSearchCreditsToFinish}' /tmp/final.json
          spent=$(jq -r '.probe.spentPageCount // 0' /tmp/final.json)
          completed=$(jq -r '.probe.completedPageCount // 0' /tmp/final.json)
          partial=$(jq -r '(.probe.partialSpentPages // []) | length' /tmp/final.json)
          total=$(jq -r '.probe.totalPages // 89' /tmp/final.json)
          additional=$(jq -r '.probe.estimatedAdditionalSearchCreditsToFinish // -1' /tmp/final.json)
          stored=$(jq -r '.ledger.stored // 0' /tmp/final.json)
          eligible=$(jq -r '.ledger.eligible // 0' /tmp/final.json)
          [ "$spent" -eq "$total" ] || { echo "::error::Spend accounting is ${spent}/${total}."; exit 1; }
          [ $((completed + partial)) -eq "$total" ] || { echo "::error::Completed+partial coverage does not equal ${total}."; exit 1; }
          [ "$additional" -eq 0 ] || { echo "::error::Dashboard incorrectly reports additional Apollo credits required."; exit 1; }
          [ "$stored" -ge 5000 ] || { echo "::error::Persistent ledger unexpectedly contains only $stored records."; exit 1; }
          [ "$eligible" -gt 1000 ] || { echo "::error::Reclassification still reports only $eligible targetable accounts."; exit 1; }
          {
            echo "## Coverage Ledger Finalized"
            echo "- Apollo calls in this finalization: 0"
            echo "- SignalHire contact/search calls in this finalization: 0"
            echo "- Stored accounts: $stored"
            echo "- Targetable accounts: $eligible"
            echo "- Page spend accounting: $spent/$total"
          } >> "$GITHUB_STEP_SUMMARY"
