name: Guarded Hostinger SSH Cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hostinger-ssh-cleanup-now.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.HOSTINGER_VPS_HOST || secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.HOSTINGER_VPS_USER || secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.HOSTINGER_VPS_PORT || secrets.VPS_PORT }}
      VPS_KEY: ${{ secrets.HOSTINGER_VPS_SSH_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Connect, audit and clean safe legacy resources
        run: |
          set -euo pipefail
          HOST="${VPS_HOST:-187.77.2.175}"
          USER="${VPS_USER:-root}"
          PORT="${VPS_PORT:-22}"
          test -n "${VPS_KEY:-}" || { echo "::error::No VPS SSH private-key secret is configured."; exit 2; }

          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_KEY" > ~/.ssh/id_vps
          chmod 600 ~/.ssh/id_vps
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/id_vps -p "$PORT" -o BatchMode=yes -o ConnectTimeout=12 "$USER@$HOST" 'bash -s' <<'REMOTE' | tee /tmp/vps-cleanup-report.txt
          set -u
          echo "HOSTINGER SSH CLEANUP REPORT"
          date -u +'%Y-%m-%dT%H:%M:%SZ'
          echo
          echo '=== BEFORE ==='
          uptime || true
          free -h || true
          df -h / || true
          echo '-- top CPU --'
          ps -eo pid,ppid,%cpu,%mem,etime,comm,args --sort=-%cpu | head -25 || true
          echo '-- failed systemd --'
          systemctl --failed --no-pager || true
          echo '-- docker containers --'
          docker ps -a --format 'table {{.ID}}\t{{.Names}}\t{{.Image}}\t{{.Status}}' || true
          echo '-- docker live stats --'
          docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}' || true
          echo '-- docker disk --'
          docker system df || true

          echo
          echo '=== TARGETED LEGACY CLEANUP ==='
          if command -v docker >/dev/null 2>&1; then
            for SERVICE in dashboard-warmer hiring-refresh career-refresh career-judge-ollama gtm-career-browser; do
              IDS=$(docker ps -aq --filter "label=com.docker.compose.project=sdr-project" --filter "label=com.docker.compose.service=$SERVICE" 2>/dev/null || true)
              if [ -n "$IDS" ]; then
                echo "Removing retired sdr-project service: $SERVICE -> $IDS"
                docker rm -f $IDS || true
              fi
            done

            IDS=$(docker ps -aq --filter 'label=com.docker.compose.project=sdr-marita-task-cleanup' 2>/dev/null || true)
            if [ -n "$IDS" ]; then
              echo "Removing completed one-shot Marita cleanup containers: $IDS"
              docker rm -f $IDS || true
            fi

            echo '-- restart-loop candidates (reported, not auto-deleted) --'
            for ID in $(docker ps -aq 2>/dev/null); do
              NAME=$(docker inspect -f '{{.Name}}' "$ID" 2>/dev/null | sed 's#^/##')
              RC=$(docker inspect -f '{{.RestartCount}}' "$ID" 2>/dev/null || echo 0)
              STATE=$(docker inspect -f '{{.State.Status}}' "$ID" 2>/dev/null || echo unknown)
              IMAGE=$(docker inspect -f '{{.Config.Image}}' "$ID" 2>/dev/null || echo unknown)
              if [ "${RC:-0}" -ge 5 ] 2>/dev/null || [ "$STATE" = restarting ]; then
                echo "$NAME | image=$IMAGE | state=$STATE | restarts=$RC"
              fi
            done

            docker image prune -f || true
            docker builder prune -f --filter 'until=168h' || true
          fi

          command -v apt-get >/dev/null 2>&1 && apt-get clean || true
          command -v journalctl >/dev/null 2>&1 && journalctl --vacuum-time=14d || true

          echo
          echo '=== AFTER ==='
          uptime || true
          free -h || true
          df -h / || true
          docker ps -a --format 'table {{.ID}}\t{{.Names}}\t{{.Image}}\t{{.Status}}' || true
          docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}' || true
          docker system df || true
          REMOTE

      - name: Save SSH cleanup report
        if: always()
        run: |
          mkdir -p docs
          {
            echo '# Hostinger SSH cleanup report'
            echo
            echo '\`\`\`text'
            cat /tmp/vps-cleanup-report.txt 2>/dev/null || echo 'SSH cleanup did not produce a server report.'
            echo '\`\`\`'
          } > docs/hostinger-ssh-cleanup-latest.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/hostinger-ssh-cleanup-latest.md
          git diff --cached --quiet || git commit -m "docs: save Hostinger SSH cleanup report"
          git pull --rebase origin main || true
          git push origin HEAD:main || true
