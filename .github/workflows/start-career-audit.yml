name: Verify Career ATS Backfill

on:
  workflow_run:
    workflows: ["Deploy SDR Dashboard to Hostinger"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-backfill:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for production Career ATS backfill route
        run: |
          set -euo pipefail
          BASE='https://sdr.dashboardtalentera.tech/api/career-ats-backfill'
          READY=false

          for ATTEMPT in $(seq 1 30); do
            CODE=$(curl --silent --show-error --connect-timeout 5 --max-time 30 \
              --output /tmp/backfill-status.json --write-out '%{http_code}' "$BASE" || true)
            echo "Career ATS backfill route check ${ATTEMPT}/30: HTTP ${CODE:-none}"
            if [ "$CODE" = "200" ]; then
              READY=true
              break
            fi
            sleep 10
          done

          if [ "$READY" != "true" ]; then
            echo "::error::Career ATS backfill endpoint did not become ready."
            exit 1
          fi

          cat /tmp/backfill-status.json
          echo
          echo "Production route is healthy. The persistent career-refresh sidecar owns autonomous batch execution."
