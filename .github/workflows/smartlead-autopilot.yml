name: Smartlead Autopilot

on:
  workflow_run:
    workflows: ["Deploy SDR Dashboard to Hostinger"]
    types: [completed]
  schedule:
    # Asia/Riyadh is UTC+3 year-round. Three idempotent attempts make transient
    # HubSpot/API failures safe without ever queueing the same day twice.
    - cron: "45 5 * * 0-4" # 08:45 Riyadh, Sunday-Thursday
    - cron: "5 6 * * 0-4"  # 09:05 Riyadh, Sunday-Thursday
    - cron: "25 6 * * 0-4" # 09:25 Riyadh, Sunday-Thursday
  workflow_dispatch:
    inputs:
      mode:
        description: "Dry-run routing, setup only, or run today's safe batch"
        required: true
        default: "setup"
        type: choice
        options:
          - dry-run
          - setup
          - autopilot

permissions:
  contents: read
  statuses: write

concurrency:
  group: smartlead-orchestrator-production
  cancel-in-progress: false

jobs:
  smartlead-orchestrator:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate Smartlead automation secret
        env:
          SMARTLEAD_API_KEY: ${{ secrets.SMARTLEAD_API_KEY }}
        run: |
          test -n "$SMARTLEAD_API_KEY" || {
            echo "::error::SMARTLEAD_API_KEY repository secret is required."
            exit 1
          }

      - name: Report optional Primeforge infrastructure advisory
        env:
          PRIMEFORGE_API_KEY: ${{ secrets.PRIMEFORGE_API_KEY || secrets.PRIME_FORGE_API_KEY }}
          SMARTLEAD_API_KEY: ${{ secrets.SMARTLEAD_API_KEY }}
          DASHBOARD_USERNAME: ${{ secrets.DASHBOARD_USERNAME || 'talentera' }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD || secrets.ACQUISITION_OWNER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$PRIMEFORGE_API_KEY" ]; then
            echo "::warning::Primeforge advisory skipped because no API key is configured. Smartlead safety checks remain enforced."
            exit 0
          fi
          HTTP_CODE=$(curl --silent --show-error \
            --user "${DASHBOARD_USERNAME}:${DASHBOARD_PASSWORD}" \
            --connect-timeout 10 \
            --max-time 120 \
            --output /tmp/primeforge-health.json \
            --write-out '%{http_code}' \
            'https://sdr.dashboardtalentera.tech/api/primeforge/health' || true)
          HEALTHY=$(jq -r '.healthy // false' /tmp/primeforge-health.json 2>/dev/null || echo false)
          READY=$(jq -r '.readyMailboxes // 0' /tmp/primeforge-health.json 2>/dev/null || echo 0)
          jq '{configured, healthy, expectedDomains, expectedMailboxes, readyMailboxes, workspaces, domains, warnings, error}' /tmp/primeforge-health.json || true
          if [ "$HTTP_CODE" != "200" ] || [ "$HEALTHY" != "true" ] || [ "$READY" != "15" ]; then
            echo "::warning::Primeforge inventory is incomplete or unavailable. This is advisory only; Smartlead sender and reputation gates remain enforced."
          else
            echo "Primeforge advisory: five domains and 15 ready mailboxes verified."
          fi

      - name: Validate MillionVerifier without spending a verification credit
        env:
          MILLIONVERIFIER_API_KEY: ${{ secrets.MILLIONVERIFIER_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$MILLIONVERIFIER_API_KEY" || {
            echo "::error::MILLIONVERIFIER_API_KEY repository secret is required."
            exit 1
          }
          HTTP_CODE=$(curl --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --output /tmp/millionverifier-credits.json \
            --write-out '%{http_code}' \
            "https://api.millionverifier.com/api/v3/credits?api=${MILLIONVERIFIER_API_KEY}" || true)
          CREDITS=$(jq -r '.credits // empty' /tmp/millionverifier-credits.json 2>/dev/null || true)
          if [ "$HTTP_CODE" != "200" ] || ! [[ "$CREDITS" =~ ^[0-9]+$ ]]; then
            ERROR=$(jq -r '.error // .message // "unknown MillionVerifier error"' /tmp/millionverifier-credits.json 2>/dev/null || true)
            echo "::error::MillionVerifier validation failed (HTTP $HTTP_CODE): $ERROR"
            exit 1
          fi
          echo "MillionVerifier API: configured and responding; verification balance is available."

      - name: Resolve safe execution mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            MODE="setup"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            MODE="autopilot"
          else
            MODE="${MANUAL_MODE:-setup}"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Smartlead orchestrator mode: $MODE"

      - name: Sync visible Smartlead sequences or run daily batch
        env:
          SMARTLEAD_API_KEY: ${{ secrets.SMARTLEAD_API_KEY }}
          MILLIONVERIFIER_API_KEY: ${{ secrets.MILLIONVERIFIER_API_KEY }}
          DASHBOARD_USERNAME: ${{ secrets.DASHBOARD_USERNAME || 'talentera' }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD || secrets.ACQUISITION_OWNER_TOKEN }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "dry-run" ]; then
            ENDPOINT='https://sdr.dashboardtalentera.tech/api/smartlead/language-test?limit=50&refresh=1'
            HTTP_CODE=$(curl --silent --show-error \
              --user "${DASHBOARD_USERNAME}:${DASHBOARD_PASSWORD}" \
              --connect-timeout 10 \
              --max-time 300 \
              --output /tmp/smartlead-orchestrator.json \
              --write-out '%{http_code}' \
              "$ENDPOINT")
          elif [ "$MODE" = "setup" ]; then
            ENDPOINT='https://sdr.dashboardtalentera.tech/api/smartlead/orchestrator-v3'
            HTTP_CODE=$(curl --silent --show-error \
              --connect-timeout 10 \
              --max-time 300 \
              --output /tmp/smartlead-orchestrator.json \
              --write-out '%{http_code}' \
              -X POST "$ENDPOINT" \
              -H "Authorization: Bearer ${SMARTLEAD_API_KEY}" \
              -H "X-MillionVerifier-API-Key: ${MILLIONVERIFIER_API_KEY}" \
              -H 'Content-Type: application/json' \
              -d '{"mode":"setup"}')
          else
            ENDPOINT='https://sdr.dashboardtalentera.tech/api/smartlead/send-today'
            HTTP_CODE=$(curl --silent --show-error \
              --connect-timeout 10 \
              --max-time 300 \
              --output /tmp/smartlead-orchestrator.json \
              --write-out '%{http_code}' \
              -X POST "$ENDPOINT" \
              -H "Authorization: Bearer ${SMARTLEAD_API_KEY}" \
              -H 'Content-Type: application/json' \
              -d '{"confirm":"SEND_VERIFIED_DAILY_BATCH"}')
          fi

          jq '{ok, mode, productionSendingChanged, sampled, localeCounts, laneCounts, translatedCount, lowConfidence, senderPools, samples, skipped, blocked, reason, languagePreflight, activated, queued, campaigns, campaignTopology, legacyCampaigns, sequences, sequenceTiming, sendWindow, dailyLaneNewCaps, senders, capacity, analytics, verification, laneTargets, legacyWarnings, state}' /tmp/smartlead-orchestrator.json || cat /tmp/smartlead-orchestrator.json

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Smartlead ${MODE} engine returned HTTP $HTTP_CODE."
            cat /tmp/smartlead-orchestrator.json || true
            exit 1
          fi

      - name: Reconcile sender brands and Google Microsoft pools
        if: steps.mode.outputs.mode != 'dry-run'
        env:
          SMARTLEAD_API_KEY: ${{ secrets.SMARTLEAD_API_KEY }}
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl --silent --show-error \
            --connect-timeout 10 \
            --max-time 180 \
            --output /tmp/smartlead-senders.json \
            --write-out '%{http_code}' \
            -X POST 'https://sdr.dashboardtalentera.tech/api/smartlead/sender-reconcile' \
            -H "Authorization: Bearer ${SMARTLEAD_API_KEY}" \
            -H 'Content-Type: application/json')

          jq '{ok, blocked, policy, providerMatching, lanes, providers, inventory, unclassified, warnings}' /tmp/smartlead-senders.json || cat /tmp/smartlead-senders.json

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Smartlead sender reconciliation returned HTTP $HTTP_CODE."
            cat /tmp/smartlead-senders.json || true
            exit 1
          fi
          if [ "$(jq -r '.blocked // false' /tmp/smartlead-senders.json)" = "true" ]; then
            echo "::error::Brand-safe sender reconciliation is blocked."
            cat /tmp/smartlead-senders.json || true
            exit 1
          fi

      - name: Verify all four Smartlead campaigns are structurally identical
        if: steps.mode.outputs.mode != 'dry-run'
        env:
          SMARTLEAD_API_KEY: ${{ secrets.SMARTLEAD_API_KEY }}
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl --silent --show-error \
            --connect-timeout 10 \
            --max-time 180 \
            --output /tmp/smartlead-parity.json \
            --write-out '%{http_code}' \
            -X POST 'https://sdr.dashboardtalentera.tech/api/smartlead/campaign-parity' \
            -H "Authorization: Bearer ${SMARTLEAD_API_KEY}" \
            -H 'Content-Type: application/json')

          jq '{ok, blocked, policy, canonical, campaigns, issues}' /tmp/smartlead-parity.json || cat /tmp/smartlead-parity.json
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Smartlead campaign parity gate failed (HTTP $HTTP_CODE)."
            cat /tmp/smartlead-parity.json || true
            exit 1
          fi
          if [ "$(jq -r '.blocked // false' /tmp/smartlead-parity.json)" = "true" ]; then
            echo "::error::Smartlead campaigns are not structurally identical."
            cat /tmp/smartlead-parity.json || true
            exit 1
          fi

      - name: Mark Smartlead execution successful
        if: success()
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          MODE: ${{ steps.mode.outputs.mode }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const mode = process.env.MODE || 'setup';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.TARGET_SHA,
              state: 'success',
              context: mode === 'dry-run' ? 'smartlead/dry-run' : mode === 'setup' ? 'smartlead/setup' : 'smartlead/autopilot',
              description: mode === 'dry-run'
                ? 'Read-only recipient routing sample verified'
                : mode === 'setup'
                  ? 'Sequences, sender pools and campaign parity verified'
                  : 'Language-safe verified Smartlead daily batch processed',
              target_url: process.env.RUN_URL,
            });

      - name: Mark Smartlead execution failed
        if: failure()
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          MODE: ${{ steps.mode.outputs.mode }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const mode = process.env.MODE || 'setup';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.TARGET_SHA,
              state: 'failure',
              context: mode === 'dry-run' ? 'smartlead/dry-run' : mode === 'setup' ? 'smartlead/setup' : 'smartlead/autopilot',
              description: mode === 'dry-run'
                ? 'Read-only recipient routing sample failed'
                : mode === 'setup'
                  ? 'Smartlead setup, sender routing or parity failed'
                  : 'Language-safe verified Smartlead daily batch failed',
              target_url: process.env.RUN_URL,
            });
