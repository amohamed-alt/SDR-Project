name: Smartlead Autopilot

on:
  workflow_run:
    workflows: ["Deploy SDR Dashboard to Hostinger"]
    types: [completed]
  schedule:
    # Asia/Riyadh is UTC+3 year-round. Three idempotent attempts make transient
    # HubSpot/API failures safe without ever queueing the same day twice.
    - cron: "45 5 * * 0-4" # 08:45 Riyadh, Sunday-Thursday
    - cron: "5 6 * * 0-4"  # 09:05 Riyadh, Sunday-Thursday
    - cron: "25 6 * * 0-4" # 09:25 Riyadh, Sunday-Thursday
  workflow_dispatch:
    inputs:
      mode:
        description: "Setup only or run today's safe batch"
        required: true
        default: "setup"
        type: choice
        options:
          - setup
          - autopilot

permissions:
  contents: read
  statuses: write

concurrency:
  group: smartlead-orchestrator-production
  cancel-in-progress: false

jobs:
  smartlead-orchestrator:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate Smartlead automation secret
        env:
          SMARTLEAD_API_KEY: ${{ secrets.SMARTLEAD_API_KEY }}
        run: |
          test -n "$SMARTLEAD_API_KEY" || {
            echo "::error::SMARTLEAD_API_KEY repository secret is required."
            exit 1
          }

      - name: Resolve safe execution mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            MODE="setup"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            MODE="autopilot"
          else
            MODE="${MANUAL_MODE:-setup}"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Smartlead orchestrator mode: $MODE"

      - name: Sync Smartlead campaigns or run daily batch
        env:
          SMARTLEAD_API_KEY: ${{ secrets.SMARTLEAD_API_KEY }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl --silent --show-error \
            --connect-timeout 10 \
            --max-time 300 \
            --output /tmp/smartlead-orchestrator.json \
            --write-out '%{http_code}' \
            -X POST 'https://sdr.dashboardtalentera.tech/api/smartlead/orchestrator-compat' \
            -H "Authorization: Bearer ${SMARTLEAD_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d "{\"mode\":\"${MODE}\"}")

          jq '{ok, mode, skipped, blocked, reason, activated, queued, campaigns, sequence, sendWindow, senders, capacity, analytics, state}' /tmp/smartlead-orchestrator.json || cat /tmp/smartlead-orchestrator.json

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Smartlead orchestrator returned HTTP $HTTP_CODE."
            cat /tmp/smartlead-orchestrator.json || true
            exit 1
          fi

      - name: Mark Smartlead execution successful
        if: success()
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          MODE: ${{ steps.mode.outputs.mode }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const mode = process.env.MODE || 'setup';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.TARGET_SHA,
              state: 'success',
              context: mode === 'setup' ? 'smartlead/setup' : 'smartlead/autopilot',
              description: mode === 'setup'
                ? 'Smartlead campaigns, sequences and sender pools synced'
                : 'Smartlead daily safe batch processed',
              target_url: process.env.RUN_URL,
            });

      - name: Mark Smartlead execution failed
        if: failure()
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          MODE: ${{ steps.mode.outputs.mode }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const mode = process.env.MODE || 'setup';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.TARGET_SHA,
              state: 'failure',
              context: mode === 'setup' ? 'smartlead/setup' : 'smartlead/autopilot',
              description: mode === 'setup'
                ? 'Smartlead setup sync failed'
                : 'Smartlead daily safe batch failed',
              target_url: process.env.RUN_URL,
            });
