name: HubSpot Current Package Property

on:
  push:
    paths:
      - '.github/workflows/hubspot-current-package.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hubspot-current-package-property
  cancel-in-progress: false

jobs:
  sync-property:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HUBSPOT_PRIVATE_APP_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
    steps:
      - name: Validate HubSpot secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HUBSPOT_PRIVATE_APP_TOKEN:-}" ]; then
            echo '::error::HUBSPOT_PRIVATE_APP_TOKEN is not configured.'
            exit 1
          fi

      - name: Create or update Current Package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          API_BASE = "https://api.hubapi.com"
          TOKEN = os.environ["HUBSPOT_PRIVATE_APP_TOKEN"]
          OBJECT_TYPE = "companies"
          LEGACY_NAME = "current_package"
          TARGET_NAME = "current_package_v2"
          TARGET_LABEL = "Current Package"
          DESCRIPTION = "Current active Evalufy package(s). Multiple selections are supported."

          LABELS = [
              "Assessment Enterprise Pro",
              "Assessment Professional Pro",
              "Assessment Standard Pro",
              "Assessment Starter Pro",
              "Assessment Enterprise Core",
              "Assessment Professional Core",
              "Assessment Standard Core",
              "Assessment Starter Core",
              "AI Interview Custom",
              "AI Interview Enterprise",
              "AI Interview Professional",
              "AI Interview Standard",
              "AI Interview Starter",
          ]

          OPTIONS = [
              {
                  "label": label,
                  "value": label,
                  "displayOrder": index,
                  "hidden": False,
              }
              for index, label in enumerate(LABELS)
          ]


          def request(method, path, payload=None, allow_not_found=False):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  f"{API_BASE}{path}",
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read().decode("utf-8")
                      return json.loads(body) if body else None
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", errors="replace")
                  if allow_not_found and error.code == 404:
                      return None
                  raise RuntimeError(
                      f"HubSpot API {method} {path} failed with HTTP {error.code}: {body[:1000]}"
                  ) from error


          def get_property(name):
              encoded = urllib.parse.quote(name, safe="")
              return request(
                  "GET",
                  f"/crm/v3/properties/{OBJECT_TYPE}/{encoded}",
                  allow_not_found=True,
              )


          def property_usage_count(name):
              response = request(
                  "POST",
                  f"/crm/v3/objects/{OBJECT_TYPE}/search",
                  {
                      "filterGroups": [
                          {
                              "filters": [
                                  {
                                      "propertyName": name,
                                      "operator": "HAS_PROPERTY",
                                  }
                              ]
                          }
                      ],
                      "properties": [name],
                      "limit": 1,
                  },
              )
              return int(response.get("total", 0))


          legacy = get_property(LEGACY_NAME)
          target_name = TARGET_NAME

          if legacy and legacy.get("type") == "enumeration":
              target_name = LEGACY_NAME
          elif legacy:
              usage_count = property_usage_count(LEGACY_NAME)
              if usage_count:
                  raise RuntimeError(
                      f"Refusing to replace legacy {LEGACY_NAME}: {usage_count} company records contain values."
                  )

          target = get_property(target_name)
          if target and target.get("type") != "enumeration":
              raise RuntimeError(
                  f"Target property {target_name} exists with incompatible type {target.get('type')}."
              )

          property_body = {
              "label": TARGET_LABEL,
              "description": DESCRIPTION,
              "groupName": "companyinformation",
              "type": "enumeration",
              "fieldType": "checkbox",
              "options": OPTIONS,
              "displayOrder": -1,
              "hasUniqueValue": False,
              "formField": False,
          }

          if target:
              request(
                  "PATCH",
                  f"/crm/v3/properties/{OBJECT_TYPE}/{urllib.parse.quote(target_name, safe='')}",
                  {
                      "label": property_body["label"],
                      "description": property_body["description"],
                      "groupName": property_body["groupName"],
                      "fieldType": property_body["fieldType"],
                      "options": property_body["options"],
                  },
              )
              action = "updated"
          else:
              property_body["name"] = target_name
              request("POST", f"/crm/v3/properties/{OBJECT_TYPE}", property_body)
              action = "created"

          if legacy and legacy.get("type") != "enumeration":
              request(
                  "PATCH",
                  f"/crm/v3/properties/{OBJECT_TYPE}/{urllib.parse.quote(LEGACY_NAME, safe='')}",
                  {
                      "label": "Current Package (Legacy Text)",
                      "description": "Unused legacy text field. Use Current Package instead.",
                      "groupName": legacy.get("groupName", "companyinformation"),
                  },
              )

          verified = get_property(target_name)
          actual_labels = [
              option["label"]
              for option in sorted(
                  [option for option in verified.get("options", []) if not option.get("hidden")],
                  key=lambda option: option.get("displayOrder", 0),
              )
          ]

          if verified.get("label") != TARGET_LABEL:
              raise RuntimeError(f"Unexpected label: {verified.get('label')}")
          if verified.get("type") != "enumeration" or verified.get("fieldType") != "checkbox":
              raise RuntimeError(
                  f"Unexpected property type: {verified.get('type')}/{verified.get('fieldType')}"
              )
          if actual_labels != LABELS:
              raise RuntimeError(f"Option verification failed: {actual_labels}")

          print(
              json.dumps(
                  {
                      "status": "verified",
                      "action": action,
                      "objectType": OBJECT_TYPE,
                      "propertyName": target_name,
                      "label": verified["label"],
                      "fieldType": verified["fieldType"],
                      "optionCount": len(actual_labels),
                      "options": actual_labels,
                  },
                  indent=2,
              )
          )
          PY
