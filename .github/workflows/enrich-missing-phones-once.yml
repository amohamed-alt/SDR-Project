name: One-Time SignalHire Missing Phone Enrichment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enrich-missing-phones-once.yml'

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Validate worker credential
        env:
          WORKER_KEY: ${{ secrets.SIGNALHIRE_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$WORKER_KEY" || {
            echo "::error::SIGNALHIRE_API_KEY is required."
            exit 1
          }

      - name: Wait for this exact build to reach production
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          HOST='https://sdr.dashboardtalentera.tech'
          READY=false
          for ATTEMPT in $(seq 1 80); do
            BODY=$(curl --silent --show-error \
              --connect-timeout 8 \
              --max-time 15 \
              -H 'Cache-Control: no-cache' \
              "${HOST}/api/health?ts=$(date +%s)" || true)
            BUILD_REF=$(printf '%s' "$BODY" | jq -r '.buildRef // empty' 2>/dev/null || true)
            if [ "$BUILD_REF" = "$TARGET_SHA" ]; then
              READY=true
              echo "Exact production build is live: $BUILD_REF"
              break
            fi
            echo "Production build ${BUILD_REF:-unavailable}; target $TARGET_SHA (attempt $ATTEMPT)."
            sleep 15
          done
          if [ "$READY" != "true" ]; then
            echo "::error::Exact production build did not become available during this run."
            exit 1
          fi

      - name: Enrich eligible missing-phone contacts
        env:
          WORKER_KEY: ${{ secrets.SIGNALHIRE_API_KEY }}
        run: |
          set -euo pipefail
          ENDPOINT='https://sdr.dashboardtalentera.tech/api/hubspot/enrich-missing-phones'
          HTTP_CODE=$(curl --silent --show-error \
            --connect-timeout 10 \
            --max-time 1800 \
            --output /tmp/signalhire-phone-enrichment.json \
            --write-out '%{http_code}' \
            -X POST "$ENDPOINT" \
            -H 'Content-Type: application/json' \
            -H "x-acquisition-worker-key: $WORKER_KEY" \
            -d '{"execute":true,"limit":50,"scanLimit":1000,"createdAfter":"2026-07-10T00:00:00.000Z","retryPreviouslyEnriched":false}' || true)

          echo "Enrichment HTTP: ${HTTP_CODE:-none}"
          jq '{status,mode,createdAfter,totals,skippedBeforeSignalHire,creditsLeft,error}' /tmp/signalhire-phone-enrichment.json \
            || cat /tmp/signalhire-phone-enrichment.json

          echo 'RESULT_IDS_BEGIN'
          jq -r '.outcomes[]? | [.contactId, .status] | @tsv' /tmp/signalhire-phone-enrichment.json || true
          echo 'RESULT_IDS_END'

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Missing-phone enrichment failed."
            exit 1
          fi

          STATUS=$(jq -r '.status // "unknown"' /tmp/signalhire-phone-enrichment.json 2>/dev/null || echo unknown)
          if [ "$STATUS" != "completed" ]; then
            echo "::error::Unexpected enrichment status: $STATUS"
            exit 1
          fi
