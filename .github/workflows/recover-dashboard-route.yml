name: Recover SDR Dashboard Route

on:
  push:
    branches: [main]
    paths:
      - "ops/sdr-route-recovery.compose.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    concurrency:
      group: hostinger-sdr-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy recovery route
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
          virtual-machine: "1604210"
          project-name: sdr-route-recovery
          docker-compose-path: ops/sdr-route-recovery.compose.yml

      - name: Verify public dashboard route
        run: |
          set -euo pipefail
          URL='https://sdr.dashboardtalentera.tech/api/health'
          for ATTEMPT in $(seq 1 20); do
            HTTP_CODE=$(curl --silent --show-error \
              --connect-timeout 4 \
              --max-time 10 \
              --output /tmp/sdr-health.json \
              --write-out '%{http_code}' \
              "$URL?recovery_attempt=$ATTEMPT" || true)

            BUILD_REF=$(jq -r '.buildRef // ""' /tmp/sdr-health.json 2>/dev/null || true)
            echo "Recovery gate ${ATTEMPT}/20: HTTP ${HTTP_CODE}, build=${BUILD_REF:-unknown}"

            if [ "$HTTP_CODE" = "200" ]; then
              cat /tmp/sdr-health.json
              exit 0
            fi

            sleep 10
          done

          echo "::error::Dashboard route did not recover within the verification window."
          cat /tmp/sdr-health.json 2>/dev/null || true
          exit 1

# recovery trigger: 2026-09-01T09:30+03:00
