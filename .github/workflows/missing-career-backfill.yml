name: Missing Career Page + ATS Backfill

on:
  workflow_dispatch:

concurrency:
  group: missing-career-backfill-production
  cancel-in-progress: false

jobs:
  status-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Report production missing Career Page queue without writing
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DASHBOARD_PASSWORD" || {
            echo "::error::DASHBOARD_PASSWORD is required to read the production Career Page queue."
            exit 1
          }

          BASE='https://sdr.dashboardtalentera.tech/api/missing-career-backfill'
          AUTH="talentera:${DASHBOARD_PASSWORD}"
          curl --fail --silent --show-error --user "$AUTH" --max-time 30 "$BASE"
          echo
          echo "Automatic HubSpot writes are disabled. Use manually verified CRM updates only."
