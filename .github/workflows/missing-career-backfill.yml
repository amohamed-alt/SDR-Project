name: Missing Career Page + ATS Backfill

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/lib/missing-career-backfill.ts"
      - "src/app/api/missing-career-backfill/**"
      - ".github/workflows/missing-career-backfill.yml"
  schedule:
    - cron: "17 */3 * * *"

concurrency:
  group: missing-career-backfill-production
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Wait for production route and process up to 300 missing Career Pages
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DASHBOARD_PASSWORD" || {
            echo "::error::DASHBOARD_PASSWORD is required to run the production Career Page backfill."
            exit 1
          }

          BASE='https://sdr.dashboardtalentera.tech/api/missing-career-backfill'
          AUTH="talentera:${DASHBOARD_PASSWORD}"
          READY=false

          for ATTEMPT in $(seq 1 40); do
            CODE=$(curl --silent --show-error \
              --user "$AUTH" \
              --connect-timeout 5 \
              --max-time 30 \
              --output /tmp/missing-career-status.json \
              --write-out '%{http_code}' \
              "$BASE" || true)
            echo "Missing Career Page route ${ATTEMPT}/40: HTTP ${CODE:-none}"
            if [ "$CODE" = "200" ]; then
              READY=true
              break
            fi
            sleep 15
          done

          if [ "$READY" != "true" ]; then
            echo "::error::Production missing Career Page route never became ready."
            cat /tmp/missing-career-status.json 2>/dev/null || true
            exit 1
          fi

          echo "Initial queue:"
          cat /tmp/missing-career-status.json
          echo

          REMAINING=$(jq -r '.remainingMissingCareer // -1' /tmp/missing-career-status.json)
          if [ "$REMAINING" = "0" ]; then
            echo "Missing Career Page backfill is already complete."
            exit 0
          fi

          for BATCH in 1 2 3; do
            echo "Starting missing Career Page + ATS batch ${BATCH}/3 (up to 100 companies)..."
            CODE=$(curl --silent --show-error \
              --user "$AUTH" \
              --connect-timeout 10 \
              --max-time 5400 \
              --output "/tmp/missing-career-batch-${BATCH}.json" \
              --write-out '%{http_code}' \
              -X POST "$BASE" \
              -H 'Content-Type: application/json' \
              -d '{"limit":100}' || true)

            if [ "$CODE" = "409" ]; then
              echo "Another backfill batch is active; leaving the current production worker in control."
              cat "/tmp/missing-career-batch-${BATCH}.json" || true
              exit 0
            fi

            if [ "$CODE" != "200" ]; then
              echo "::error::Missing Career Page batch ${BATCH} failed with HTTP ${CODE}."
              cat "/tmp/missing-career-batch-${BATCH}.json" || true
              exit 1
            fi

            jq '{summary}' "/tmp/missing-career-batch-${BATCH}.json" || cat "/tmp/missing-career-batch-${BATCH}.json"
            REMAINING=$(jq -r '.summary.remainingMissingCareer // -1' "/tmp/missing-career-batch-${BATCH}.json")
            if [ "$REMAINING" = "0" ]; then
              echo "All missing Career Page records are finalized."
              exit 0
            fi

            sleep 10
          done

          echo "Final status after this workflow cycle:"
          curl --fail --silent --show-error --user "$AUTH" --max-time 30 "$BASE"
          echo
