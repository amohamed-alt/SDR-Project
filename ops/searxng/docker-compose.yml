name: sdr-searxng

services:
  searxng-valkey:
    image: docker.io/valkey/valkey:8-alpine
    restart: unless-stopped
    command:
      - valkey-server
      - --save
      - "30"
      - "1"
      - --loglevel
      - warning
    volumes:
      - searxng_valkey:/data
    networks:
      - research_private
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 10

  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    depends_on:
      searxng-valkey:
        condition: service_healthy
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://127.0.0.1:8088/}
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET must be set in ops/searxng/.env}
      SEARXNG_VALKEY_URL: valkey://searxng-valkey:6379/0
    ports:
      - "127.0.0.1:${SEARXNG_HOST_PORT:-8088}:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - searxng_cache:/var/cache/searxng
    networks:
      - research_private
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5

networks:
  research_private:
    driver: bridge

volumes:
  searxng_valkey:
  searxng_cache:
