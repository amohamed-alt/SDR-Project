# Talentera GTM Search — SearXNG settings
# This file intentionally inherits upstream defaults and only overrides the
# behavior needed for an internal SDR research instance.

use_default_settings: true

general:
  debug: false
  instance_name: "Talentera GTM Search"

search:
  formats:
    - html
    - json

server:
  # Overridden at runtime by SEARXNG_SECRET.
  secret_key: "override-with-SEARXNG_SECRET"
  # Keep the internal instance protected from abusive traffic. The limiter
  # uses Valkey configured below.
  limiter: true
  # Image proxy is unnecessary for the internal JSON research use case.
  image_proxy: false

valkey:
  # Overridden at runtime by SEARXNG_VALKEY_URL when supplied.
  url: valkey://searxng-valkey:6379/0
