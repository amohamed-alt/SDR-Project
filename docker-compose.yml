name: sdr-project

services:
  runtime-bootstrap:
    image: alpine:3.21
    restart: "no"
    command:
      - /bin/sh
      - -c
      - |
        set -eu

        ENV_TARGET=/runtime-env/.env
        DATA_MARKER=/runtime-data/.sdr-runtime-data-v1

        if [ ! -s "$$ENV_TARGET" ]; then
          if [ ! -s /legacy/.env ]; then
            echo "FATAL: /root/SDR-Project/.env is missing; cannot bootstrap persistent runtime env." >&2
            exit 78
          fi
          umask 077
          cp /legacy/.env "$$ENV_TARGET.tmp"
          chown 1001:1001 "$$ENV_TARGET.tmp"
          chmod 0400 "$$ENV_TARGET.tmp"
          mv "$$ENV_TARGET.tmp" "$$ENV_TARGET"
          echo "Persistent SDR runtime env initialized."
        else
          echo "Persistent SDR runtime env already initialized; preserving existing secrets."
        fi

        if [ ! -e "$$DATA_MARKER" ]; then
          if [ -d /legacy/data ]; then
            cp -a /legacy/data/. /runtime-data/ 2>/dev/null || true
          fi
          chown -R 1001:1001 /runtime-data
          touch "$$DATA_MARKER"
          chown 1001:1001 "$$DATA_MARKER"
          echo "Persistent SDR data volume initialized."
        else
          echo "Persistent SDR data volume already initialized."
        fi
    volumes:
      - /root/SDR-Project:/legacy:ro
      - sdr_runtime_env:/runtime-env
      - sdr_app_data:/runtime-data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: "768m"
    cpus: 1.0
    pids_limit: 128
    environment:
      POSTGRES_DB: sdr
      POSTGRES_USER: sdr
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - sdr_postgres_data:/var/lib/postgresql/data
    networks:
      - data_private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdr -d sdr"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 10

  dashboard-cache-api:
    build:
      context: ./services/dashboard-cache
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: "768m"
    cpus: 1.0
    pids_limit: 128
    environment:
      DASHBOARD_CACHE_DB_PATH: /data/dashboard-cache.sqlite3
      DASHBOARD_CACHE_MAX_ENTRIES: 250
      DASHBOARD_CACHE_RETENTION_SECONDS: 604800
      DASHBOARD_CACHE_MAX_PAYLOAD_BYTES: 16777216
      USAGE_DATABASE_URL: postgresql://sdr@postgres:5432/sdr
    volumes:
      - sdr_dashboard_cache:/data
    networks:
      - default
      - data_private
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 20s
      timeout: 5s
      start_period: 15s
      retries: 5

  sdr-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      runtime-bootstrap:
        condition: service_completed_successfully
      dashboard-cache-api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      SDR_BUILD_REF: ${SDR_BUILD_REF:-unknown}
      SIGNALHIRE_API_KEY: ${SIGNALHIRE_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      APOLLO_API_KEY: ${APOLLO_API_KEY:-}
      ACQUISITION_OWNER_TOKEN: ${ACQUISITION_OWNER_TOKEN:-}
      ACQUISITION_OWNER_IDS: ${ACQUISITION_OWNER_IDS:-31644369,76369997,31558980,76370000,76369995,76369998}
      ACQUISITION_OWNER_WEIGHTS: ${ACQUISITION_OWNER_WEIGHTS:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_FAST_MODEL: ${OPENROUTER_FAST_MODEL:-openai/gpt-4.1-nano}
      OPENROUTER_DEEP_MODEL: ${OPENROUTER_DEEP_MODEL:-openai/gpt-4.1-mini}
      SMARTLEAD_API_KEY: ${SMARTLEAD_API_KEY:-}
      SMARTLEAD_CAMPAIGN_ID: ${SMARTLEAD_CAMPAIGN_ID:-}
      SMARTLEAD_CAMPAIGN_NAME: "${SMARTLEAD_CAMPAIGN_NAME:-Talentera | Marita SDR | Localized 3-Touch}"
      SMARTLEAD_DAILY_NEW_LEADS: ${SMARTLEAD_DAILY_NEW_LEADS:-75}
      SMARTLEAD_SALES_ACTIVITY_LOOKBACK_DAYS: ${SMARTLEAD_SALES_ACTIVITY_LOOKBACK_DAYS:-45}
      SMARTLEAD_START_HOUR: ${SMARTLEAD_START_HOUR:-09:30}
      SMARTLEAD_END_HOUR: ${SMARTLEAD_END_HOUR:-16:30}
      SMARTLEAD_MIN_TIME_BETWEEN_EMAILS: ${SMARTLEAD_MIN_TIME_BETWEEN_EMAILS:-5}
      SMARTLEAD_PREPARED_PATH: /app/data/smartlead-prepared.json
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CAREER_MODEL: ${GEMINI_CAREER_MODEL:-gemini-2.5-flash-lite}
      CAREER_GENERATION: v3
      SDR_RUNTIME_ENV_FILE: /run/sdr-env/.env
      DASHBOARD_CACHE_API_URL: http://dashboard-cache-api:8000
      DASHBOARD_CACHE_READ_TIMEOUT_MS: 700
      DASHBOARD_CACHE_WRITE_TIMEOUT_MS: 2000
      ACQUISITION_SNAPSHOT_PATH: /app/data/acquisition-dashboard.json
      GOOGLE_TOKEN_STORE_PATH: /app/data/google-calendar.json
      HIRING_SNAPSHOT_PATH: /app/data/hiring-signals.json
      HIRING_SCAN_LIMIT: 160
      HIRING_SCAN_CONCURRENCY: 10
      CAREER_INTELLIGENCE_STORE_PATH: /app/data/career-intelligence-v3.json
      CAREER_VALIDATION_MARKER_PATH: /app/data/career-validation-v3.done
      CAREER_VALIDATION_STATE_PATH: /app/data/career-validation-v3.state
      CAREER_ENGINE_URL: http://gtm-career-browser:3000/intelligence-detect
      CAREER_ENGINE_TIMEOUT_MS: 180000
      CAREER_SCAN_LIMIT: 30
      CAREER_SCAN_CONCURRENCY: 6
      CAREER_PORTFOLIO_CACHE_MS: 30000
      CAREER_AUTO_PUSH: ${CAREER_AUTO_PUSH:-true}
    ports:
      - "127.0.0.1:3010:3000"
    volumes:
      - sdr_runtime_env:/run/sdr-env:ro
      - sdr_app_data:/app/data
    networks:
      - default
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.routers.sdr-dashboard.rule=Host(`sdr.dashboardtalentera.tech`)"
      - "traefik.http.routers.sdr-dashboard.entrypoints=websecure"
      - "traefik.http.routers.sdr-dashboard.tls=true"
      - "traefik.http.routers.sdr-dashboard.tls.certresolver=mytlschallenge"
      - "traefik.http.services.sdr-dashboard.loadbalancer.server.port=3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 8s
      start_period: 30s
      retries: 5

  dashboard-warmer:
    image: alpine:3.21
    restart: unless-stopped
    depends_on:
      runtime-bootstrap:
        condition: service_completed_successfully
      dashboard-cache-api:
        condition: service_healthy
      sdr-dashboard:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        set -a
        if [ -s /run/sdr-env/.env ]; then . /run/sdr-env/.env; fi
        set +a

        INTERVAL="$${DASHBOARD_WARM_INTERVAL_SECONDS:-300}"
        OWNERS="$${DASHBOARD_WARM_OWNER_IDS:-$${DEFAULT_SDR_OWNER_ID:-31644369}}"
        FROM="$${NEXT_PUBLIC_DEFAULT_START_DATE:-$$(date -u +%Y-%m-01)}"

        sleep 8
        while true; do
          TODAY="$$(date -u +%F)"
          for OWNER in $$(printf '%s' "$$OWNERS" | tr ',' ' '); do
            [ -n "$$OWNER" ] || continue
            URL="http://sdr-dashboard:3000/api/dashboard?from=$${FROM}&to=$${TODAY}&ownerId=$${OWNER}&refresh=1"
            if wget -qO- --timeout=180 "$$URL" >/dev/null; then
              echo "Warmed dashboard snapshot for owner $$OWNER ($$FROM → $$TODAY)."
            else
              echo "Dashboard warm request failed for owner $$OWNER; keeping the last persistent snapshot."
            fi
          done
          sleep "$$INTERVAL"
        done
    volumes:
      - sdr_runtime_env:/run/sdr-env:ro
    networks:
      - default

  career-judge-ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    mem_limit: "8g"
    cpus: 3.0
    pids_limit: 512
    environment:
      OLLAMA_KEEP_ALIVE: 30s
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
    volumes:
      - career_judge_models:/root/.ollama
    networks:
      - traefik_proxy
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 8s
      start_period: 20s
      retries: 10

  career-judge-model-init:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      career-judge-ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://career-judge-ollama:11434
    command: ["pull", "qwen3:8b"]
    networks:
      - traefik_proxy

  gtm-career-browser:
    build:
      context: ./services/career-browser
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    shm_size: "2gb"
    mem_limit: "3g"
    cpus: 3.0
    pids_limit: 768
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined
    environment:
      PORT: 3000
      CACHE_FILE: /data/cache-v3.json
      CACHE_TTL_DAYS: 30
      MAX_STATIC_PAGES: 36
      MAX_BROWSER_STEPS: 12
      MAX_BROWSER_CONTEXTS: 4
      REQUEST_TIMEOUT_MS: 10000
      BROWSER_TIMEOUT_MS: 50000
      AI_JUDGE_ENABLED: "true"
      OLLAMA_URL: http://career-judge-ollama:11434/api/chat
      OLLAMA_MODEL: qwen3:8b
      AI_JUDGE_TIMEOUT_MS: 90000
      AI_JUDGE_AUDIT_PERCENT: 5
      AI_JUDGE_MIN_RULE_SCORE: 92
    volumes:
      - career_browser_cache:/data
    networks:
      - traefik_proxy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(async r=>{const j=await r.json();if(!r.ok||!j.capabilities?.includes('career-v3')||!j.capabilities?.includes('ats-detect'))process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 8s
      start_period: 45s
      retries: 5

  hiring-refresh:
    image: alpine:3.21
    restart: unless-stopped
    depends_on:
      runtime-bootstrap:
        condition: service_completed_successfully
      sdr-dashboard:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        sleep 5
        while true; do
          wget -qO- --timeout=300 --post-data='' http://sdr-dashboard:3000/api/hiring/refresh || true
          sleep 900
        done
    networks:
      - default

  career-validation:
    image: alpine:3.21
    restart: "no"
    depends_on:
      runtime-bootstrap:
        condition: service_completed_successfully
      sdr-dashboard:
        condition: service_healthy
      gtm-career-browser:
        condition: service_healthy
      career-judge-model-init:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        MARKER=/data/career-validation-v3.done
        STATE=/data/career-validation-v3.state
        MAX_ATTEMPTS=3
        ATTEMPT=1

        if [ -f "$$MARKER" ]; then
          printf 'completed:%s\n' "$$(cat "$$MARKER" 2>/dev/null || true)" > "$$STATE"
          echo "Career + ATS validation batch v3 already completed."
          exit 0
        fi

        while [ "$$ATTEMPT" -le "$$MAX_ATTEMPTS" ]; do
          printf 'started:attempt-%s:%s\n' "$$ATTEMPT" "$$(date -u +%FT%TZ)" > "$$STATE"
          echo "Running Career + ATS Intelligence V3 validation batch (10 companies), attempt $$ATTEMPT/$$MAX_ATTEMPTS..."

          if wget -qO /tmp/career-validation.json --timeout=1800 \
            --header='Content-Type: application/json' \
            --post-data='{"limit":10,"forceRefresh":true}' \
            http://sdr-dashboard:3000/api/career-intelligence/run; then
            cat /tmp/career-validation.json
            date -u +%FT%TZ > "$$MARKER"
            printf 'completed:%s\n' "$$(cat "$$MARKER")" > "$$STATE"
            echo "Career + ATS validation batch v3 completed."
            exit 0
          else
            CODE=$$?
            printf 'failed:attempt-%s:code-%s:%s\n' "$$ATTEMPT" "$$CODE" "$$(date -u +%FT%TZ)" > "$$STATE"

            if [ "$$ATTEMPT" -ge "$${MAX_ATTEMPTS}" ]; then
              echo "Career + ATS validation V3 stopped after $$MAX_ATTEMPTS failed attempts; manual review is required."
              exit "$$CODE"
            fi

            if [ "$$ATTEMPT" -eq 1 ]; then
              WAIT_SECONDS=30
            else
              WAIT_SECONDS=120
            fi
            echo "Validation attempt failed with exit $$CODE; waiting $$WAIT_SECONDS seconds before the next bounded retry."
            sleep "$$WAIT_SECONDS"
            ATTEMPT=$$((ATTEMPT + 1))
          fi
        done
    volumes:
      - sdr_app_data:/data
    networks:
      - default

  career-refresh:
    image: alpine:3.21
    restart: unless-stopped
    depends_on:
      runtime-bootstrap:
        condition: service_completed_successfully
      sdr-dashboard:
        condition: service_healthy
      gtm-career-browser:
        condition: service_healthy
      career-validation:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -c
      - |
        set -a
        . /run/sdr-env/.env
        set +a
        CAREER_AUTO_SCAN_ENABLED="$${CAREER_AUTO_SCAN_ENABLED:-true}"
        CAREER_SCAN_LIMIT="$${CAREER_SCAN_LIMIT:-30}"
        CAREER_AUTO_SCAN_INTERVAL_SECONDS="$${CAREER_V2_SCAN_INTERVAL_SECONDS:-60}"
        CAREER_AUTO_SCAN_IDLE_SECONDS="$${CAREER_V2_IDLE_SECONDS:-3600}"
        CAREER_AUTO_SCAN_ERROR_INTERVAL_SECONDS="$${CAREER_V2_ERROR_INTERVAL_SECONDS:-300}"
        CAREER_AUTO_SCAN_MAX_ERROR_INTERVAL_SECONDS="$${CAREER_V2_MAX_ERROR_INTERVAL_SECONDS:-1800}"
        ERROR_SLEEP="$$CAREER_AUTO_SCAN_ERROR_INTERVAL_SECONDS"

        if [ "$$CAREER_AUTO_SCAN_ENABLED" != "true" ]; then
          echo "Career + ATS V3 auto scan disabled by runtime configuration."
          while true; do sleep 3600; done
        fi

        sleep 8
        while true; do
          RESULT="$$(wget -qO- --timeout=1800 \
            --header='Content-Type: application/json' \
            --post-data="{\"limit\":$${CAREER_SCAN_LIMIT},\"forceRefresh\":true}" \
            http://sdr-dashboard:3000/api/career-intelligence/run 2>&1)"
          CODE=$$?

          if [ "$$CODE" -ne 0 ]; then
            echo "Career + ATS V3 scan request failed with exit $$CODE; backing off for $$ERROR_SLEEP seconds."
            printf '%s\n' "$$RESULT"
            sleep "$$ERROR_SLEEP"
            NEXT_ERROR_SLEEP=$$((ERROR_SLEEP * 2))
            if [ "$$NEXT_ERROR_SLEEP" -gt "$$CAREER_AUTO_SCAN_MAX_ERROR_INTERVAL_SECONDS" ]; then
              NEXT_ERROR_SLEEP="$$CAREER_AUTO_SCAN_MAX_ERROR_INTERVAL_SECONDS"
            fi
            ERROR_SLEEP="$$NEXT_ERROR_SLEEP"
            continue
          fi

          ERROR_SLEEP="$$CAREER_AUTO_SCAN_ERROR_INTERVAL_SECONDS"
          printf '%s\n' "$$RESULT"
          if printf '%s' "$$RESULT" | grep -q '"remainingEligible":0'; then
            echo "Career + ATS Intelligence V3 backfill complete; entering low-frequency idle mode."
            sleep "$$CAREER_AUTO_SCAN_IDLE_SECONDS"
          else
            sleep "$$CAREER_AUTO_SCAN_INTERVAL_SECONDS"
          fi
        done
    volumes:
      - sdr_runtime_env:/run/sdr-env:ro
    networks:
      - default

volumes:
  sdr_runtime_env:
    name: sdr_runtime_env
  sdr_app_data:
    name: sdr_app_data
  sdr_dashboard_cache:
    name: sdr_dashboard_cache
  sdr_postgres_data:
    name: sdr_postgres_data
  career_browser_cache:
    name: sdr_career_browser_cache
  career_judge_models:
    name: sdr_career_judge_models

networks:
  data_private:
    internal: true
  traefik_proxy:
    external: true
    name: n8n_default