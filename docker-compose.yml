name: sdr-project

services:
  sdr-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - /root/SDR-Project/.env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      ACQUISITION_SNAPSHOT_PATH: /app/data/acquisition-dashboard.json
      GOOGLE_TOKEN_STORE_PATH: /app/data/google-calendar.json
      HIRING_SNAPSHOT_PATH: /app/data/hiring-signals.json
      HIRING_SCAN_LIMIT: ${HIRING_SCAN_LIMIT:-400}
      HIRING_SCAN_CONCURRENCY: ${HIRING_SCAN_CONCURRENCY:-8}
    ports:
      - "127.0.0.1:3010:3000"
    volumes:
      - /root/SDR-Project/data:/app/data
    networks:
      - default
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.routers.sdr-dashboard.rule=Host(`sdr.dashboardtalentera.tech`)"
      - "traefik.http.routers.sdr-dashboard.entrypoints=websecure"
      - "traefik.http.routers.sdr-dashboard.tls=true"
      - "traefik.http.routers.sdr-dashboard.tls.certresolver=mytlschallenge"
      - "traefik.http.services.sdr-dashboard.loadbalancer.server.port=3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 8s
      start_period: 30s
      retries: 5

  hiring-refresh:
    image: alpine:3.21
    restart: unless-stopped
    depends_on:
      sdr-dashboard:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        sleep 20
        while true; do
          wget -qO- --timeout=300 --post-data='' http://sdr-dashboard:3000/api/hiring/refresh || true
          sleep 21600
        done
    networks:
      - default

networks:
  traefik_proxy:
    external: true
    name: n8n_default
