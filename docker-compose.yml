name: sdr-project

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  runtime-bootstrap:
    image: alpine:3.21
    restart: "no"
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        ENV_TARGET=/runtime-env/.env
        DATA_MARKER=/runtime-data/.sdr-runtime-data-v1

        if [ ! -s "$$ENV_TARGET" ]; then
          if [ ! -s /legacy/.env ]; then
            echo "FATAL: runtime env is missing and no legacy bootstrap file exists." >&2
            exit 78
          fi
          umask 077
          cp /legacy/.env "$$ENV_TARGET.tmp"
          chown 1001:1001 "$$ENV_TARGET.tmp"
          chmod 0400 "$$ENV_TARGET.tmp"
          mv "$$ENV_TARGET.tmp" "$$ENV_TARGET"
        fi

        # Permanently strip cancelled outreach vendors from the persisted runtime env.
        # Never print the file: it contains production secrets.
        if [ -s "$$ENV_TARGET" ]; then
          sed -i -E '/^(SMARTLEAD_|PRIMEFORGE_|PRIME_FORGE_|CLEARBIT_|NEVERBOUNCE_)/d' "$$ENV_TARGET"
          chown 1001:1001 "$$ENV_TARGET"
          chmod 0400 "$$ENV_TARGET"
        fi

        if [ ! -e "$$DATA_MARKER" ]; then
          if [ -d /legacy/data ]; then
            cp -a /legacy/data/. /runtime-data/ 2>/dev/null || true
          fi
          chown -R 1001:1001 /runtime-data
          touch "$$DATA_MARKER"
          chown 1001:1001 "$$DATA_MARKER"
        fi
    volumes:
      - /root/SDR-Project:/legacy:ro
      - sdr_runtime_env:/runtime-env
      - sdr_app_data:/runtime-data
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: "512m"
    cpus: 0.50
    pids_limit: 128
    environment:
      POSTGRES_DB: sdr
      POSTGRES_USER: sdr
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - sdr_postgres_data:/var/lib/postgresql/data
    networks:
      - data_private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdr -d sdr"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 5
    logging: *default-logging

  dashboard-cache-api:
    build:
      context: ./services/dashboard-cache
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: "512m"
    cpus: 0.35
    pids_limit: 128
    environment:
      DASHBOARD_CACHE_DB_PATH: /data/dashboard-cache.sqlite3
      DASHBOARD_CACHE_MAX_ENTRIES: 250
      DASHBOARD_CACHE_RETENTION_SECONDS: 604800
      DASHBOARD_CACHE_MAX_PAYLOAD_BYTES: 16777216
      USAGE_DATABASE_URL: postgresql://sdr@postgres:5432/sdr
    volumes:
      - sdr_dashboard_cache:/data
    networks:
      - default
      - data_private
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 60s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging: *default-logging

  sdr-dashboard:
    image: sdr-dashboard:${SDR_BUILD_REF:-unknown}
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      runtime-bootstrap:
        condition: service_completed_successfully
      dashboard-cache-api:
        condition: service_healthy
    mem_limit: "1536m"
    cpus: 1.00
    pids_limit: 384
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      SDR_BUILD_REF: ${SDR_BUILD_REF:-unknown}
      SIGNALHIRE_API_KEY: ${SIGNALHIRE_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      APOLLO_API_KEY: ${APOLLO_API_KEY:-}
      MILLIONVERIFIER_API_KEY: ${MILLIONVERIFIER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ACQUISITION_OWNER_TOKEN: ${ACQUISITION_OWNER_TOKEN:-}
      ACQUISITION_OWNER_IDS: ${ACQUISITION_OWNER_IDS:-31644369,76369997,31558980,76370000,76369995,76369998}
      ACQUISITION_OWNER_WEIGHTS: ${ACQUISITION_OWNER_WEIGHTS:-}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-talentera}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      SDR_ADMIN_PASSWORD: ${SDR_ADMIN_PASSWORD:-}
      DISABLE_AUTH: "true"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_FAST_MODEL: ${OPENROUTER_FAST_MODEL:-openai/gpt-4.1-nano}
      OPENROUTER_DEEP_MODEL: ${OPENROUTER_DEEP_MODEL:-openai/gpt-4.1-mini}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://sdr.dashboardtalentera.tech/api/google/callback}
      GOOGLE_TOKEN_ENCRYPTION_KEY: ${GOOGLE_TOKEN_ENCRYPTION_KEY:-}
      MARITA_GOOGLE_EMAIL: ${MARITA_GOOGLE_EMAIL:-m.chedid@talentera.com}
      ABDULLAH_GOOGLE_EMAIL: ${ABDULLAH_GOOGLE_EMAIL:-a.mohamed@talentera.com}
      HUBSPOT_PRIVATE_APP_TOKEN: ${HUBSPOT_PRIVATE_APP_TOKEN:-}
      SDR_RUNTIME_ENV_FILE: /run/sdr-env/.env
      DASHBOARD_CACHE_API_URL: http://dashboard-cache-api:8000
      DASHBOARD_CACHE_READ_TIMEOUT_MS: 700
      DASHBOARD_CACHE_WRITE_TIMEOUT_MS: 2000
      ACQUISITION_SNAPSHOT_PATH: /app/data/acquisition-dashboard.json
      GOOGLE_TOKEN_STORE_PATH: /app/data/google-calendar.json
    expose:
      - "3000"
    volumes:
      - sdr_runtime_env:/run/sdr-env:ro
      - sdr_app_data:/app/data
    networks:
      - default
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.routers.sdr-dashboard.rule=Host(`sdr.dashboardtalentera.tech`)"
      - "traefik.http.routers.sdr-dashboard.entrypoints=websecure"
      - "traefik.http.routers.sdr-dashboard.priority=100"
      - "traefik.http.routers.sdr-dashboard.tls=true"
      - "traefik.http.routers.sdr-dashboard.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.sdr-dashboard.service=sdr-dashboard"
      - "traefik.http.routers.sdr-dashboard.middlewares=sdr-compress"
      - "traefik.http.middlewares.sdr-compress.compress=true"
      - "traefik.http.services.sdr-dashboard.loadbalancer.server.port=3000"
      - "traefik.http.services.sdr-dashboard.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.sdr-dashboard.loadbalancer.healthcheck.interval=30s"
      - "traefik.http.services.sdr-dashboard.loadbalancer.healthcheck.timeout=5s"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      start_period: 45s
      retries: 3
    logging: *default-logging

  maqsam-sync:
    image: sdr-dashboard:${SDR_BUILD_REF:-unknown}
    pull_policy: never
    restart: unless-stopped
    init: true
    depends_on:
      sdr-dashboard:
        condition: service_healthy
    mem_limit: "256m"
    cpus: 0.20
    pids_limit: 96
    environment:
      NODE_ENV: production
      SDR_WORKER: maqsam-sync
      SDR_RUNTIME_ENV_FILE: /run/sdr-env/.env
      SDR_DASHBOARD_INTERNAL_URL: http://sdr-dashboard:3000
      MAQSAM_INGEST_SECRET: ${MAQSAM_INGEST_SECRET:-}
      MAQSAM_BASIC_AUTH: ${MAQSAM_BASIC_AUTH:-}
      MAQSAM_ACCESS_KEY: ${MAQSAM_ACCESS_KEY:-}
      MAQSAM_ACCESS_SECRET: ${MAQSAM_ACCESS_SECRET:-}
      MAQSAM_TARGET_AGENT_EMAIL: ${MAQSAM_TARGET_AGENT_EMAIL:-m.chedid@bayt.net}
      MAQSAM_SYNC_INTERVAL_SECONDS: ${MAQSAM_SYNC_INTERVAL_SECONDS:-600}
      MAQSAM_SYNC_LOOKBACK_SECONDS: ${MAQSAM_SYNC_LOOKBACK_SECONDS:-10800}
      MAQSAM_SYNC_PAGE_COUNT: ${MAQSAM_SYNC_PAGE_COUNT:-12}
      HUBSPOT_PRIVATE_APP_TOKEN: ${HUBSPOT_PRIVATE_APP_TOKEN:-}
    volumes:
      - sdr_runtime_env:/run/sdr-env:ro
    networks:
      - default
    logging: *default-logging

volumes:
  sdr_runtime_env:
    name: sdr_runtime_env
  sdr_app_data:
    name: sdr_app_data
  sdr_dashboard_cache:
    name: sdr_dashboard_cache
  sdr_postgres_data:
    name: sdr_postgres_data

networks:
  data_private:
    internal: true
  traefik_proxy:
    external: true
    name: n8n_default
