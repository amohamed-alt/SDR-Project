name: sdr-project

services:
  runtime-bootstrap:
    image: alpine:3.21
    restart: "no"
    security_opt:
      - no-new-privileges:true
    command:
      - /bin/sh
      - -c
      - |
        set -eu

        ENV_TARGET=/runtime-env/.env
        DATA_MARKER=/runtime-data/.sdr-runtime-data-v1

        env_has_required_keys() {
          FILE="$$1"
          [ -s "$$FILE" ] || return 1
          for KEY in \
            HUBSPOT_PRIVATE_APP_TOKEN \
            GOOGLE_CLIENT_ID \
            GOOGLE_CLIENT_SECRET \
            GOOGLE_TOKEN_ENCRYPTION_KEY \
            GOOGLE_REDIRECT_URI; do
            VALUE="$$(grep "^$${KEY}=" "$$FILE" 2>/dev/null | tail -n1 | cut -d= -f2- | sed "s/^['\"]//;s/['\"]$$//" || true)"
            [ -n "$$VALUE" ] || return 1
          done
          return 0
        }

        find_valid_env_source() {
          if env_has_required_keys /host-root/SDR-Project/.env; then
            printf '%s\n' /host-root/SDR-Project/.env
            return 0
          fi

          for CANDIDATE in $$(ls -1t /host-root/sdr-env-before-keys-* 2>/dev/null || true); do
            if env_has_required_keys "$$CANDIDATE"; then
              printf '%s\n' "$$CANDIDATE"
              return 0
            fi
          done
          return 1
        }

        if ! env_has_required_keys "$$ENV_TARGET"; then
          SOURCE="$$(find_valid_env_source || true)"
          if [ -z "$$SOURCE" ]; then
            echo "FATAL: no preserved VPS env contains the required HubSpot + Google runtime keys." >&2
            exit 78
          fi

          umask 077
          cp "$$SOURCE" "$$ENV_TARGET.tmp"
          chown 1001:1001 "$$ENV_TARGET.tmp"
          chmod 0400 "$$ENV_TARGET.tmp"
          mv "$$ENV_TARGET.tmp" "$$ENV_TARGET"
          echo "Persistent SDR runtime env initialized/repaired from a preserved VPS env backup."
        else
          echo "Persistent SDR runtime env is valid; preserving existing secrets."
        fi

        if [ ! -e "$$DATA_MARKER" ]; then
          if [ -d /host-root/SDR-Project/data ]; then
            cp -a /host-root/SDR-Project/data/. /runtime-data/ 2>/dev/null || true
          fi
          chown -R 1001:1001 /runtime-data
          touch "$$DATA_MARKER"
          chown 1001:1001 "$$DATA_MARKER"
          echo "Persistent SDR data volume initialized."
        else
          echo "Persistent SDR data volume already initialized."
        fi
    volumes:
      - /root:/host-root:ro
      - sdr_runtime_env:/runtime-env
      - sdr_app_data:/runtime-data

  sdr-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      runtime-bootstrap:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      SDR_RUNTIME_ENV_FILE: /run/sdr-env/.env
      SDR_RUNTIME_ENV_SCHEMA: "2"
      ACQUISITION_SNAPSHOT_PATH: /app/data/acquisition-dashboard.json
      GOOGLE_TOKEN_STORE_PATH: /app/data/google-calendar.json
      HIRING_SNAPSHOT_PATH: /app/data/hiring-signals.json
      HIRING_SCAN_LIMIT: 160
      HIRING_SCAN_CONCURRENCY: 10
      CAREER_INTELLIGENCE_STORE_PATH: /app/data/career-intelligence.json
      CAREER_ENGINE_URL: http://gtm-career-browser:3000/career-detect
      CAREER_ENGINE_TIMEOUT_MS: 90000
      CAREER_SCAN_LIMIT: 25
      CAREER_SCAN_CONCURRENCY: 6
      CAREER_PORTFOLIO_CACHE_MS: 60000
    ports:
      - "127.0.0.1:3010:3000"
    volumes:
      - sdr_runtime_env:/run/sdr-env:ro
      - sdr_app_data:/app/data
    networks:
      - default
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.routers.sdr-dashboard.rule=Host(`sdr.dashboardtalentera.tech`)"
      - "traefik.http.routers.sdr-dashboard.entrypoints=websecure"
      - "traefik.http.routers.sdr-dashboard.tls=true"
      - "traefik.http.routers.sdr-dashboard.tls.certresolver=mytlschallenge"
      - "traefik.http.services.sdr-dashboard.loadbalancer.server.port=3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 8s
      start_period: 30s
      retries: 5

  gtm-career-browser:
    build:
      context: ./services/career-browser
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    mem_limit: "1800m"
    cpus: 2.0
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined
    environment:
      PORT: 3000
      CACHE_FILE: /data/cache.json
      CACHE_TTL_DAYS: 30
      MAX_STATIC_PAGES: 30
      MAX_BROWSER_STEPS: 8
      MAX_BROWSER_CONTEXTS: 2
      REQUEST_TIMEOUT_MS: 10000
      BROWSER_TIMEOUT_MS: 50000
    volumes:
      - career_browser_cache:/data
    networks:
      - traefik_proxy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(async r=>{const j=await r.json();if(!r.ok||!j.capabilities?.includes('career-detect'))process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 8s
      start_period: 35s
      retries: 5

  hiring-refresh:
    image: alpine:3.21
    restart: unless-stopped
    depends_on:
      runtime-bootstrap:
        condition: service_completed_successfully
      sdr-dashboard:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        sleep 5
        while true; do
          wget -qO- --timeout=300 --post-data='' http://sdr-dashboard:3000/api/hiring/refresh || true
          sleep 900
        done
    networks:
      - default

  career-validation:
    image: alpine:3.21
    restart: on-failure
    depends_on:
      runtime-bootstrap:
        condition: service_completed_successfully
      sdr-dashboard:
        condition: service_healthy
      gtm-career-browser:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        set -e
        MARKER=/data/career-validation-v1.done
        STATE=/data/career-validation-v1.state
        if [ -f "$$MARKER" ]; then
          printf 'completed:%s\n' "$$(cat "$$MARKER" 2>/dev/null || true)" > "$$STATE"
          echo "Career validation batch v1 already completed."
          exit 0
        fi
        printf 'started:%s\n' "$$(date -u +%FT%TZ)" > "$$STATE"
        echo "Running one-time Career Intelligence validation batch (25 companies)..."
        if wget -qO /tmp/career-validation.json --timeout=900 \
          --header='Content-Type: application/json' \
          --post-data='{"limit":25}' \
          http://sdr-dashboard:3000/api/career-intelligence/run; then
          date -u +%FT%TZ > "$$MARKER"
          printf 'completed:%s\n' "$$(cat "$$MARKER")" > "$$STATE"
          echo "Career validation batch v1 completed."
        else
          CODE=$$?
          printf 'failed:%s:%s\n' "$$CODE" "$$(date -u +%FT%TZ)" > "$$STATE"
          echo "Career validation batch failed with exit $$CODE; Docker will retry."
          exit "$$CODE"
        fi
    volumes:
      - sdr_app_data:/data
    networks:
      - default

  career-refresh:
    image: alpine:3.21
    restart: unless-stopped
    depends_on:
      runtime-bootstrap:
        condition: service_completed_successfully
      sdr-dashboard:
        condition: service_healthy
      gtm-career-browser:
        condition: service_healthy
      career-validation:
        condition: service_completed_successfully
    environment:
      SDR_RUNTIME_ENV_SCHEMA: "2"
    command:
      - /bin/sh
      - -c
      - |
        set -a
        . /run/sdr-env/.env
        set +a
        CAREER_AUTO_SCAN_ENABLED="$${CAREER_AUTO_SCAN_ENABLED:-true}"
        CAREER_SCAN_LIMIT="$${CAREER_SCAN_LIMIT:-25}"
        CAREER_AUTO_SCAN_INTERVAL_SECONDS="$${CAREER_AUTO_SCAN_INTERVAL_SECONDS:-45}"
        CAREER_AUTO_SCAN_IDLE_SECONDS="$${CAREER_AUTO_SCAN_IDLE_SECONDS:-3600}"

        if [ "$$CAREER_AUTO_SCAN_ENABLED" != "true" ]; then
          echo "Career auto scan disabled by runtime configuration."
          while true; do sleep 3600; done
        fi

        sleep 8
        while true; do
          RESULT="$$(wget -qO- --timeout=900 \
            --header='Content-Type: application/json' \
            --post-data="{\"limit\":$${CAREER_SCAN_LIMIT}}" \
            http://sdr-dashboard:3000/api/career-intelligence/run || true)"
          printf '%s\n' "$$RESULT"
          if printf '%s' "$$RESULT" | grep -q '"remainingEligible":0'; then
            echo "Career backfill complete; entering low-frequency idle mode."
            sleep "$$CAREER_AUTO_SCAN_IDLE_SECONDS"
          else
            sleep "$$CAREER_AUTO_SCAN_INTERVAL_SECONDS"
          fi
        done
    volumes:
      - sdr_runtime_env:/run/sdr-env:ro
    networks:
      - default

volumes:
  sdr_runtime_env:
    name: sdr_runtime_env
  sdr_app_data:
    name: sdr_app_data
  career_browser_cache:
    name: sdr_career_browser_cache

networks:
  traefik_proxy:
    external: true
    name: n8n_default
