name: sdr-project

services:
  sdr-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Production secrets live outside the repository so Hostinger/GitHub deploys
    # cannot replace them. Override SDR_ENV_FILE only for local/CI validation.
    env_file:
      - ${SDR_ENV_FILE:-/root/sdr-production.env}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      ACQUISITION_SNAPSHOT_PATH: /app/data/acquisition-dashboard.json
      GOOGLE_TOKEN_STORE_PATH: /app/data/google-calendar.json
      HIRING_SNAPSHOT_PATH: /app/data/hiring-signals.json
      HIRING_SCAN_LIMIT: ${HIRING_SCAN_LIMIT:-160}
      HIRING_SCAN_CONCURRENCY: ${HIRING_SCAN_CONCURRENCY:-10}
      CAREER_INTELLIGENCE_STORE_PATH: /app/data/career-intelligence.json
      CAREER_ENGINE_URL: ${CAREER_ENGINE_URL:-http://gtm-career-browser:3000/career-detect}
      CAREER_ENGINE_TIMEOUT_MS: ${CAREER_ENGINE_TIMEOUT_MS:-90000}
      CAREER_SCAN_LIMIT: ${CAREER_SCAN_LIMIT:-25}
      CAREER_SCAN_CONCURRENCY: ${CAREER_SCAN_CONCURRENCY:-6}
      CAREER_PORTFOLIO_CACHE_MS: ${CAREER_PORTFOLIO_CACHE_MS:-60000}
    ports:
      - "127.0.0.1:3010:3000"
    volumes:
      - /root/SDR-Project/data:/app/data
    networks:
      - default
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.routers.sdr-dashboard.rule=Host(`sdr.dashboardtalentera.tech`)"
      - "traefik.http.routers.sdr-dashboard.entrypoints=websecure"
      - "traefik.http.routers.sdr-dashboard.tls=true"
      - "traefik.http.routers.sdr-dashboard.tls.certresolver=mytlschallenge"
      - "traefik.http.services.sdr-dashboard.loadbalancer.server.port=3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 8s
      start_period: 30s
      retries: 5

  gtm-career-browser:
    build:
      context: ./services/career-browser
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    mem_limit: "1800m"
    cpus: 2.0
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined
    environment:
      PORT: 3000
      CACHE_FILE: /data/cache.json
      CACHE_TTL_DAYS: 30
      MAX_STATIC_PAGES: 30
      MAX_BROWSER_STEPS: 8
      MAX_BROWSER_CONTEXTS: 2
      REQUEST_TIMEOUT_MS: 10000
      BROWSER_TIMEOUT_MS: 50000
    volumes:
      - career_browser_cache:/data
    networks:
      - traefik_proxy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(async r=>{const j=await r.json();if(!r.ok||!j.capabilities?.includes('career-detect'))process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 8s
      start_period: 35s
      retries: 5

  hiring-refresh:
    image: alpine:3.21
    restart: unless-stopped
    depends_on:
      sdr-dashboard:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        sleep 5
        while true; do
          wget -qO- --timeout=300 \
            --post-data='' \
            http://sdr-dashboard:3000/api/hiring/refresh || true
          sleep 900
        done
    networks:
      - default

  career-validation:
    image: alpine:3.21
    restart: on-failure
    depends_on:
      sdr-dashboard:
        condition: service_healthy
      gtm-career-browser:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        set -e
        MARKER=/data/career-validation-v1.done
        STATE=/data/career-validation-v1.state
        if [ -f "$$MARKER" ]; then
          printf 'completed:%s\n' "$$(cat "$$MARKER" 2>/dev/null || true)" > "$$STATE"
          echo "Career validation batch v1 already completed."
          exit 0
        fi
        printf 'started:%s\n' "$$(date -u +%FT%TZ)" > "$$STATE"
        echo "Running one-time Career Intelligence validation batch (25 companies)..."
        if wget -qO /tmp/career-validation.json --timeout=900 \
          --header='Content-Type: application/json' \
          --post-data='{"limit":25}' \
          http://sdr-dashboard:3000/api/career-intelligence/run; then
          date -u +%FT%TZ > "$$MARKER"
          printf 'completed:%s\n' "$$(cat "$$MARKER")" > "$$STATE"
          echo "Career validation batch v1 completed."
        else
          CODE=$$?
          printf 'failed:%s:%s\n' "$$CODE" "$$(date -u +%FT%TZ)" > "$$STATE"
          echo "Career validation batch failed with exit $$CODE; Docker will retry."
          exit "$$CODE"
        fi
    volumes:
      - /root/SDR-Project/data:/data
    networks:
      - default

  career-refresh:
    image: alpine:3.21
    restart: unless-stopped
    environment:
      CAREER_AUTO_SCAN_ENABLED: ${CAREER_AUTO_SCAN_ENABLED:-true}
      CAREER_SCAN_LIMIT: ${CAREER_SCAN_LIMIT:-25}
      CAREER_AUTO_SCAN_INTERVAL_SECONDS: ${CAREER_AUTO_SCAN_INTERVAL_SECONDS:-45}
      CAREER_AUTO_SCAN_IDLE_SECONDS: ${CAREER_AUTO_SCAN_IDLE_SECONDS:-3600}
    depends_on:
      sdr-dashboard:
        condition: service_healthy
      gtm-career-browser:
        condition: service_healthy
      career-validation:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -c
      - |
        if [ "$${CAREER_AUTO_SCAN_ENABLED:-true}" != "true" ]; then
          echo "Career auto scan disabled by explicit production configuration."
          while true; do sleep 3600; done
        fi
        sleep 8
        while true; do
          RESULT="$$(wget -qO- --timeout=900 \
            --header='Content-Type: application/json' \
            --post-data="{\"limit\":$${CAREER_SCAN_LIMIT:-25}}" \
            http://sdr-dashboard:3000/api/career-intelligence/run || true)"
          printf '%s\n' "$$RESULT"
          if printf '%s' "$$RESULT" | grep -q '"remainingEligible":0'; then
            echo "Career backfill complete; entering low-frequency idle mode."
            sleep "$${CAREER_AUTO_SCAN_IDLE_SECONDS:-3600}"
          else
            sleep "$${CAREER_AUTO_SCAN_INTERVAL_SECONDS:-45}"
          fi
        done
    networks:
      - default

volumes:
  career_browser_cache:

networks:
  traefik_proxy:
    external: true
    name: n8n_default
