name: sdr-hubspot-property-once

services:
  hubspot-property:
    image: curlimages/curl:8.10.1
    user: "0:0"
    restart: "no"
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        set -a
        . /run/sdr-env/.env
        set +a
        test -n "$$HUBSPOT_PRIVATE_APP_TOKEN"
        API='https://api.hubapi.com/crm/v3/properties/contacts/gtm_email_status'
        curl --silent --show-error --fail \
          -H "Authorization: Bearer $$HUBSPOT_PRIVATE_APP_TOKEN" \
          "$$API" > /tmp/before.json
        grep -Fq '"name":"gtm_email_status"' /tmp/before.json
        grep -Fq '"type":"enumeration"' /tmp/before.json
        for STATUS in valid catch_all invalid unknown; do
          grep -Fq "\"value\":\"$$STATUS\"" /tmp/before.json
        done
        echo 'Existing HubSpot property and statuses verified.'
        curl --silent --show-error --fail \
          -X PATCH \
          -H "Authorization: Bearer $$HUBSPOT_PRIVATE_APP_TOKEN" \
          -H 'Content-Type: application/json' \
          -d '{"label":"MillionVerifier Status"}' \
          "$$API" > /tmp/update.json
        curl --silent --show-error --fail \
          -H "Authorization: Bearer $$HUBSPOT_PRIVATE_APP_TOKEN" \
          "$$API" > /tmp/after.json
        grep -Fq '"name":"gtm_email_status"' /tmp/after.json
        grep -Fq '"label":"MillionVerifier Status"' /tmp/after.json
        grep -Fq '"type":"enumeration"' /tmp/after.json
        for STATUS in valid catch_all invalid unknown; do
          grep -Fq "\"value\":\"$$STATUS\"" /tmp/after.json
        done
        echo 'HUBSPOT_PROPERTY_RECONCILED name=gtm_email_status label=MillionVerifier_Status statuses=valid,catch_all,invalid,unknown'
    volumes:
      - sdr_runtime_env:/run/sdr-env:ro

volumes:
  sdr_runtime_env:
    external: true
    name: sdr-project_sdr_runtime_env
